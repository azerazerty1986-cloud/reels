<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛍️ المنتجات</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#0a0a1a;color:#fff;padding:12px}
  button{width:100%;padding:14px;border:0;border-radius:10px;
         background:#4ade80;color:#000;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
  #grid{display:grid;gap:10px;margin-top:12px;
        grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{background:#1a1a2e;border-radius:10px;overflow:hidden}
  .card img{width:100%;height:150px;object-fit:cover;display:block}
  .card .body{padding:10px;font-size:13px;line-height:1.7}
  .card .name{color:#86efac;font-weight:700;margin-bottom:4px}
  .card .price{color:#fbbf24;font-weight:700}
  .empty{text-align:center;padding:40px;color:#666;grid-column:1/-1}
</style>
</head>
<body>

<button id="btn" onclick="go()">🔄 جلب المنتجات</button>
<div id="grid"></div>

<script>
const ORDER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-_.@#$%^&*()+/=?!,;\'"<>';
const TILE = {};
[...ORDER].forEach((c,i)=>TILE[c]=Math.floor(i/12)+'_'+(i%12));

function readCreds(){
  // 1) النسخ الاحتياطية أولاً
  const src = localStorage.getItem('magic_credentials_source_v1') || 'local';
  const bk = src==='channel' ? 'magic_credentials_channel_v1' : 'magic_credentials_local_v1';
  for (const k of [bk, 'magic_credentials_full_v1']) {
    try {
      const b = JSON.parse(localStorage.getItem(k)||'null');
      if (b?.token && b?.chatId) return {token:b.token, chatId:b.chatId};
    } catch(_){}
  }
  // 2) قراءة من المربعات
  let tiles = {};
  try { tiles = JSON.parse(localStorage.getItem('tiles_world_icon_16')||'{}') } catch(_){}
  const t={}, i={};
  for (const c of ORDER){
    const tile = tiles[TILE[c]];
    if(!tile?.files) continue;
    let m={}; try{ m=JSON.parse(tile.files['credential.json']||'{}') }catch(_){}
    if(m.char !== c) continue;
    (m.tokenPositions||[]).forEach(p=>t[p]=c);
    (m.idPositions||[]).forEach(p=>i[p]=c);
  }
  const build = map => {
    const ps = Object.keys(map).map(Number).sort((a,b)=>a-b);
    if(!ps.length) return '';
    for(let x=0;x<ps.length;x++) if(ps[x]!==x+1) return '';
    return ps.map(p=>map[p]).join('');
  };
  const token = build(t), chatId = build(i);
  return token && chatId ? {token, chatId} : null;
}

function parse(txt){
  if(!/منتج\s*جديد/.test(txt)) return null;
  if(!/📦\s*المنتج/.test(txt)) return null;
  const r = l => { const m = txt.match(new RegExp(l+'\\s*[:：]\\s*(.+?)(?=\\n|$)')); return m?m[1].trim():'' };
  const p = {
    name:     r('📦\\s*المنتج'),
    price:    r('💰\\s*السعر'),
    category: r('🏷️\\s*القسم'),
    quantity: r('📊\\s*الكمية'),
    pid:      r('🆔\\s*معرف\\s*المنتج'),
    store:    r('🏪\\s*المتجر'),
    desc:     r('📝\\s*الوصف')
  };
  return p.name ? p : null;
}

function show(list){
  const g = document.getElementById('grid');
  if(!list.length){ g.innerHTML='<div class="empty">لا توجد منتجات</div>'; return }
  g.innerHTML = list.map(p=>`
    <div class="card">
      ${p.img?`<img src="${p.img}" loading="lazy" onerror="this.remove()">`:''}
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="price">${p.price}</div>
        <div>🏷️ ${p.category}</div>
        <div>📊 ${p.quantity}</div>
        <div>🆔 ${p.pid}</div>
        <div>🏪 ${p.store}</div>
        ${p.desc?`<div>📝 ${p.desc}</div>`:''}
      </div>
    </div>`).join('');
}

async function go(){
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '⏳ جاري الجلب...';
  try {
    const c = readCreds();
    if(!c) throw new Error('لم أجد الإعدادات في مربعات أيقونة السحر 🧙');

    const r = await fetch(`https://api.telegram.org/bot${c.token}/getUpdates?limit=100`);
    const d = await r.json();
    if(!d.ok) throw new Error(d.description);

    const chatId = c.chatId.startsWith('-100') ? c.chatId : '-100'+c.chatId;
    const list = [];

    for(const u of (d.result||[])){
      const m = u.channel_post || u.edited_channel_post || u.message;
      if(!m) continue;
      if(String(m.chat?.id) !== chatId) continue;
      const p = parse(m.caption || m.text || '');
      if(!p) continue;

      if(m.photo?.length){
        try{
          const fid = m.photo[m.photo.length-1].file_id;
          const fr = await fetch(`https://api.telegram.org/bot${c.token}/getFile?file_id=${fid}`);
          const fd = await fr.json();
          if(fd.ok) p.img = `https://api.telegram.org/file/bot${c.token}/${fd.result.file_path}`;
        }catch(_){}
      }
      list.push(p);
    }

    show(list);
    if(!list.length) alert('لا توجد منتجات بالتنسيق المحدد');
  } catch(e){ alert('❌ ' + e.message) }
  finally { btn.disabled = false; btn.textContent = '🔄 جلب المنتجات' }
}
</script>
</body>
</html>
