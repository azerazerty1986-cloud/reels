<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 استوديو المجسمات المتكامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cairo',sans-serif;background:#050510;color:#fff;overflow:hidden;height:100vh}
  canvas{display:block}

  /* ═══ زر القائمة العائم ═══ */
  #toolbarToggle{
    position:fixed;top:12px;left:12px;z-index:150;
    width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(139,92,246,0.6);
    background:rgba(8,8,20,0.9);backdrop-filter:blur(16px);
    color:#a78bfa;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  #toolbarToggle:hover{background:rgba(139,92,246,0.3);transform:scale(1.1);border-color:#a78bfa}
  #toolbarToggle.open{background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;border-color:#06b6d4}

  /* ═══ شريط الأدوات القابل للطي ═══ */
  #toolbar{
    position:fixed;top:70px;left:12px;z-index:149;
    display:flex;flex-direction:column;gap:6px;
    background:rgba(8,8,20,0.95);backdrop-filter:blur(20px);
    padding:10px;border-radius:16px;
    border:1px solid rgba(139,92,246,0.35);
    max-height:calc(100vh - 100px);overflow-y:auto;width:175px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    transform:translateX(-110%);opacity:0;pointer-events:none;
    transition:transform .3s ease,opacity .3s ease;
  }
  #toolbar.open{transform:translateX(0);opacity:1;pointer-events:auto}
  #toolbar::-webkit-scrollbar{width:5px}
  #toolbar::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}

  .btn{
    padding:10px 12px;border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.04);
    color:#ccc;font-family:inherit;font-size:12px;font-weight:700;
    cursor:pointer;transition:all .25s;text-align:right;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .btn:hover{background:rgba(139,92,246,0.25);border-color:rgba(139,92,246,0.6);color:#fff;transform:translateX(4px)}
  .btn.active{background:rgba(74,222,128,0.2);border-color:rgba(74,222,128,0.5);color:#4ade80}
  .btn.danger{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);color:#f87171}
  .btn.gold{background:rgba(251,191,36,0.15);border-color:rgba(251,191,36,0.3);color:#fbbf24}

  /* ═══ اللوحات الجانبية ═══ */
  .panel{
    position:fixed;top:70px;right:12px;z-index:148;
    width:min(340px,92vw);max-height:calc(100vh - 90px);
    overflow-y:auto;background:rgba(8,8,20,0.96);
    backdrop-filter:blur(20px);
    border:1px solid rgba(139,92,246,0.3);
    border-radius:16px;padding:16px;display:none;
  }
  .panel.open{display:block}
  .panel h3{color:#a78bfa;font-size:14px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px}
  .panel label{display:block;color:#aaa;font-size:11px;margin:10px 0 5px}
  .panel input,.panel select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:#fff;font-family:inherit;font-size:12px}
  .panel input:focus,.panel select:focus{outline:none;border-color:rgba(139,92,246,0.5)}
  .panel::-webkit-scrollbar{width:5px}
  .panel::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* ═══ شريط الحالة ═══ */
  #status{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;
    padding:10px 20px;border-radius:12px;
    background:rgba(8,8,20,0.96);border:1px solid rgba(139,92,246,0.4);
    color:#fff;font-size:12px;display:none;max-width:92vw;text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  #status.show{display:block;animation:slideUp .3s ease}
  @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  #status.success{border-color:rgba(74,222,128,0.5);color:#4ade80}
  #status.error{border-color:rgba(239,68,68,0.5);color:#f87171}
  #status.warning{border-color:rgba(251,191,36,0.5);color:#fbbf24}

  /* ═══ معلومات أعلى اليسار (تختفي عند فتح القائمة) ═══ */
  #info{
    position:fixed;top:12px;left:70px;z-index:99;
    background:rgba(0,0,0,0.7);padding:8px 14px;border-radius:12px;
    font-size:11px;color:#888;border:1px solid rgba(255,255,255,0.06);
    transition:opacity .3s;
  }
  #toolbar.open ~ #info{opacity:0;pointer-events:none}

  /* ═══ شريط التقدم ═══ */
  #progressBar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#8b5cf6,#06b6d4);z-index:200;width:0%;transition:width .3s}

  /* ═══ لوحة الأبعاد (يمين أسفل) ═══ */
  #dimensions{
    position:fixed;bottom:70px;right:12px;z-index:99;
    background:rgba(8,8,20,0.95);padding:10px 14px;border-radius:12px;
    font-size:11px;border:1px solid rgba(139,92,246,0.3);
    display:none;color:#a78bfa;line-height:1.9;min-width:200px;
  }
  #dimensions.show{display:block}
  #dimensions b{color:#4ade80}
  #dimensions .warn{color:#f87171;font-size:10px}
  #dimensions .ok{color:#4ade80;font-size:10px}

  /* ═══ شبكة الأجزاء ═══ */
  #partsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:10px}
  .part-card{
    padding:8px;background:rgba(74,222,128,0.08);
    border:1px solid rgba(74,222,128,0.3);border-radius:8px;
    font-size:10px;text-align:center;cursor:pointer;transition:all .2s;
  }
  .part-card:hover{background:rgba(74,222,128,0.2);transform:scale(1.05)}
  .part-card .icon{font-size:20px;display:block;margin-bottom:4px}
  .part-card.selected{border-color:#fbbf24;background:rgba(251,191,36,0.15)}

  /* ═══ لوحة الألوان ═══ */
  #colorPicker{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .color-swatch{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid rgba(255,255,255,0.15);transition:all .2s}
  .color-swatch:hover{transform:scale(1.15);border-color:#fff}
  .color-swatch.active{border-color:#fbbf24;transform:scale(1.15)}

  /* ═══ معلومات الدمج ═══ */
  #mergeInfo{margin-top:10px;padding:10px;background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.3);border-radius:8px;font-size:11px;color:#67e8f9;display:none}
  #mergeInfo.show{display:block}

  /* ═══ إحصائيات ═══ */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .stat-box{background:rgba(255,255,255,0.04);padding:8px;border-radius:8px;text-align:center}
  .stat-box .val{font-size:16px;font-weight:900;color:#4ade80;display:block}
  .stat-box .lbl{font-size:9px;color:#888}

  /* ═══ التحقق ═══ */
  #validationResult{margin-top:10px;padding:10px;border-radius:8px;font-size:11px;display:none}
  #validationResult.show{display:block}
  #validationResult.valid{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);color:#4ade80}
  #validationResult.invalid{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171}

  /* ═══ أزرار النوافذ ═══ */
  .pos-btn,.rot-btn,.dur-btn,.out-btn{
    padding:8px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;
    background:rgba(255,255,255,0.04);color:#ccc;font-family:inherit;
    font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;
  }
  .pos-btn:hover,.rot-btn:hover,.dur-btn:hover,.out-btn:hover{background:rgba(139,92,246,0.2);border-color:rgba(139,92,246,0.5);color:#fff}
  .pos-btn.active,.dur-btn.active{background:rgba(251,191,36,0.2);border-color:rgba(251,191,36,0.5);color:#fbbf24}
  .out-btn.active{background:rgba(74,222,128,0.2);border-color:rgba(74,222,128,0.5);color:#4ade80}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}

  @media (max-width:600px){
    #toolbar{width:160px;top:66px;left:8px}
    #toolbarToggle{top:10px;left:10px;width:42px;height:42px;font-size:18px}
    #info{display:none}
  }
</style>
</head>
<body>

<div id="progressBar"></div>
<div id="info">🖱️ اسحب للتدوير • عجلة الفأرة للتكبير</div>

<div id="dimensions">
  <div>📐 <b>الأبعاد:</b></div>
  <div>العرض (X): <b id="dimX">0</b></div>
  <div>الارتفاع (Y): <b id="dimY">0</b></div>
  <div>العمق (Z): <b id="dimZ">0</b></div>
  <div>📦 الحجم: <b id="dimVol">0</b> cm³</div>
  <div>🔺 المثلثات: <b id="dimTris">0</b></div>
  <div id="printCheck"></div>
</div>

<!-- ═══ زر القائمة العائم ═══ -->
<button id="toolbarToggle" onclick="toggleToolbar()" title="القائمة">☰</button>

<!-- ═══ شريط الأدوات القابل للطي ═══ -->
<div id="toolbar">
  <button class="btn" onclick="openFilePicker()">📁 <span>فتح مجسم</span></button>
  <button class="btn" onclick="generateDemoModel()">🎨 <span>مجسم تجريبي</span></button>
  <button class="btn" id="btnWireframe" onclick="toggleWireframe()">🔲 <span>إطار سلكي</span></button>
  <button class="btn" id="btnRotate" onclick="toggleAutoRotate()">⏸️ <span>إيقاف الدوران</span></button>
  <button class="btn" onclick="resetView()">🔄 <span>إعادة تعيين</span></button>
  <button class="btn" onclick="togglePanel('splitPanel')">✂️ <span>تقسيم</span></button>
  <button class="btn" onclick="togglePanel('mergePanel')">🔗 <span>دمج</span></button>
  <button class="btn" onclick="openVideoUploadModal()">🎬 <span>فيديو</span></button>
  <button class="btn" onclick="openCaptureModal()">📸 <span>تصوير</span></button>
  <button class="btn" onclick="togglePanel('channelPanel')">📡 <span>القناة</span></button>
  <button class="btn" onclick="togglePanel('toolsPanel')">🛠️ <span>أدوات</span></button>
</div>

<!-- ═══ لوحة التقسيم ═══ -->
<div id="splitPanel" class="panel">
  <h3>✂️ تقسيم المجسم</h3>
  <label>عدد القطع:</label>
  <select id="partCount">
    <option value="2">قطعتان (نصفين)</option>
    <option value="4">4 قطع</option>
    <option value="6">6 قطع</option>
    <option value="8" selected>8 قطع</option>
    <option value="12">12 قطعة</option>
  </select>
  <label>اتجاه القطع:</label>
  <select id="cutAxis">
    <option value="x">المحور X (يمين/يسار)</option>
    <option value="y">المحور Y (أعلى/أسفل)</option>
    <option value="z" selected>المحور Z (أمام/خلف)</option>
  </select>
  <button class="btn" style="width:100%;margin-top:12px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);border:0;color:#fff;justify-content:center" onclick="splitModel()">✂️ تنفيذ التقسيم</button>
  <div id="partsGrid"></div>
  <button class="btn" id="btnDownloadAll" style="width:100%;margin-top:10px;display:none;justify-content:center" onclick="downloadAllParts()">📥 تحميل كل الأجزاء</button>
  <button class="btn" id="btnShowParts" style="width:100%;margin-top:8px;display:none;justify-content:center" onclick="showPartsInViewer()">👁️ عرض الأجزاء</button>
  <button class="btn" id="btnUploadChannel" style="width:100%;margin-top:8px;display:none;justify-content:center" onclick="uploadPartsToChannel()">📤 رفع الأجزاء للقناة</button>
</div>

<!-- ═══ لوحة الدمج ═══ -->
<div id="mergePanel" class="panel">
  <h3>🔗 دمج الأجزاء</h3>
  <p style="color:#888;font-size:11px;line-height:1.7;margin-bottom:10px">اختر جزئين أو أكثر لدمجها في مجسم واحد.</p>
  <div id="mergePartsList"></div>
  <button class="btn" style="width:100%;margin-top:12px;background:linear-gradient(135deg,#06b6d4,#4ade80);border:0;color:#fff;justify-content:center" onclick="mergeSelectedParts()">🔗 دمج المحدد</button>
  <button class="btn" style="width:100%;margin-top:8px;justify-content:center" onclick="mergeAllParts()">🔗 دمج الكل</button>
  <div id="mergeInfo"></div>
  <button class="btn" style="width:100%;margin-top:8px;display:none;justify-content:center" id="btnDownloadMerged" onclick="downloadMerged()">📥 تحميل المجسم المدمج</button>
</div>

<!-- ═══ لوحة القناة ═══ -->
<div id="channelPanel" class="panel">
  <h3>📡 قناة تلجرام</h3>
  <label>Bot Token:</label>
  <input type="password" id="tgToken" placeholder="123456:ABC-DEF..." autocomplete="off">
  <label>Chat ID:</label>
  <input type="text" id="tgChatId" placeholder="-1001234567890" autocomplete="off">
  <div class="row" style="margin-top:12px">
    <button class="btn" onclick="testChannel()" style="justify-content:center">🧪 اختبار</button>
    <button class="btn" onclick="saveChannelConfig()" style="justify-content:center">💾 حفظ</button>
  </div>
  <div id="channelStatus" style="margin-top:10px;font-size:11px;color:#888;text-align:center"></div>
  <button class="btn" style="width:100%;margin-top:8px;justify-content:center" onclick="copyTileLink()">🔗 نسخ رابط المربع</button>
</div>

<!-- ═══ لوحة الأدوات ═══ -->
<div id="toolsPanel" class="panel">
  <h3>🛠️ أدوات متقدمة</h3>
  <label>🎨 لون المجسم:</label>
  <div id="colorPicker"></div>
  <div class="stats-grid">
    <div class="stat-box"><span class="val" id="statParts">0</span><span class="lbl">🧩 أجزاء</span></div>
    <div class="stat-box"><span class="val" id="statVerts">0</span><span class="lbl">🔺 مثلثات</span></div>
  </div>
  <label>📏 وحدة القياس:</label>
  <select id="unitSelect" onchange="updateDimensions()">
    <option value="mm" selected>ملليمتر (mm)</option>
    <option value="cm">سنتيمتر (cm)</option>
    <option value="in">بوصة (in)</option>
  </select>
  <label>⚙️ جودة العرض:</label>
  <select id="qualitySelect" onchange="updateQuality()">
    <option value="low">منخفضة (سريع)</option>
    <option value="medium" selected>متوسطة</option>
    <option value="high">عالية (بطيء)</option>
  </select>
  <button class="btn gold" style="width:100%;margin-top:12px;justify-content:center" onclick="validateForPrinting()">🔍 التحقق من الطباعة</button>
  <div id="validationResult"></div>
  <button class="btn" style="width:100%;margin-top:8px;justify-content:center" onclick="centerModel()">🎯 تمركز المجسم</button>
  <button class="btn" style="width:100%;margin-top:8px;justify-content:center" onclick="scaleModelPrompt()">📐 تغيير الحجم</button>
  <button class="btn" style="width:100%;margin-top:8px;justify-content:center" onclick="smoothModel()">✨ تنعيم السطح</button>
  <button class="btn danger" style="width:100%;margin-top:8px;justify-content:center" onclick="clearScene()">🗑️ مسح الكل</button>
</div>

<input type="file" id="fileInput" accept=".stl,.obj,.glb,.gltf" style="display:none">
<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* ═══════════════════════════════════════════════════
   المتغيرات
   ═══════════════════════════════════════════════════ */
let scene, camera, renderer, controls;
let originalModel = null;
let originalGeometry = null;
let currentModel = null;
let parts = [];
let mergedGeometry = null;
let autoRotate = true;
let selectedPartIndex = -1;
let selectedMergeIndices = new Set();
let tileId = '0_0';
let worldId = 'main';

// فيديو
let videoTexture = null;
let videoMesh = null;
let videoElement = null;
let videoPosition = 'center';
let videoRotation = 0;
let videoScale = 1;
let videoOffsetX = 0, videoOffsetY = 0, videoOffsetZ = 0;

// تصوير
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let recordingStartTime = 0;
let recordingTimer = null;
let previewLoopId = null;
let recordDuration = 5;
let outputMode = 'download';

const COLORS = [0xec4899, 0x8b5cf6, 0x06b6d4, 0x4ade80, 0xf59e0b, 0xf87171, 0x22d3ee, 0xa78bfa, 0xfbbf24, 0x60a5fa, 0xf472b6, 0x34d399];

try {
  const params = new URLSearchParams(location.search);
  tileId = params.get('tile') || (window.parent?.ServerManager?.selectedTile) || '0_0';
  worldId = params.get('world') || (window.parent?.ServerManager?.currentWorldId) || 'main';
} catch(e) {}

/* ═══════════════════════════════════════════════════
   القائمة القابلة للطي
   ═══════════════════════════════════════════════════ */
function toggleToolbar() {
  const toolbar = document.getElementById('toolbar');
  const toggle = document.getElementById('toolbarToggle');
  toolbar.classList.toggle('open');
  toggle.classList.toggle('open');
  toggle.textContent = toolbar.classList.contains('open') ? '✖' : '☰';
}

document.addEventListener('click', (e) => {
  const toolbar = document.getElementById('toolbar');
  const toggle = document.getElementById('toolbarToggle');
  if (!toolbar || !toggle) return;
  if (toolbar.classList.contains('open') && !toolbar.contains(e.target) && !toggle.contains(e.target)) {
    toolbar.classList.remove('open');
    toggle.classList.remove('open');
    toggle.textContent = '☰';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const toolbar = document.getElementById('toolbar');
    const toggle = document.getElementById('toolbarToggle');
    if (toolbar && toolbar.classList.contains('open')) {
      toolbar.classList.remove('open');
      toggle.classList.remove('open');
      toggle.textContent = '☰';
    }
  }
});

/* ═══════════════════════════════════════════════════
   تهيئة
   ═══════════════════════════════════════════════════ */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(3, 3, 6);
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(5, 10, 7); dir.castShadow = true; scene.add(dir);
  const fill = new THREE.DirectionalLight(0x8888ff, 0.5);
  fill.position.set(-5, 3, -5); scene.add(fill);

  const grid = new THREE.GridHelper(12, 24, 0x8b5cf6, 0x2a2a4a);
  grid.material.transparent = true; grid.material.opacity = 0.4; scene.add(grid);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.minDistance = 1.5; controls.maxDistance = 25;

  const cp = document.getElementById('colorPicker');
  COLORS.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === 0 ? ' active' : '');
    sw.style.background = '#' + c.toString(16).padStart(6, '0');
    sw.onclick = () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      if (currentModel) {
        currentModel.traverse(ch => {
          if (ch.isMesh && ch.material) {
            ch.material.color.setHex(c);
            ch.material.emissive = new THREE.Color(c).multiplyScalar(0.05);
          }
        });
      }
      if (parts.length) showPartsInViewer();
    };
    cp.appendChild(sw);
  });

  animate();
  loadChannelConfig();
  loadDemoModel();
  showStatus('🎨 تم تحميل المجسم التجريبي — اضغط ☰ للأدوات', 'success');
}

function animate() {
  requestAnimationFrame(animate);
  if (currentModel && autoRotate) currentModel.rotation.y += 0.005;
  controls.update();
  renderer.render(scene, camera);
}

  const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x06b6d4 }));
  armL.position.set(-1.2, 0.3, 0); armL.rotation.z = -Math.PI / 4; group.add(armL);
  const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x4ade80 }));
  legR.position.set(0.4, -1.7, 0); group.add(legR);
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x4ade80 }));

function mergeGroupGeometry(group) {
  const positions = [];
  group.updateMatrixWorld(true);
  group.traverse(child => {
    if (child.isMesh && child.geometry) {
      const geo = child.geometry.clone();
      geo.applyMatrix4(child.matrixWorld);
      positions.push(...geo.attributes.position.array);
    }
  });
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  return merged;
}

    pillar.position.set(Math.cos(angle) * 0.8, -1.2, Math.sin(angle) * 0.8);
    group.add(pillar);

  base.position.y = -2; group.add(base);
  const merged = mergeGroupGeometry(group);
  merged.center(); merged.computeVertexNormals(); merged.computeBoundingBox();

}

function openFilePicker() { document.getElementById('fileInput').click(); }

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      if (ext === 'stl') {
        const geo = new THREE.STLLoader().parse(ev.target.result);
        geo.center(); geo.computeVertexNormals();
        originalGeometry = geo;
        displayModel(geo, 0xec4899);
        updateDimensions();
      } else if (ext === 'glb' || ext === 'gltf') {
        new THREE.GLTFLoader().parse(ev.target.result, '', (gltf) => {
          originalGeometry = null; currentModel = gltf.scene;
          scene.add(currentModel); originalModel = currentModel;
          fitCamera(currentModel); updateDimensions();
        });
      }
      showStatus('✅ تم تحميل: ' + file.name, 'success');
    } catch (err) { showStatus('❌ فشل: ' + err.message, 'error'); }
  };
  reader.readAsArrayBuffer(file);
};

function displayModel(geometry, color) {
  if (currentModel) { scene.remove(currentModel); disposeObject(currentModel); }
  const material = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.4, emissive: new THREE.Color(color).multiplyScalar(0.05) });
  currentModel = new THREE.Mesh(geometry, material);
  originalModel = currentModel;
  scene.add(currentModel);
  fitCamera(currentModel);
}

function fitCamera(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size*0.8, size*0.6, size*0.9));
  camera.lookAt(center); controls.update();
}

function disposeObject(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

/* ═══════════════════════════════════════════════════
   الأبعاد
   ═══════════════════════════════════════════════════ */
function updateDimensions() {
  if (!currentModel && !originalGeometry) { document.getElementById('dimensions').classList.remove('show'); return; }
  document.getElementById('dimensions').classList.add('show');
  const box = new THREE.Box3();
  if (currentModel) box.setFromObject(currentModel);
  else box.setFromBufferAttribute(originalGeometry.attributes.position);
  const size = box.getSize(new THREE.Vector3());
  const unit = document.getElementById('unitSelect').value;
  const factor = unit === 'mm' ? 1 : unit === 'cm' ? 0.1 : 0.0393701;
  const suffix = unit === 'mm' ? 'mm' : unit === 'cm' ? 'cm' : 'in';
  document.getElementById('dimX').textContent = (size.x * factor).toFixed(2) + ' ' + suffix;
  document.getElementById('dimY').textContent = (size.y * factor).toFixed(2) + ' ' + suffix;
  document.getElementById('dimZ').textContent = (size.z * factor).toFixed(2) + ' ' + suffix;
  document.getElementById('dimVol').textContent = ((size.x * size.y * size.z) / 1000).toFixed(2) + ' cm³';
  let tris = 0;
  if (currentModel) currentModel.traverse(c => { if (c.isMesh && c.geometry) tris += c.geometry.attributes.position.count / 3; });
  else if (originalGeometry) tris = originalGeometry.attributes.position.count / 3;
  document.getElementById('dimTris').textContent = Math.floor(tris).toLocaleString('ar');
  const maxDim = Math.max(size.x, size.y, size.z);
  const minDim = Math.min(size.x, size.y, size.z);
  const check = document.getElementById('printCheck');
  const warnings = [];
  if (maxDim > 250) warnings.push('⚠️ أكبر من 250mm');
  if (minDim < 1) warnings.push('⚠️ أجزاء رقيقة < 1mm');
  if (tris > 100000) warnings.push('⚠️ مثلثات كثيرة');
  check.innerHTML = warnings.length ? warnings.map(w => `<div class="warn">${w}</div>`).join('') : '<div class="ok">✅ جاهز للطباعة</div>';
}

function updateQuality() {
  const q = document.getElementById('qualitySelect').value;
  const pr = q === 'low' ? 1 : q === 'medium' ? Math.min(devicePixelRatio, 2) : Math.min(devicePixelRatio * 1.5, 3);
  renderer.setPixelRatio(pr);
  showStatus(`⚙️ الجودة: ${q === 'low' ? 'منخفضة' : q === 'medium' ? 'متوسطة' : 'عالية'}`, 'info');

/* ═══════════════════════════════════════════════════
   التقسيم
   ═══════════════════════════════════════════════════ */
function splitModel() {
  if (!originalGeometry) { showStatus('⚠️ حمّل مجسم STL أولاً', 'warning'); return; }
  const count = parseInt(document.getElementById('partCount').value);
  const axis = document.getElementById('cutAxis').value;
  const axisIndex = axis === 'x' ? 0 : axis === 'y' ? 1 : 2;
  originalGeometry.computeBoundingBox();
  const bbox = originalGeometry.boundingBox;
  const min = bbox.min.getComponent(axisIndex);
  const max = bbox.max.getComponent(axisIndex);
  const step = (max - min) / count;
  parts = [];
  const grid = document.getElementById('partsGrid');
  grid.innerHTML = '';
  setProgress(0);
  const posAttr = originalGeometry.attributes.position;
  const normAttr = originalGeometry.attributes.normal;
  for (let i = 0; i < count; i++) {
    const partMin = min + i * step;
    const partMax = min + (i + 1) * step;
    const positions = [], normals = [];
    for (let j = 0; j < posAttr.count; j += 3) {
      const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, j);
      const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, j+1);
      const v3 = new THREE.Vector3().fromBufferAttribute(posAttr, j+2);
      const inside = v => { const val = v.getComponent(axisIndex); return val >= partMin && val <= partMax; };
      if (inside(v1) && inside(v2) && inside(v3)) {
        positions.push(v1.x,v1.y,v1.z, v2.x,v2.y,v2.z, v3.x,v3.y,v3.z);
        if (normAttr) {
          const n1 = new THREE.Vector3().fromBufferAttribute(normAttr, j);
          const n2 = new THREE.Vector3().fromBufferAttribute(normAttr, j+1);
          const n3 = new THREE.Vector3().fromBufferAttribute(normAttr, j+2);
          normals.push(n1.x,n1.y,n1.z, n2.x,n2.y,n2.z, n3.x,n3.y,n3.z);
        }
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    if (normals.length) geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.computeVertexNormals(); geo.computeBoundingBox();
    parts.push({ index: i+1, geometry: geo, vertices: positions.length/9, color: COLORS[i % COLORS.length] });
    setProgress(((i+1)/count)*100);
    const card = document.createElement('div');
    card.className = 'part-card'; card.dataset.index = i;
    card.innerHTML = `<span class="icon">🧩</span>الجزء ${i+1}<br><small style="color:#4ade80">${positions.length/9} مثلث</small>`;
    card.onclick = () => selectPart(i);
    grid.appendChild(card);
  }
  document.getElementById('btnDownloadAll').style.display = 'flex';
  document.getElementById('btnShowParts').style.display = 'flex';
  document.getElementById('btnUploadChannel').style.display = 'flex';
  document.getElementById('statParts').textContent = count;
  setProgress(0); updateMergeList();
  showStatus(`✅ تم التقسيم إلى ${count} أجزاء`, 'success');
}
function selectPart(i) {
  selectedPartIndex = i;
  document.querySelectorAll('.part-card').forEach((c, idx) => c.classList.toggle('selected', idx === i));
  showPartsInViewer();
}
function showPartsInViewer() {
  if (!parts.length) return;
  if (currentModel) { scene.remove(currentModel); disposeObject(currentModel); }
  const group = new THREE.Group();
  parts.forEach((p, i) => {
    const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.35, metalness: 0.4 });
    const mesh = new THREE.Mesh(p.geometry, mat);
    mesh.position.x = (i - (parts.length-1)/2) * 0.4;
    group.add(mesh);
  });
  currentModel = group;
  scene.add(group); fitCamera(group);
  showStatus('👁️ عرض الأجزاء', 'info');
}

function mergeSelectedParts() {

/* ═══════════════════════════════════════════════════
   تحميل STL
   ═══════════════════════════════════════════════════ */
function downloadAllParts() {
  if (!parts.length) return;
  parts.forEach(part => downloadGeometryAsSTL(part.geometry, `part_${part.index}.stl`));
  showStatus('📥 تم تحميل كل الأجزاء', 'success');
}
function downloadGeometryAsSTL(geometry, filename) {
  const pos = geometry.attributes.position.array;
  let stl = 'solid part\n';
  for (let i = 0; i < pos.length; i += 9) {
    const v1 = [pos[i],pos[i+1],pos[i+2]];
    const v2 = [pos[i+3],pos[i+4],pos[i+5]];
    const v3 = [pos[i+6],pos[i+7],pos[i+8]];
    const u = [v2[0]-v1[0],v2[1]-v1[1],v2[2]-v1[2]];
    const v = [v3[0]-v1[0],v3[1]-v1[1],v3[2]-v1[2]];
    const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
    const len = Math.sqrt(n[0]**2+n[1]**2+n[2]**2) || 1;
    const normal = [n[0]/len, n[1]/len, n[2]/len];
    stl += `facet normal ${normal.join(' ')}\n outer loop\n  vertex ${v1.join(' ')}\n  vertex ${v2.join(' ')}\n  vertex ${v3.join(' ')}\n endloop\nendfacet\n`;
  }
  stl += 'endsolid part\n';
  const blob = new Blob([stl], { type: 'application/sla' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ═══════════════════════════════════════════════════
   التحقق من الطباعة
   ═══════════════════════════════════════════════════ */
function validateForPrinting() {
  const result = document.getElementById('validationResult');
  if (!currentModel && !originalGeometry) { result.className = 'show invalid'; result.innerHTML = '⚠️ لا يوجد مجسم'; return; }
  const issues = [], checks = [];
  const box = new THREE.Box3();
  if (currentModel) box.setFromObject(currentModel);
  else box.setFromBufferAttribute(originalGeometry.attributes.position);
  const size = box.getSize(new THREE.Vector3());
  if (size.x < 1 || size.y < 1 || size.z < 1) issues.push('❌ أبعاد صغيرة (< 1mm)');
  else checks.push('✅ الأبعاد مناسبة');
  if (Math.max(size.x, size.y, size.z) > 250) issues.push('⚠️ أكبر من طابعة عادية');
  else checks.push('✅ الحجم مناسب');
  let tris = 0;
  if (currentModel) currentModel.traverse(c => { if (c.isMesh && c.geometry) tris += c.geometry.attributes.position.count / 3; });
  else if (originalGeometry) tris = originalGeometry.attributes.position.count / 3;
  if (tris > 500000) issues.push('❌ مثلثات كثيرة جداً');
  else if (tris > 100000) issues.push('⚠️ مثلثات كثيرة');
  else checks.push('✅ عدد المثلثات مناسب');
  if (parts.length > 0) checks.push(`✅ ${parts.length} أجزاء جاهزة`);
  result.className = 'show ' + (issues.length ? 'invalid' : 'valid');
  result.innerHTML = [...checks, ...issues].join('<br>');
  showStatus(issues.length ? '⚠️ توجد مشاكل' : '✅ جاهز للطباعة', issues.length ? 'warning' : 'success');
}

    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      const pos = part.geometry.attributes.position.array;
      let stl = 'solid part\n';
      for (let j = 0; j < pos.length; j += 9) {
        const v1 = [pos[j],pos[j+1],pos[j+2]];
        const v2 = [pos[j+3],pos[j+4],pos[j+5]];
        const v3 = [pos[j+6],pos[j+7],pos[j+8]];
        const u = [v2[0]-v1[0],v2[1]-v1[1],v2[2]-v1[2]];
        const v = [v3[0]-v1[0],v3[1]-v1[1],v3[2]-v1[2]];
        const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
        const len = Math.sqrt(n[0]**2+n[1]**2+n[2]**2) || 1;
        const normal = [n[0]/len, n[1]/len, n[2]/len];
        stl += `facet normal ${normal.join(' ')}\n outer loop\n  vertex ${v1.join(' ')}\n  vertex ${v2.join(' ')}\n  vertex ${v3.join(' ')}\n endloop\nendfacet\n`;
      }
      stl += 'endsolid part\n';
      const blob = new Blob([stl], { type: 'application/sla' });
      const fd = new FormData();
      fd.append('chat_id', chatId);
      fd.append('document', blob, `part_${part.index}.stl`);
      fd.append('caption', `🧩 part_${part.index}.stl\n📍 ${tileId}`);
      const r = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, { method: 'POST', body: fd });
      const d = await r.json();
      if (!d.ok) throw new Error(d.description);
      setProgress(((i+1)/parts.length)*100);
    }
    showStatus(`✅ تم رفع ${parts.length} جزء`, 'success');
  } catch(e) { showStatus('❌ فشل الرفع: ' + e.message, 'error'); }
  finally { setProgress(0); }
}
async function sendToChannel(blob, filename, type) {
  const c = getParentConfig();
  const token = c.token || document.getElementById('tgToken')?.value.trim();
  const chatId = c.chatId || document.getElementById('tgChatId')?.value.trim();
  if (!token || !chatId) { showStatus('⚠️ إعدادات القناة غير متوفرة', 'warning'); return false; }
  try {
    const endpoint = type === 'photo' ? 'sendPhoto' : 'sendVideo';
    const field = type === 'photo' ? 'photo' : 'video';
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append(field, blob, filename);
    fd.append('caption', `📸 ${type === 'photo' ? 'صورة' : 'فيديو'} من المشهد\n📍 المربع: ${tileId}\n🕐 ${new Date().toLocaleString('ar-SA')}`);
    if (type === 'video') fd.append('supports_streaming', 'true');
    const r = await fetch(`https://api.telegram.org/bot${token}/${endpoint}`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.ok) { showStatus('📡 تم الإرسال للقناة', 'success'); return true; }
    throw new Error(d.description);
  } catch(e) { showStatus('❌ فشل الإرسال: ' + e.message, 'error'); return false; }
}
async function saveToTile(blob, filename) {
  try {
    if (window.parent && typeof window.parent.uploadMultipleFiles === 'function') {
      const file = new File([blob], filename, { type: blob.type });
      await window.parent.uploadMultipleFiles(tileId, [file]);
      showStatus('📦 تم حفظ الملف في المربع', 'success');
      return true;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return true;
  } catch(e) { showStatus('❌ فشل الحفظ: ' + e.message, 'error'); return false; }
}

function loadVideoFromFile(file) {
  const status = document.getElementById('videoUploadStatus');
  status.textContent = '🔄 جاري تحميل الفيديو...';
  if (videoElement) { videoElement.pause(); videoElement = null; }
  if (videoMesh) { scene.remove(videoMesh); if (videoMesh.material.map) videoMesh.material.map.dispose(); videoMesh.material.dispose(); videoMesh = null; }
  const url = URL.createObjectURL(file);
  const video = document.createElement('video');
  video.src = url; video.loop = true; video.muted = true; video.playsInline = true; video.crossOrigin = 'anonymous';
  video.onloadedmetadata = () => {
    video.play();
    videoElement = video;
    videoTexture = new THREE.VideoTexture(video);
    videoTexture.minFilter = THREE.LinearFilter; videoTexture.magFilter = THREE.LinearFilter;
    const aspect = video.videoWidth / video.videoHeight;
    const height = 2, width = height * aspect;
    const geo = new THREE.PlaneGeometry(width, height);
    const mat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide, transparent: true });
    videoMesh = new THREE.Mesh(geo, mat);
    videoMesh.userData = { isVideo: true, width, height, aspect };
    applyVideoTransform();
    scene.add(videoMesh);

function applyVideoTransform() {
  if (!videoMesh) return;
  const baseHeight = 2, baseWidth = videoMesh.userData.width;
  const w = baseWidth * videoScale, h = baseHeight * videoScale;
  videoMesh.geometry.dispose();
  videoMesh.geometry = new THREE.PlaneGeometry(w, h);
  let posX = videoOffsetX, posY = videoOffsetY, posZ = videoOffsetZ;
  const gap = 1.5;
  switch(videoPosition) {
    case 'top': posY += gap + h/2; break;
    case 'bottom': posY -= gap + h/2; break;
    case 'left': posX -= gap + w/2; break;
    case 'right': posX += gap + w/2; break;
  }
  videoMesh.position.set(posX, posY, posZ);
  videoMesh.rotation.z = THREE.MathUtils.degToRad(videoRotation);
}
function updateVideoMeasure() {
  if (!videoMesh) return;
  const w = videoMesh.geometry.parameters.width;
  const h = videoMesh.geometry.parameters.height;

  document.getElementById('vCoords').textContent = `(${videoMesh.position.x.toFixed(2)}, ${videoMesh.position.y.toFixed(2)}, ${videoMesh.position.z.toFixed(2)})`;

    status.textContent = '✅ تم التحميل'; status.style.color = '#4ade80';
  } else if (outputMode === 'channel') {
    const ok = await sendToChannel(blob, filename, 'photo');
    status.textContent = ok ? '✅ تم الإرسال' : '❌ فشل';
    status.style.color = ok ? '#4ade80' : '#f87171';
  } else if (outputMode === 'tile') {
    const ok = await saveToTile(blob, filename);
    status.textContent = ok ? '✅ تم الحفظ' : '❌ فشل';
    status.style.color = ok ? '#4ade80' : '#f87171';
  }
}
function toggleVideoRecording() { if (isRecording) stopVideoRecording(); else startVideoRecording(); }
async function startVideoRecording() {
  if (!renderer || !renderer.domElement) return;
  try {
    const stream = renderer.domElement.captureStream(30);
    const options = { mimeType: 'video/webm;codecs=vp9' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'video/webm';
    mediaRecorder = new MediaRecorder(stream, options);
    recordedChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const filename = `video_${Date.now()}.webm`;
      const status = document.getElementById('captureStatus');
      if (outputMode === 'download') {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        status.textContent = '✅ تم التحميل'; status.style.color = '#4ade80';
      } else if (outputMode === 'channel') {
        const ok = await sendToChannel(blob, filename, 'video');
        status.textContent = ok ? '✅ تم الإرسال' : '❌ فشل';
        status.style.color = ok ? '#4ade80' : '#f87171';
      } else if (outputMode === 'tile') {
        const ok = await saveToTile(blob, filename);
        status.textContent = ok ? '✅ تم الحفظ' : '❌ فشل';
        status.style.color = ok ? '#4ade80' : '#f87171';
      }
    };
    mediaRecorder.start(100);
    isRecording = true;
    recordingStartTime = Date.now();
    document.getElementById('btnRecordVideo').textContent = '⏹️ إيقاف';
    document.getElementById('btnRecordVideo').style.background = 'linear-gradient(135deg,#4ade80,#16a34a)';
    document.getElementById('recordingIndicator').style.display = 'flex';
    recordingTimer = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      document.getElementById('recordingTime').textContent = `${m}:${s}`;
      if (recordDuration > 0 && elapsed >= recordDuration) stopVideoRecording();
    }, 1000);
    showStatus('🔴 بدأ التسجيل...', 'warning');
  } catch(e) { showStatus('❌ فشل: ' + e.message, 'error'); }
}
function stopVideoRecording() {
  if (!isRecording || !mediaRecorder) return;
  mediaRecorder.stop();
  isRecording = false;
  clearInterval(recordingTimer);
  document.getElementById('btnRecordVideo').textContent = '🎬 تسجيل';
  document.getElementById('btnRecordVideo').style.background = 'linear-gradient(135deg,#ef4444,#dc2626)';
  document.getElementById('recordingIndicator').style.display = 'none';
  document.getElementById('recordingTime').textContent = '00:00';
  showStatus('⏹️ تم إيقاف التسجيل', 'info');
}

/* ═══════════════════════════════════════════════════
   مساعدات
   ═══════════════════════════════════════════════════ */
function togglePanel(id) {
  document.querySelectorAll('.panel').forEach(p => { if (p.id !== id) p.classList.remove('open'); });
  document.getElementById(id).classList.toggle('open');
}
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'show ' + (type || 'info');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}
function setProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
  if (pct >= 100 || pct <= 0) setTimeout(() => document.getElementById('progressBar').style.width = '0%', 600);
}
window.addEventListener('resize', () => {
  if (!camera) return;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ═══════════════════════════════════════════════════
   بدء التشغيل
   ═══════════════════════════════════════════════════ */
init();
</script>
