<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلب المنتجات من رابط القناة</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#0a0a1a;color:#fff;padding:20px;min-height:100vh;display:flex;justify-content:center;align-items:center}
        .container{background:#1a1a2e;border-radius:20px;padding:30px;max-width:600px;width:100%;border:2px solid rgba(255,215,0,0.2)}
        h1{color:#ffd700;text-align:center;margin-bottom:20px;font-size:22px}
        .input-group{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
        .input-group input{flex:3;padding:12px 16px;background:#0a0a1a;border:2px solid rgba(255,215,0,0.15);border-radius:12px;color:#fff;font-family:'Cairo';font-size:14px;outline:none;min-width:200px}
        .input-group input:focus{border-color:#ffd700}
        .input-group button{flex:1;padding:12px 20px;background:linear-gradient(145deg,#ffd700,#daa520);border:none;border-radius:12px;color:#0a0a1a;font-weight:700;font-family:'Cairo';cursor:pointer;transition:0.3s;min-width:100px}
        .input-group button:hover{transform:scale(1.02)}
        .input-group button:disabled{opacity:0.5;cursor:not-allowed}
        .status{background:rgba(0,0,0,0.3);border-radius:10px;padding:12px 16px;margin-bottom:15px;font-size:13px;color:#888;min-height:50px;border-right:3px solid #ffd700}
        .status.success{color:#4ade80;border-right-color:#4ade80}
        .status.error{color:#f87171;border-right-color:#f87171}
        .status.loading{color:#ffd700;border-right-color:#ffd700}
        .products-list{background:#0a0a1a;border-radius:12px;padding:15px;max-height:400px;overflow-y:auto;border:1px solid rgba(255,215,0,0.08)}
        .products-list .empty{text-align:center;color:#555;padding:30px 0}
        .product-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.05)}
        .product-item:last-child{border-bottom:none}
        .product-item .name{font-weight:600;font-size:14px}
        .product-item .price{color:#ffd700;font-weight:700;font-size:14px}
        .product-item .stock{font-size:12px;color:#888}
        .badge{background:rgba(255,215,0,0.1);color:#ffd700;padding:2px 10px;border-radius:12px;font-size:10px}
        .stats{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:15px;padding:10px 0}
        .stats span{background:#0a0a1a;padding:6px 16px;border-radius:8px;font-size:13px;color:#888}
        .stats span strong{color:#ffd700}
        .btn-secondary{background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.15);color:#aaa;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Cairo';transition:0.3s}
        .btn-secondary:hover{background:rgba(255,215,0,0.05);color:#fff}
        .flex{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
        .hidden{display:none}
        @keyframes spin{to{transform:rotate(360deg)}}
        .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,215,0,0.2);border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-left:8px}
    </style>
</head>
<body>
<div class="container">
    <h1>📦 <span style="color:#fff;">جلب المنتجات من</span> القناة</h1>
    
    <!-- رابط القناة -->
    <div class="input-group">
        <input type="text" id="channelLink" value="https://t.me/c/3822964890/10163" placeholder="رابط رسالة القناة...">
        <button id="fetchBtn" onclick="fetchFromLink()">🚀 جلب</button>
    </div>
    
    <!-- الحالة -->
    <div id="status" class="status">📌 أدخل رابط رسالة القناة واضغط جلب</div>
    
    <!-- الإحصائيات -->
    <div class="stats">
        <span>📦 المنتجات: <strong id="productCount">0</strong></span>
        <span>📡 المصدر: <strong id="sourceLabel">محلي</strong></span>
    </div>
    
    <!-- أزرار إضافية -->
    <div class="flex">
        <button class="btn-secondary" onclick="clearProducts()">🗑️ مسح المنتجات</button>
        <button class="btn-secondary" onclick="testConnection()">🧪 اختبار الاتصال</button>
        <button class="btn-secondary" onclick="addDemoProduct()">➕ منتج تجريبي</button>
    </div>
    
    <!-- قائمة المنتجات -->
    <div class="products-list" id="productsList">
        <div class="empty">📭 لا توجد منتجات. اضغط "جلب" لجلب المنتجات من القناة</div>
    </div>
</div>

<script>
// ============================================================
// 🔧 جسر جلب الإعدادات من الملف الرئيسي
// ============================================================

function syncTelegramConfigFromServer() {
    try {
        // محاولة جلب الإعدادات من النافذة الرئيسية (إذا كانت موجودة)
        const parent = window.parent;
        const opener = window.opener;
        
        // محاولة من window.NardoBridge
        if (window.NardoBridge && typeof window.NardoBridge.getTelegramConfig === 'function') {
            const config = window.NardoBridge.getTelegramConfig();
            if (config && (config.token || config.botToken) && (config.chatId || config.channelId)) {
                TELEGRAM.botToken = config.token || config.botToken || '';
                TELEGRAM.channelId = config.chatId || config.channelId || '';
                TELEGRAM.channelUsername = config.channelUsername || config.username || '';
                return true;
            }
        }
        
        // محاولة من localStorage (الإعدادات المخزنة)
        const token = localStorage.getItem('telegram_bot_token') || 
                     localStorage.getItem('server_telegram_bot_token') || 
                     localStorage.getItem('tilecdn_telegram_token') || '';
        const chatId = localStorage.getItem('telegram_chat_id') || 
                      localStorage.getItem('server_telegram_chat_id') || 
                      localStorage.getItem('tilecdn_telegram_chat_id') || '';
        
        if (token && chatId) {
            TELEGRAM.botToken = token;
            TELEGRAM.channelId = chatId;
            return true;
        }
        
        // محاولة من المتغيرات العامة
        if (window.__SERVER_TELEGRAM_CONFIG) {
            const config = window.__SERVER_TELEGRAM_CONFIG;
            if (config.token || config.botToken) {
                TELEGRAM.botToken = config.token || config.botToken || '';
                TELEGRAM.channelId = config.chatId || config.channelId || '';
                return true;
            }
        }
        
        return false;
    } catch (e) {
        console.warn('⚠️ فشل جلب الإعدادات:', e);
        return false;
    }
}

// ============================================================
// 📡 إعدادات التليجرام
// ============================================================
const TELEGRAM = {
    botToken: '',
    channelId: '',
    apiUrl: 'https://api.telegram.org/bot',
    channelUsername: ''
};

// محاولة جلب الإعدادات فوراً
syncTelegramConfigFromServer();

// ============================================================
// 📥 جلب رسالة من رابط مباشر
// ============================================================
async function fetchMessageByLink(link) {
    try {
        // استخراج معرف القناة ورقم الرسالة من الرابط
        // يدعم: https://t.me/c/3822964890/10163
        // يدعم: https://t.me/username/10163
        let chatId, messageId;
        
        // محاولة الرابط الخاص (c/ رقم)
        const privateMatch = link.match(/https?:\/\/(?:www\.)?t\.me\/c\/(\d+)\/(\d+)/);
        if (privateMatch) {
            chatId = `-100${privateMatch[1]}`;
            messageId = parseInt(privateMatch[2]);
        } else {
            // محاولة الرابط العام (username/رقم)
            const publicMatch = link.match(/https?:\/\/(?:www\.)?t\.me\/([^/]+)\/(\d+)/);
            if (publicMatch) {
                chatId = publicMatch[1].startsWith('@') ? publicMatch[1] : `@${publicMatch[1]}`;
                messageId = parseInt(publicMatch[2]);
            } else {
                throw new Error('رابط غير صالح');
            }
        }
        
        // جلب الإعدادات
        syncTelegramConfigFromServer();
        
        if (!TELEGRAM.botToken) {
            throw new Error('❌ بوت التليجرام غير مهيأ. تأكد من إعدادات البوت.');
        }
        
        console.log(`📥 جلب رسالة: قناة ${chatId}, رسالة ${messageId}`);
        
        // استخدام getMessage API
        const url = `${TELEGRAM.apiUrl}${TELEGRAM.botToken}/getMessage?chat_id=${encodeURIComponent(chatId)}&message_id=${messageId}`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data.ok) {
            throw new Error(data.description || 'فشل جلب الرسالة');
        }
        
        console.log('✅ تم جلب الرسالة بنجاح');
        return data.result;
        
    } catch (error) {
        console.error('❌ خطأ في جلب الرسالة:', error);
        throw error;
    }
}

// ============================================================
// 🔍 استخراج المنتجات من نص الرسالة
// ============================================================
function extractProductsFromMessage(message) {
    const text = message.caption || message.text || '';
    const products = [];
    
    console.log('📝 تحليل النص:', text.substring(0, 200) + '...');
    
    // البحث عن منتجات في النص
    // التنسيق المدعوم:
    // 🟣 منتج جديد
    // 📦 المنتج: اسم المنتج
    // 💰 السعر: 50 دج
    // 📊 الكمية: 10
    
    // تقسيم النص إلى كتل منتجات
    const blocks = text.split(/🟣\s*منتج\s*جديد/i);
    
    for (const block of blocks) {
        if (!block.trim()) continue;
        
        // استخراج البيانات
        const nameMatch = block.match(/📦\s*المنتج\s*[:：]\s*([^\n]+)/);
        const priceMatch = block.match(/💰\s*السعر\s*[:：]\s*([\d,]+)/);
        const stockMatch = block.match(/📊\s*الكمية\s*[:：]\s*(\d+)/);
        const categoryMatch = block.match(/🏷️\s*القسم\s*[:：]\s*([^\n]+)/);
        const productIdMatch = block.match(/🆔\s*معرف المنتج\s*[:：]\s*([^\n]+)/);
        const descMatch = block.match(/📝\s*الوصف\s*[:：]\s*([^\n]+)/);
        
        if (nameMatch && priceMatch) {
            const product = {
                id: Date.now() + Math.random() + products.length,
                name: nameMatch[1].trim(),
                price: parseInt(priceMatch[1].replace(/,/g, '')) || 0,
                stock: stockMatch ? parseInt(stockMatch[1]) : 0,
                category: categoryMatch ? categoryMatch[1].trim() : 'عام',
                productId: productIdMatch ? productIdMatch[1].trim() : `PROD-${Date.now().toString().slice(-6)}`,
                description: descMatch ? descMatch[1].trim() : '',
                source: 'telegram',
                images: [],
                createdAt: new Date().toISOString()
            };
            products.push(product);
            console.log(`✅ تم استخراج منتج: ${product.name} (${product.price} دج)`);
        }
    }
    
    // إذا لم يتم العثور على منتجات بالتنسيق الأساسي، نحاول البحث عن أي منتجات
    if (products.length === 0) {
        console.log('🔍 محاولة البحث عن منتجات بتنسيق بديل...');
        
        // بحث عن منتجات بتنسيق مختلف
        const altPattern = /(?:📦|▪️|•)\s*([^\n]+?)\s*(?:💰|السعر)\s*[:：]\s*([\d,]+)/gi;
        let match;
        while ((match = altPattern.exec(text)) !== null) {
            const product = {
                id: Date.now() + Math.random() + products.length,
                name: match[1].trim(),
                price: parseInt(match[2].replace(/,/g, '')) || 0,
                stock: 0,
                category: 'عام',
                productId: `PROD-${Date.now().toString().slice(-6)}`,
                source: 'telegram',
                images: [],
                createdAt: new Date().toISOString()
            };
            products.push(product);
            console.log(`✅ تم استخراج منتج (بديل): ${product.name} (${product.price} دج)`);
        }
    }
    
    return products;
}

// ============================================================
// 📦 جلب المنتجات من رابط القناة
// ============================================================
async function fetchProductsFromLink(link) {
    const status = document.getElementById('status');
    const fetchBtn = document.getElementById('fetchBtn');
    
    try {
        // تحديث واجهة المستخدم
        status.className = 'status loading';
        status.innerHTML = '⏳ جاري جلب المنتجات من القناة... <span class="spinner"></span>';
        fetchBtn.disabled = true;
        fetchBtn.innerHTML = '⏳ جاري...';
        
        // 1. جلب الرسالة
        const message = await fetchMessageByLink(link);
        if (!message) {
            throw new Error('لم يتم العثور على الرسالة');
        }
        
        // 2. استخراج المنتجات
        const products = extractProductsFromMessage(message);
        
        if (products.length === 0) {
            status.className = 'status error';
            status.innerHTML = '⚠️ لم يتم العثور على منتجات في هذه الرسالة. تأكد من تنسيق المنتجات.';
            return 0;
        }
        
        // 3. حفظ المنتجات
        let inventory = JSON.parse(localStorage.getItem('nardo_products') || '[]');
        let added = 0;
        
        for (const prod of products) {
            // التحقق من عدم وجود المنتج مسبقاً
            const exists = inventory.find(p => 
                p.name === prod.name || 
                p.productId === prod.productId ||
                (p.telegramLink === link && p.name === prod.name)
            );
            
            if (!exists) {
                prod.telegramLink = link;
                inventory.push(prod);
                added++;
            } else {
                console.log(`⏩ منتج موجود مسبقاً: ${prod.name}`);
            }
        }
        
        if (added > 0) {
            localStorage.setItem('nardo_products', JSON.stringify(inventory));
            renderProducts();
            
            status.className = 'status success';
            status.innerHTML = `✅ تم جلب ${added} منتج جديد من القناة (إجمالي ${inventory.length} منتج)`;
            
            // تحديث الإحصائيات
            document.getElementById('productCount').textContent = inventory.length;
            document.getElementById('sourceLabel').textContent = '📡 القناة';
            
        } else {
            status.className = 'status';
            status.innerHTML = `📭 لا توجد منتجات جديدة (${inventory.length} منتج موجود بالفعل)`;
        }
        
        return added;
        
    } catch (error) {
        console.error('❌ فشل الجلب:', error);
        status.className = 'status error';
        status.innerHTML = `❌ خطأ: ${error.message}`;
        return 0;
        
    } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '🚀 جلب';
    }
}

// ============================================================
// 🖥️ عرض المنتجات
// ============================================================
function renderProducts() {
    const container = document.getElementById('productsList');
    const inventory = JSON.parse(localStorage.getItem('nardo_products') || '[]');
    
    document.getElementById('productCount').textContent = inventory.length;
    
    if (inventory.length === 0) {
        container.innerHTML = `<div class="empty">📭 لا توجد منتجات. اضغط "جلب" لجلب المنتجات من القناة</div>`;
        return;
    }
    
    // عرض أحدث 20 منتج
    const display = inventory.slice(-20).reverse();
    
    container.innerHTML = display.map(p => `
        <div class="product-item">
            <div>
                <div class="name">${p.name}</div>
                <div class="stock">📦 المخزون: ${p.stock || 0} ${p.source === 'telegram' ? '<span class="badge">📡 من القناة</span>' : ''}</div>
            </div>
            <div class="price">${p.price.toLocaleString()} دج</div>
        </div>
    `).join('');
}

// ============================================================
// 🎯 دوال التحكم
// ============================================================

// جلب من الرابط المدخل
async function fetchFromLink() {
    const link = document.getElementById('channelLink').value.trim();
    if (!link) {
        document.getElementById('status').className = 'status error';
        document.getElementById('status').innerHTML = '⚠️ يرجى إدخال رابط رسالة القناة';
        return;
    }
    await fetchProductsFromLink(link);
}

// اختبار الاتصال بالقناة
async function testConnection() {
    const status = document.getElementById('status');
    const link = document.getElementById('channelLink').value.trim();
    
    if (!link) {
        status.className = 'status error';
        status.innerHTML = '⚠️ يرجى إدخال رابط رسالة القناة أولاً';
        return;
    }
    
    status.className = 'status loading';
    status.innerHTML = '🧪 جاري اختبار الاتصال... <span class="spinner"></span>';
    
    try {
        const message = await fetchMessageByLink(link);
        if (message) {
            status.className = 'status success';
            const hasProducts = message.text || message.caption;
            status.innerHTML = `✅ الاتصال ناجح! ${hasProducts ? '📝 تحتوي الرسالة على نص' : '⚠️ الرسالة فارغة'}`;
            console.log('📝 محتوى الرسالة:', message.text || message.caption);
        }
    } catch (error) {
        status.className = 'status error';
        status.innerHTML = `❌ فشل الاتصال: ${error.message}`;
    }
}

// مسح المنتجات
function clearProducts() {
    if (!confirm('⚠️ هل تريد مسح جميع المنتجات؟')) return;
    localStorage.removeItem('nardo_products');
    renderProducts();
    document.getElementById('productCount').textContent = '0';
    document.getElementById('sourceLabel').textContent = 'محلي';
    document.getElementById('status').className = 'status';
    document.getElementById('status').innerHTML = '🗑️ تم مسح جميع المنتجات';
}

// إضافة منتج تجريبي
function addDemoProduct() {
    let inventory = JSON.parse(localStorage.getItem('nardo_products') || '[]');
    
    const demo = {
        id: Date.now() + Math.random(),
        name: 'منتج تجريبي',
        price: 99,
        stock: 10,
        category: 'تجريبي',
        productId: `DEMO-${Date.now().toString().slice(-6)}`,
        source: 'local',
        images: [],
        createdAt: new Date().toISOString()
    };
    
    inventory.push(demo);
    localStorage.setItem('nardo_products', JSON.stringify(inventory));
    renderProducts();
    document.getElementById('productCount').textContent = inventory.length;
    document.getElementById('status').className = 'status success';
    document.getElementById('status').innerHTML = '✅ تم إضافة منتج تجريبي';
}

// ============================================================
// 🚀 التهيئة
// ============================================================

// عرض المنتجات عند التحميل
document.addEventListener('DOMContentLoaded', function() {
    renderProducts();
    
    // محاولة جلب الإعدادات مرة أخرى
    setTimeout(syncTelegramConfigFromServer, 500);
    
    // إظهار حالة الإعدادات
    const status = document.getElementById('status');
    if (TELEGRAM.botToken && TELEGRAM.channelId) {
        status.innerHTML = `✅ البوت جاهز! يمكنك جلب المنتجات من القناة`;
        status.className = 'status success';
    } else {
        status.innerHTML = `⚠️ إعدادات التليجرام غير مكتملة. تأكد من إعدادات البوت في الملف الرئيسي.`;
        status.className = 'status error';
    }
    
    console.log('🚀 تم تحميل أداة جلب المنتجات');
    console.log('📡 حالة البوت:', TELEGRAM.botToken ? '✅ جاهز' : '❌ غير جاهز');
});

// جعل الدوال عامة
window.fetchFromLink = fetchFromLink;
window.testConnection = testConnection;
window.clearProducts = clearProducts;
window.addDemoProduct = addDemoProduct;
window.fetchProductsFromLink = fetchProductsFromLink;

console.log('✅ أداة جلب المنتجات جاهزة للاستخدام');
console.log('📌 استخدم: fetchFromLink() لجلب المنتجات من الرابط المدخل');
</script>
</body>
</html>
