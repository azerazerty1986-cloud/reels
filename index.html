<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نكهة وجمال | ناردو برو - المنصة المتكاملة</title>
    
    <!-- ===== الخطوط ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- ===== Font Awesome ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ===== ملفات CSS ===== -->
    <link rel="stylesheet" href="02-css/01-variables.css">
    <link rel="stylesheet" href="02-css/02-layout.css">
    <link rel="stylesheet" href="02-css/03-components.css">
    <link rel="stylesheet" href="02-css/04-responsive.css">
    
    <!-- ===== أنماط إضافية ===== -->
    <style>
        /* أنماط مؤقتة للتأكد من ظهور العناصر */
        .modal { display: none; }
        .modal.show { display: flex !important; }
        .cart-sidebar { left: -400px; }
        .cart-sidebar.open { left: 0; }
    </style>
</head>
<body>
    <!-- خلفية متحركة -->
    <div class="animated-bg"></div>

    <!-- ===== تضمين أقسام الصفحة ===== -->
    
    <!-- شاشة التحميل -->
    <div w3-include-html="01-includes/05-footer.html?section=loader"></div>
    
    <!-- نظام الإشعارات -->
    <div w3-include-html="01-includes/05-footer.html?section=toast"></div>
    
    <!-- رأس الصفحة (شريط علوي + عروض + هيدر) -->
    <div w3-include-html="01-includes/01-header.html"></div>
    
    <!-- القوائم والمحتوى المتحرك -->
    <div w3-include-html="01-includes/02-navigation.html"></div>
    
    <!-- المحتوى الرئيسي (منتجات + ريلز + لوحات) -->
    <div w3-include-html="01-includes/03-content.html"></div>
    
    <!-- جميع النوافذ المنبثقة -->
    <div w3-include-html="01-includes/04-modals.html"></div>
    
    <!-- الفوتر والعناصر الثابتة -->
    <div w3-include-html="01-includes/05-footer.html"></div>

    <!-- ===== تضمين ملفات JavaScript بالترتيب ===== -->
    <script src="03-js/01-core.js"></script>
    <script src="03-js/02-auth.js"></script>
    <script src="03-js/03-shop.js"></script>
    <script src="03-js/04-telegram.js"></script>
    <script src="03-js/05-app.js"></script>

    <!-- ===== دالة تضمين HTML ===== -->
    <script>
        /**
         * دالة تضمين ملفات HTML
         * تبحث عن العناصر التي تحتوي على الخاصية w3-include-html
         * وتقوم بتحميل المحتوى من الملف المحدد
         */
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            /* حلقة عبر جميع عناصر الصفحة */
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    /* إنشاء طلب HTTP */
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            if (this.status == 200) {
                                elmnt.innerHTML = this.responseText;
                            }
                            if (this.status == 404) {
                                elmnt.innerHTML = "<!-- الملف غير موجود: " + file + " -->";
                                console.warn('الملف غير موجود:', file);
                            }
                            /* إزالة الخاصية بعد التحميل */
                            elmnt.removeAttribute("w3-include-html");
                            /* استدعاء الدالة مرة أخرى للتعامل مع الملفات المتداخلة */
                            includeHTML();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    return; /* الخروج بعد العثور على أول عنصر */
                }
            }
            
            /* بعد تحميل جميع الملفات، نقوم بتهيئة بعض العناصر */
            setTimeout(function() {
                // تحديث عداد السلة
                if (window.Cart) Cart.updateCounter();
                // تحديث واجهة المستخدم
                if (window.Auth) Auth.updateUI();
            }, 500);
        }
        
        /* تشغيل دالة التضمين عند تحميل الصفحة */
        document.addEventListener('DOMContentLoaded', includeHTML);
    </script>
    
    <!-- ===== معالجة أخطاء التحميل ===== -->
    <noscript>
        <div style="position:fixed; top:0; left:0; width:100%; padding:20px; background:red; color:white; text-align:center; z-index:99999;">
            ❌ جافاسكريبت معطل - يرجى تفعيل جافاسكريبت لتشغيل الموقع
        </div>
    </noscript>
    
    <!-- ===== اختبار التحميل ===== -->
    <div style="display: none;" id="load-test">تم التحميل</div>
</body>
</html>
