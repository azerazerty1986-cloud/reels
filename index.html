<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBG | اختبار GLB تجريبي</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #000;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .ui {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 8px 12px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            border: 1px solid #ff5722;
            pointer-events: none;
        }
        
        .player-info {
            color: white;
            font-size: 10px;
        }
        
        .weapon-level {
            background: #ff5722;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 11px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
        }
        
        .weapon-level:active {
            transform: scale(0.95);
        }
        
        .controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 18px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            padding: 12px 25px;
            border-radius: 80px;
            margin: 0 20px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 65px;
            height: 65px;
            background: rgba(255,87,34,0.5);
            border: 3px solid #ff5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.05s linear;
        }
        
        .control-btn:active {
            background: #ff5722;
            transform: scale(0.92);
        }
        
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-image {
            max-width: 95%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 15px;
            border: 3px solid #ff5722;
        }
        
        .close-pov {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #ff5722;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #ff5722;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 11px;
            z-index: 150;
            border: 1px solid #ff5722;
            white-space: nowrap;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff5722;
            background: rgba(0,0,0,0.9);
            padding: 15px 25px;
            border-radius: 30px;
            z-index: 300;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            border: 1px solid #ff5722;
        }
        
        @media (max-width: 600px) {
            .control-btn { width: 55px; height: 55px; font-size: 24px; }
            .controls { gap: 12px; padding: 10px 18px; }
        }
    </style>
</head>
<body>

    <div class="ui">
        <div class="player-info">
            🎮 <span id="playerPos">(4,4)</span>
        </div>
        <div class="player-info">
            🏆 <span id="visitedCount">1</span>/64
        </div>
        <div class="player-info">
            💰 <span id="points">0</span> نقطة
        </div>
        <div class="weapon-level" id="upgradeBtn">
            ⚔️ سيف Lv.<span id="weaponLevel">1</span> ▲
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="btnUp">▲</div>
        <div class="control-btn" id="btnLeft">◀</div>
        <div class="control-btn" id="btnDown">▼</div>
        <div class="control-btn" id="btnRight">▶</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="pov-modal" id="povModal">
        <div class="close-pov" onclick="closePOV()">✖</div>
        <img class="pov-image" id="povImage">
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // ========== تكامل تليجرام ==========
        const tg = window.Telegram.WebApp;
        if (tg) { 
            tg.ready(); 
            tg.expand();
            console.log("✅ Telegram WebApp initialized");
        }
        
        // ========== 🔗 روابط GLB تجريبية (تعمل فوراً) ==========
        const GLB_URLS = {
            // سيف تجريبي - نموذج خوذة SciFi (يمكن استخدامه كسلاح)
            weapon_test: 'https://threejs.org/examples/models/gltf/SciFiHelmet/glTF/SciFiHelmet.gltf',
            // شخصية تجريبية - فلامنجو
            character_test: 'https://threejs.org/examples/models/gltf/Flamingo.gltf',
            // سلاح ثانوي - طائرة
            weapon_alt: 'https://threejs.org/examples/models/gltf/FlightHelmet/glTF/FlightHelmet.gltf'
        };
        
        // ========== حالة اللاعب ==========
        let playerState = {
            weaponLevel: 1,
            characterLevel: 1,
            points: 0,
            weaponUrl: GLB_URLS.weapon_test,
            characterUrl: GLB_URLS.character_test
        };
        
        // ========== إعدادات اللعبة ==========
        const GRID_SIZE = 8;
        const SPACING = 3.2;
        
        let playerGridX = Math.floor(GRID_SIZE / 2);
        let playerGridY = Math.floor(GRID_SIZE / 2);
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 1;
        
        let scene, camera, renderer, controls;
        let playerGroup;
        let currentWeapon;
        let currentCharacter;
        
        let moving = { up: false, down: false, left: false, right: false };
        let lastMoveTime = 0;
        const MOVE_DELAY = 250;
        
        // ========== تحميل نموذج GLB ==========
        async function loadGLBModel(url, onProgress) {
            console.log(`📦 تحميل النموذج: ${url}`);
            
            return new Promise((resolve, reject) => {
                const loader = new GLTFLoader();
                loader.load(url, 
                    (gltf) => {
                        console.log(`✅ تم تحميل النموذج بنجاح`);
                        resolve(gltf.scene);
                    },
                    (progress) => {
                        if (onProgress && progress.total) {
                            const percent = Math.round((progress.loaded / progress.total) * 100);
                            console.log(`📥 تحميل: ${percent}%`);
                            if (onProgress) onProgress(percent);
                        }
                    },
                    (error) => {
                        console.error(`❌ فشل تحميل النموذج:`, error);
                        reject(error);
                    }
                );
            });
        }
        
        // ========== تحديث السلاح ==========
        async function upgradeWeapon() {
            if (playerState.weaponLevel >= 3) {
                showToast("🔥 السلاح في أعلى مستوى!");
                return;
            }
            
            const newLevel = playerState.weaponLevel + 1;
            
            showToast(`⚔️ تطوير السلاح إلى المستوى ${newLevel}...`);
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = `⚔️ تحميل السلاح Lv.${newLevel}...`;
            document.body.appendChild(loadingDiv);
            
            try {
                // تبديل السلاح حسب المستوى
                let newWeaponUrl;
                if (newLevel === 2) {
                    newWeaponUrl = GLB_URLS.weapon_alt;
                } else if (newLevel === 3) {
                    newWeaponUrl = GLB_URLS.weapon_test;
                }
                
                const newWeapon = await loadGLBModel(newWeaponUrl);
                
                if (currentWeapon && playerGroup) {
                    playerGroup.remove(currentWeapon);
                }
                
                // تعديل موضع وحجم السلاح
                newWeapon.position.set(0.6, 0.5, 0.4);
                newWeapon.scale.set(0.5, 0.5, 0.5);
                if (playerGroup) playerGroup.add(newWeapon);
                currentWeapon = newWeapon;
                
                playerState.weaponLevel = newLevel;
                playerState.weaponUrl = newWeaponUrl;
                document.getElementById('weaponLevel').innerHTML = playerState.weaponLevel;
                
                // إرسال إشعار لتليجرام
                if (tg) {
                    const userName = tg?.initDataUnsafe?.user?.first_name || 'مستخدم';
                    try {
                        // يمكن تفعيل إرسال الإشعارات لاحقاً
                        console.log(`🔫 تم تطوير السلاح للمستوى ${newLevel}`);
                    } catch(e) {}
                }
                
                showToast(`✨ السلاح مطور! المستوى ${newLevel}`);
            } catch (error) {
                console.error(error);
                showToast("❌ فشل تطوير السلاح");
            } finally {
                loadingDiv.remove();
            }
        }
        
        // ========== إنشاء شخصية افتراضية احتياطية ==========
        function createFallbackCharacter() {
            const group = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a7a5a });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.9, 8), bodyMat);
            body.castShadow = true;
            body.position.y = 0.45;
            group.add(body);
            
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf5c4a0 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), headMat);
            head.castShadow = true;
            head.position.y = 0.95;
            group.add(head);
            
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x5a6b3a, metalness: 0.6 });
            const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.4, 8), helmetMat);
            helmet.position.y = 1.12;
            group.add(helmet);
            
            return group;
        }
        
        // ========== تحميل الشخصية ==========
        async function loadCharacter() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = "🔄 تحميل الشخصية ثلاثية الأبعاد...";
            document.body.appendChild(loadingDiv);
            
            try {
                // محاولة تحميل الشخصية من GLB
                const characterModel = await loadGLBModel(playerState.characterUrl);
                playerGroup = new THREE.Group();
                
                // ضبط حجم ومكان الشخصية
                characterModel.position.y = 0;
                characterModel.scale.set(0.8, 0.8, 0.8);
                playerGroup.add(characterModel);
                currentCharacter = characterModel;
                
                scene.add(playerGroup);
                
                // تحميل السلاح
                const weaponModel = await loadGLBModel(playerState.weaponUrl);
                weaponModel.position.set(0.6, 0.5, 0.4);
                weaponModel.scale.set(0.5, 0.5, 0.5);
                playerGroup.add(weaponModel);
                currentWeapon = weaponModel;
                
                showToast("✅ تم تحميل الشخصية والسلاح بنجاح!");
            } catch (error) {
                console.warn("فشل تحميل النموذج، استخدام النموذج الافتراضي", error);
                if (!playerGroup) {
                    playerGroup = createFallbackCharacter();
                    scene.add(playerGroup);
                }
                showToast("⚠️ استخدام النموذج الافتراضي");
            } finally {
                loadingDiv.remove();
            }
        }
        
        // ========== حركة اللاعب ==========
        function movePlayer(dx, dy) {
            const newX = playerGridX + dx;
            const newY = playerGridY + dy;
            
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                playerGridX = newX;
                playerGridY = newY;
                
                const targetX = (playerGridX - GRID_SIZE/2) * SPACING;
                const targetZ = (playerGridY - GRID_SIZE/2) * SPACING;
                
                if (playerGroup) {
                    playerGroup.position.lerp(new THREE.Vector3(targetX, 0.2, targetZ), 0.3);
                    controls.target.lerp(new THREE.Vector3(targetX, 0.6, targetZ), 0.2);
                }
                
                document.getElementById('playerPos').innerHTML = `(${playerGridX},${playerGridY})`;
                
                if (!visited[playerGridX][playerGridY]) {
                    visited[playerGridX][playerGridY] = true;
                    visitedCount++;
                    playerState.points += 10;
                    document.getElementById('visitedCount').innerHTML = visitedCount;
                    document.getElementById('points').innerHTML = playerState.points;
                    showPOV(playerGridX, playerGridY);
                    showToast(`✨ +10 نقاط! ✨`);
                }
            }
        }
        
        function getPointTitle(x, y) {
            const titles = [
                "الساحة المركزية", "غابة الصنوبر", "وادي الجداول", "قمة الجبل",
                "القلعة القديمة", "شلالات الجبل", "شاطئ الجنة", "فوهة البركان"
            ];
            return titles[(x * GRID_SIZE + y) % titles.length];
        }
        
        function showPOV(x, y) {
            const imgId = (x * GRID_SIZE + y) % 100 + 10;
            document.getElementById('povImage').src = `https://picsum.photos/id/${imgId}/1000/700`;
            document.getElementById('povModal').classList.add('active');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        window.closePOV = () => document.getElementById('povModal').classList.remove('active');
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== إنشاء العالم 3D ==========
        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1030);
            scene.fog = new THREE.FogExp2(0x0a1030, 0.008);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(10, 7, 12);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // إضاءة
            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
            sunLight.position.set(10, 20, 5);
            sunLight.castShadow = true;
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0x404060, 0.6));
            
            // أرضية
            const groundGeo = new THREE.PlaneGeometry(30, 30);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a6b3a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // شبكة مساعدة
            const gridHelper = new THREE.GridHelper(28, 20, 0x88aa88, 0x446644);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
            
            // نقاط
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = (i - GRID_SIZE/2) * SPACING;
                    const z = (j - GRID_SIZE/2) * SPACING;
                    
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.15, 8), new THREE.MeshStandardMaterial({ color: 0xcc8844 }));
                    base.position.set(x, 0, z);
                    scene.add(base);
                    
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.7, 6), new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224466 }));
                    pillar.position.set(x, 0.4, z);
                    scene.add(pillar);
                    
                    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422 }));
                    orb.position.set(x, 0.8, z);
                    scene.add(orb);
                }
            }
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.target.set(0, 0.6, 0);
            
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
        
        // ========== معالجة الحركة ==========
        function processMovement() {
            const now = Date.now();
            if (now - lastMoveTime < MOVE_DELAY) return;
            
            if (moving.up) { movePlayer(0, -1); lastMoveTime = now; }
            else if (moving.down) { movePlayer(0, 1); lastMoveTime = now; }
            else if (moving.left) { movePlayer(-1, 0); lastMoveTime = now; }
            else if (moving.right) { movePlayer(1, 0); lastMoveTime = now; }
        }
        
        // ========== إعداد الأزرار ==========
        function setupControls() {
            const btns = {
                up: document.getElementById('btnUp'), down: document.getElementById('btnDown'),
                left: document.getElementById('btnLeft'), right: document.getElementById('btnRight')
            };
            
            const setMove = (dir, active) => {
                moving.up = false; moving.down = false; moving.left = false; moving.right = false;
                if (active) moving[dir] = true;
            };
            
            btns.up.addEventListener('touchstart', (e) => { e.preventDefault(); setMove('up', true); });
            btns.up.addEventListener('touchend', () => setMove('up', false));
            btns.up.addEventListener('mousedown', () => setMove('up', true));
            btns.up.addEventListener('mouseup', () => setMove('up', false));
            
            btns.down.addEventListener('touchstart', (e) => { e.preventDefault(); setMove('down', true); });
            btns.down.addEventListener('touchend', () => setMove('down', false));
            btns.down.addEventListener('mousedown', () => setMove('down', true));
            btns.down.addEventListener('mouseup', () => setMove('down', false));
            
            btns.left.addEventListener('touchstart', (e) => { e.preventDefault(); setMove('left', true); });
            btns.left.addEventListener('touchend', () => setMove('left', false));
            btns.left.addEventListener('mousedown', () => setMove('left', true));
            btns.left.addEventListener('mouseup', () => setMove('left', false));
            
            btns.right.addEventListener('touchstart', (e) => { e.preventDefault(); setMove('right', true); });
            btns.right.addEventListener('touchend', () => setMove('right', false));
            btns.right.addEventListener('mousedown', () => setMove('right', true));
            btns.right.addEventListener('mouseup', () => setMove('right', false));
            
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') setMove('up', true);
                if (e.key === 'ArrowDown') setMove('down', true);
                if (e.key === 'ArrowLeft') setMove('left', true);
                if (e.key === 'ArrowRight') setMove('right', true);
                e.preventDefault();
            });
            window.addEventListener('keyup', () => { moving.up = false; moving.down = false; moving.left = false; moving.right = false; });
            
            document.getElementById('upgradeBtn').addEventListener('click', upgradeWeapon);
        }
        
        // ========== بدء اللعبة ==========
        visited[playerGridX][playerGridY] = true;
        document.getElementById('visitedCount').innerHTML = visitedCount;
        document.getElementById('weaponLevel').innerHTML = playerState.weaponLevel;
        document.getElementById('points').innerHTML = playerState.points;
        
        init3D();
        setupControls();
        setInterval(processMovement, 150);
        loadCharacter();
        
        console.log("🎮 PUBG - تجربة GLB من Three.js!");
        console.log("🔗 روابط GLB التجريبية:");
        console.log("   سلاح: " + GLB_URLS.weapon_test);
        console.log("   شخصية: " + GLB_URLS.character_test);
    </script>
</body>
</html>
