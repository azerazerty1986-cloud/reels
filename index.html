<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBG Mobile | شخصية تتحرك + أرضية نقاط + صور POV</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #000;
            touch-action: none;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* واجهة المستخدم */
        .ui {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 8px 12px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            border: 1px solid #ff5722;
            pointer-events: none;
        }
        
        .player-info {
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
        
        .tile-counter {
            background: #ff5722;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 12px;
        }
        
        /* أزرار التحكم - كبيرة وواضحة */
        .controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 18px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            padding: 15px 25px;
            border-radius: 80px;
            margin: 0 20px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 70px;
            height: 70px;
            background: rgba(255,87,34,0.5);
            border: 3px solid #ff5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.05s linear;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .control-btn:active {
            background: #ff5722;
            transform: scale(0.92);
        }
        
        /* نافذة الصورة POV */
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-image {
            max-width: 95%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 15px;
            border: 3px solid #ff5722;
            box-shadow: 0 0 40px rgba(255,87,34,0.5);
        }
        
        .pov-info {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 12px;
            margin: 0 20px;
            border-radius: 20px;
        }
        
        .pov-title {
            font-size: 18px;
            color: #ff5722;
            font-weight: bold;
        }
        
        .close-pov {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #ff5722;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 201;
        }
        
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #ff5722;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 150;
            border: 1px solid #ff5722;
            white-space: nowrap;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .control-btn { width: 60px; height: 60px; font-size: 28px; }
            .controls { gap: 12px; padding: 10px 20px; }
            .player-info { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="ui">
        <div class="player-info">
            🎮 <span id="playerPos">(4,4)</span>
        </div>
        <div class="tile-counter">
            🏆 <span id="visitedCount">1</span>/<span id="totalTiles">64</span>
        </div>
        <div class="player-info">
            📍 <span id="currentTile">البداية</span>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="btnUp" style="background: #ff5722;">▲</div>
        <div class="control-btn" id="btnLeft">◀</div>
        <div class="control-btn" id="btnDown">▼</div>
        <div class="control-btn" id="btnRight">▶</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="pov-modal" id="povModal">
        <div class="close-pov" onclick="closePOV()">✖</div>
        <img class="pov-image" id="povImage">
        <div class="pov-info">
            <div class="pov-title" id="povTitle"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ========== تكامل تليجرام ==========
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        // ========== إعدادات العالم ==========
        const GRID_SIZE = 8;
        const SPACING = 3.2;
        
        // موقع اللاعب
        let playerGridX = Math.floor(GRID_SIZE / 2);
        let playerGridY = Math.floor(GRID_SIZE / 2);
        
        // النقاط التي تمت زيارتها
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 1;
        
        // عناصر Three.js
        let scene, camera, renderer, controls;
        let playerMesh;
        
        // حالة الحركة
        let moving = { up: false, down: false, left: false, right: false };
        let lastMoveTime = 0;
        const MOVE_DELAY = 250; // ميلي ثانية بين كل حركة
        
        // ========== صور POV ==========
        const titles = [
            "🏛️ الساحة المركزية", "🌲 غابة الصنوبر", "🏞️ وادي الجداول", "🏔️ قمة الجبل",
            "🏯 القلعة القديمة", "🌊 شلالات الجبل", "🏖️ شاطئ الجنة", "🌋 فوهة البركان",
            "🏝️ جزيرة النخيل", "🏜️ صحراء الذهب", "🏘️ القرية التراثية", "🌾 حقول القمح",
            "⛲ حدائق الزهور", "🎪 ساحة المهرجانات", "🏰 قصر الملوك", "🌌 سماء الليل",
            "🎋 غابة الخيزران", "❄️ الأنهار الجليدية", "🌈 وادي قوس قزح", "🌋 بحيرة البركان",
            "🏞️ مضيق الجبال", "🌠 زخة شهب", "🌸 بستان الكرز", "🏯 معبد السلام",
            "🎨 وادي الفنانين", "🦋 وادي الفراشات", "🍇 كروم العنب", "⛰️ قمة السحاب",
            "🏕️ مخيم النجوم", "🛶 بحيرة الهدوء", "🏰 قلعة الضباب", "🌿 غابة السرخس",
            "🌙 وادي القمر", "🎭 مسرح الطبيعة", "🔮 كهف البلور", "🌟 ميدان النجوم",
            "🏞️ بحيرة المرايا", "🌳 غابة العمالقة", "⛲ نافورة الأحلام", "🏔️ جبل الأمل",
            "🏜️ واحة النخيل", "🌋 سهل الحمم", "🏝️ شاطئ المرجان", "🌲 غابة الضباب",
            "🏯 معبد الشمس", "🌾 سهول القمح", "⛰️ وادي الصخور", "🌸 حدائق الساكورا",
            "🏔️ قمة الجليد", "🌿 مرج الزهور", "🏞️ شلالات القمر", "🏜️ كثبان الرمال",
            "🌲 غابة الأقزام", "🏰 حصن الحجر", "⛲ نافورة الشباب", "🌟 حقل النجوم",
            "🏔️ جبل النار", "🌊 خليج الدلافين", "🏞️ محمية الطيور", "🌾 مزرعة الخزامى",
            "🏯 قلعة الرمال", "🌲 غابة الأضواء", "⛰️ قمة الغروب", "🏆 ميدان البطولة"
        ];
        
        function getImageUrl(x, y) {
            const id = (x * GRID_SIZE + y) % 100 + 10;
            return `https://picsum.photos/id/${id}/1000/700`;
        }
        
        function getPointTitle(x, y) {
            const idx = (x * GRID_SIZE + y) % titles.length;
            return titles[idx];
        }
        
        // ========== عرض صورة POV ==========
        function showPOV(x, y) {
            const title = getPointTitle(x, y);
            const imageUrl = getImageUrl(x, y);
            
            document.getElementById('povImage').src = imageUrl;
            document.getElementById('povTitle').innerHTML = title;
            document.getElementById('povModal').classList.add('active');
            
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        window.closePOV = () => {
            document.getElementById('povModal').classList.remove('active');
        };
        
        // ========== تحديث موقع اللاعب ==========
        function movePlayer(dx, dy) {
            const newX = playerGridX + dx;
            const newY = playerGridY + dy;
            
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                playerGridX = newX;
                playerGridY = newY;
                
                // تحديث موقع الشخصية 3D
                const targetX = (playerGridX - GRID_SIZE/2) * SPACING;
                const targetZ = (playerGridY - GRID_SIZE/2) * SPACING;
                
                if (playerMesh) {
                    playerMesh.position.set(targetX, 0.2, targetZ);
                    controls.target.set(targetX, 0.6, targetZ);
                }
                
                // تحديث واجهة المستخدم
                document.getElementById('playerPos').innerHTML = `(${playerGridX},${playerGridY})`;
                const title = getPointTitle(playerGridX, playerGridY);
                document.getElementById('currentTile').innerHTML = title.substring(0, 14);
                
                // تسجيل الزيارة
                if (!visited[playerGridX][playerGridY]) {
                    visited[playerGridX][playerGridY] = true;
                    visitedCount++;
                    document.getElementById('visitedCount').innerHTML = visitedCount;
                    showPOV(playerGridX, playerGridY);
                    
                    // رسالة منبثقة
                    showToast(`✨ اكتشفت ${title}! ✨`);
                }
            }
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== معالجة الحركة ==========
        function processMovement() {
            const now = Date.now();
            if (now - lastMoveTime < MOVE_DELAY) return;
            
            if (moving.up) {
                movePlayer(0, -1);
                lastMoveTime = now;
            } else if (moving.down) {
                movePlayer(0, 1);
                lastMoveTime = now;
            } else if (moving.left) {
                movePlayer(-1, 0);
                lastMoveTime = now;
            } else if (moving.right) {
                movePlayer(1, 0);
                lastMoveTime = now;
            }
        }
        
        // ========== إنشاء العالم 3D ==========
        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1030);
            scene.fog = new THREE.FogExp2(0x0a1030, 0.008);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(10, 7, 12);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // الإضاءة
            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
            sunLight.position.set(10, 20, 5);
            sunLight.castShadow = true;
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);
            
            // الأرضية
            const groundGeo = new THREE.PlaneGeometry(30, 30);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a6b3a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // شبكة مساعدة
            const gridHelper = new THREE.GridHelper(28, 20, 0x88aa88, 0x446644);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
            
            // إنشاء النقاط
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = (i - GRID_SIZE/2) * SPACING;
                    const z = (j - GRID_SIZE/2) * SPACING;
                    
                    // قاعدة
                    const baseMat = new THREE.MeshStandardMaterial({ color: 0xcc8844 });
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.15, 8), baseMat);
                    base.position.set(x, 0, z);
                    base.castShadow = true;
                    scene.add(base);
                    
                    // العمود
                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224466 });
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.7, 6), pillarMat);
                    pillar.position.set(x, 0.4, z);
                    pillar.castShadow = true;
                    scene.add(pillar);
                    
                    // الكرة
                    const orbMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422 });
                    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), orbMat);
                    orb.position.set(x, 0.8, z);
                    scene.add(orb);
                }
            }
            
            // ========== شخصية بوبجي ==========
            const character = new THREE.Group();
            
            // الجسم
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0x4a7a5a }));
            body.castShadow = true;
            body.position.y = 0.45;
            character.add(body);
            
            // الرأس
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf5c4a0 }));
            head.castShadow = true;
            head.position.y = 0.95;
            character.add(head);
            
            // خوذة
            const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x5a6b3a, metalness: 0.6 }));
            helmet.position.y = 1.12;
            helmet.castShadow = true;
            character.add(helmet);
            
            // سلاح
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.7 }));
            gun.position.set(0.55, 0.55, 0.25);
            gun.castShadow = true;
            character.add(gun);
            
            // حقيبة
            const bag = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.35), new THREE.MeshStandardMaterial({ color: 0x5d3a1a }));
            bag.position.set(-0.4, 0.5, -0.3);
            bag.castShadow = true;
            character.add(bag);
            
            character.position.set(0, 0, 0);
            character.castShadow = true;
            scene.add(character);
            playerMesh = character;
            
            // التحكم
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.rotateSpeed = 1.0;
            controls.zoomSpeed = 0.8;
            controls.target.set(0, 0.6, 0);
            
            // تحديث موقع البداية
            const startX = (playerGridX - GRID_SIZE/2) * SPACING;
            const startZ = (playerGridY - GRID_SIZE/2) * SPACING;
            character.position.set(startX, 0.2, startZ);
            controls.target.set(startX, 0.6, startZ);
            camera.position.set(startX + 8, 6, startZ + 8);
            
            // حلقة الرسم
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
        
        // ========== إعداد أزرار التحكم ==========
        function setupControls() {
            const btnUp = document.getElementById('btnUp');
            const btnDown = document.getElementById('btnDown');
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            
            // أحداث اللمس
            btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); moving.up = true; moving.down = false; moving.left = false; moving.right = false; });
            btnUp.addEventListener('touchend', () => { moving.up = false; });
            btnUp.addEventListener('mousedown', () => { moving.up = true; moving.down = false; moving.left = false; moving.right = false; });
            btnUp.addEventListener('mouseup', () => { moving.up = false; });
            
            btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); moving.down = true; moving.up = false; moving.left = false; moving.right = false; });
            btnDown.addEventListener('touchend', () => { moving.down = false; });
            btnDown.addEventListener('mousedown', () => { moving.down = true; moving.up = false; moving.left = false; moving.right = false; });
            btnDown.addEventListener('mouseup', () => { moving.down = false; });
            
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moving.left = true; moving.up = false; moving.down = false; moving.right = false; });
            btnLeft.addEventListener('touchend', () => { moving.left = false; });
            btnLeft.addEventListener('mousedown', () => { moving.left = true; moving.up = false; moving.down = false; moving.right = false; });
            btnLeft.addEventListener('mouseup', () => { moving.left = false; });
            
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moving.right = true; moving.up = false; moving.down = false; moving.left = false; });
            btnRight.addEventListener('touchend', () => { moving.right = false; });
            btnRight.addEventListener('mousedown', () => { moving.right = true; moving.up = false; moving.down = false; moving.left = false; });
            btnRight.addEventListener('mouseup', () => { moving.right = false; });
            
            // لوحة المفاتيح
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') { moving.up = true; moving.down = false; moving.left = false; moving.right = false; e.preventDefault(); }
                if (e.key === 'ArrowDown') { moving.down = true; moving.up = false; moving.left = false; moving.right = false; e.preventDefault(); }
                if (e.key === 'ArrowLeft') { moving.left = true; moving.up = false; moving.down = false; moving.right = false; e.preventDefault(); }
                if (e.key === 'ArrowRight') { moving.right = true; moving.up = false; moving.down = false; moving.left = false; e.preventDefault(); }
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp') moving.up = false;
                if (e.key === 'ArrowDown') moving.down = false;
                if (e.key === 'ArrowLeft') moving.left = false;
                if (e.key === 'ArrowRight') moving.right = false;
            });
        }
        
        // ========== بدء اللعبة ==========
        visited[playerGridX][playerGridY] = true;
        document.getElementById('visitedCount').innerHTML = visitedCount;
        document.getElementById('totalTiles').innerHTML = GRID_SIZE * GRID_SIZE;
        document.getElementById('playerPos').innerHTML = `(${playerGridX},${playerGridY})`;
        document.getElementById('currentTile').innerHTML = getPointTitle(playerGridX, playerGridY).substring(0, 14);
        
        init3D();
        setupControls();
        
        // حلقة الحركة
        setInterval(processMovement, 150);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePOV();
        });
        
        console.log('🎮 PUBG Mobile - شخصية تتحرك بالأزرار!');
        console.log(`📍 الموقع الحالي: (${playerGridX},${playerGridY})`);
    </script>
</body>
</html>
