<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام المحاكاة الشخصية | عالم تفاعلي</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root { 
            --accent: #00f2ff;
            --accent-glow: 0 0 20px rgba(0,242,255,0.5);
            --walk-color: #4caf50;
            --run-color: #ff9800;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #0a0a2a; 
            overflow: hidden; 
            color: white; 
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        #viewport { 
            position: absolute; 
            inset: 0; 
            z-index: 1; 
            background: linear-gradient(135deg, #1a1a3a, #0a0a2a);
        }
        
        /* خلفية بديلة عندما لا يوجد فيديو */
        .fallback-bg {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2a2a4a, #0a0a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        
        .fallback-bg .emoji-bg {
            font-size: 80px;
            filter: drop-shadow(0 0 20px var(--accent));
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            top: 0;
            left: 0;
            transition: opacity 0.5s;
        }
        
        #blink { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 50; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.15s; 
            z-index: 200;
        }
        
        .active-blink { opacity: 1 !important; }

        #hud { 
            position: absolute; 
            bottom: 20px; 
            left: 0;
            right: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 100; 
            pointer-events: none; 
        }
        
        #map-box { 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(15px); 
            padding: 12px; 
            border-radius: 20px; 
            border: 2px solid var(--accent); 
            pointer-events: auto;
            box-shadow: var(--accent-glow);
            margin-bottom: 10px;
        }
        
        #location-text { 
            background: rgba(0,0,0,0.9); 
            padding: 10px 20px; 
            border-radius: 30px; 
            margin-bottom: 12px; 
            font-size: 14px; 
            border: 1px solid var(--accent);
            backdrop-filter: blur(5px);
            text-align: center;
            font-weight: bold;
        }
        
        canvas {
            display: block;
            cursor: pointer;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            pointer-events: auto;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            padding: 12px 25px;
            border-radius: 60px;
            border: 1px solid var(--accent);
        }
        
        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 32px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        
        .ctrl-btn:active {
            transform: scale(0.9);
            background: var(--accent);
            color: #000;
        }
        
        .ctrl-btn.run {
            border-color: var(--run-color);
            color: var(--run-color);
        }
        
        .ctrl-btn.run:active {
            background: var(--run-color);
            color: #000;
        }
        
        .status-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            font-size: 12px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .mode-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .mode-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--walk-color);
            transition: all 0.3s;
        }
        
        .mode-dot.running {
            background: var(--run-color);
            box-shadow: 0 0 10px var(--run-color);
        }
        
        #start-screen { 
            position: fixed; 
            inset: 0; 
            background: linear-gradient(135deg, #0a0a2a, #000000); 
            z-index: 1000; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            flex-direction: column;
            gap: 30px;
        }
        
        .start-btn { 
            border: 2px solid var(--accent); 
            color: var(--accent); 
            padding: 15px 40px; 
            background: rgba(0,242,255,0.1); 
            border-radius: 60px; 
            font-size: 20px; 
            cursor: pointer; 
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .start-btn:active {
            transform: scale(0.95);
            background: var(--accent);
            color: #000;
        }
        
        .user-info {
            color: var(--accent);
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 30px;
        }
        
        .toast {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 200;
            border: 1px solid var(--accent);
            white-space: nowrap;
            pointer-events: none;
            font-weight: bold;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        
        .running-effect {
            animation: shake 0.08s infinite;
        }
        
        @media (max-width: 600px) {
            .ctrl-btn { width: 60px; height: 60px; font-size: 28px; }
            .controls { gap: 15px; padding: 10px 20px; }
            #location-text { font-size: 11px; }
            .status-bar { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="user-info" id="userInfoDisplay">🔄 جاري الاتصال...</div>
        <button class="start-btn" onclick="enterSim()">🚀 دخول المحاكاة</button>
        <div style="font-size: 12px; color: #666;">شخصية متحركة | اضغط واستمر للمشي أو الجري</div>
    </div>
    
    <div id="blink"></div>
    
    <div class="status-bar">
        <div class="mode-indicator">
            <div class="mode-dot" id="modeDot"></div>
            <span id="modeText">⏸ واقف</span>
        </div>
        <div>👣 <span id="stepCount">0</span> خطوة</div>
        <div>📍 <span id="coordDisplay">0,0</span></div>
    </div>
    
    <div id="viewport">
        <div id="fallbackBg" class="fallback-bg" style="display: flex;">
            <div class="emoji-bg" id="locationEmoji">🏛️</div>
            <div style="font-size: 18px; color: var(--accent);" id="locationName">الساحة المركزية</div>
        </div>
        <video id="povVideo" loop muted playsinline style="display: none;"></video>
    </div>

    <div id="hud">
        <div id="location-text">📍 الساحة المركزية<br><span style="font-size: 11px;">قلب المدينة القديمة</span></div>
        <div id="map-box">
            <canvas id="mCanvas" width="200" height="200"></canvas>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn walk" id="walkBtn">🚶</button>
            <button class="ctrl-btn run" id="runBtn">🏃</button>
        </div>
    </div>

    <script>
        // ========== تكامل تليجرام ==========
        const tg = window.Telegram.WebApp;
        let userData = null;
        
        const BOT_CONFIG = {
            botToken: '8576673096:AAEFKd-YSJcW_0d_wAHZBt-5nPg_VOjDX_0',
            channelId: '-1003822964890',
            adminId: '7461896689'
        };
        
        // ========== عناصر الصفحة ==========
        const povVideo = document.getElementById('povVideo');
        const fallbackBg = document.getElementById('fallbackBg');
        const blink = document.getElementById('blink');
        const canvas = document.getElementById('mCanvas');
        const ctx = canvas.getContext('2d');
        
        // ========== إعدادات العالم ==========
        const MAP_SIZE = 8;
        let cellSize;
        let userPos = { x: 0, y: 0 };
        let isLoading = false;
        
        // ========== نظام الحركة ==========
        let movingInterval = null;
        let currentMode = null; // 'walk' or 'run'
        let stepCount = 0;
        let lastStepTime = 0;
        
        const STEP_DELAY = {
            walk: 350,
            run: 150
        };
        
        // ========== قاعدة بيانات المواقع (باستخدام Emojis كخلفية بديلة) ==========
        const locations = {
            "0,0": { emoji: "🏛️", name: "الساحة المركزية", desc: "قلب المدينة القديمة", ambient: "🎵 أصوات المدينة" },
            "0,1": { emoji: "🌲", name: "الغابة الشمالية", desc: "أشجار صنوبر شامخة", ambient: "🍃 حفيف الأشجار" },
            "0,2": { emoji: "🏞️", name: "وادي الأنهار", desc: "جداول ماء صافية", ambient: "💧 خرير الماء" },
            "1,0": { emoji: "🏔️", name: "جبل القمر", desc: "قمة شاهقة", ambient: "🌬️ رياح جبلية" },
            "1,1": { emoji: "🏯", name: "قلعة الأساطير", desc: "قلعة عتيقة", ambient: "🏰 تاريخ عريق" },
            "1,2": { emoji: "🌊", name: "شلالات النور", desc: "شلالات متدفقة", ambient: "💦 صوت الشلال" },
            "2,0": { emoji: "🏖️", name: "شاطئ اللؤلؤ", desc: "رمال ذهبية", ambient: "🌊 أمواج البحر" },
            "2,1": { emoji: "🌋", name: "بركان النار", desc: "منطقة بركانية", ambient: "🔥 حمم متدفقة" },
            "2,2": { emoji: "🏝️", name: "جزيرة الأحلام", desc: "جنة استوائية", ambient: "🌴 نخيل ونسيم" },
            "3,0": { emoji: "🏜️", name: "صحراء الذهب", desc: "كثبان رملية", ambient: "🏜️ هدوء الصحراء" },
            "3,1": { emoji: "🏘️", name: "قرية الحرفيين", desc: "بيوت تقليدية", ambient: "🔨 حرف يدوية" },
            "3,2": { emoji: "🌾", name: "مزارع القمح", desc: "حقول ذهبية", ambient: "🌾 سنابل قمح" },
            "4,0": { emoji: "⛲", name: "حدائق الزهور", desc: "روضة ملونة", ambient: "🦋 فراشات" },
            "4,1": { emoji: "🎪", name: "ساحة الاحتفالات", desc: "أضواء ملونة", ambient: "🎉 أجواء احتفالية" },
            "4,2": { emoji: "🏰", name: "قصر الملوك", desc: "قصر فخم", ambient: "👑 فخامة ملكية" },
            "5,0": { emoji: "🌌", name: "بوابة الأبعاد", desc: "مكان غامض", ambient: "✨ طاقة غامضة" },
            "5,1": { emoji: "🎋", name: "غابة الخيزران", desc: "هدوء شرقي", ambient: "🎋 سكون" },
            "5,2": { emoji: "❄️", name: "جليد الشمال", desc: "أنهار جليدية", ambient: "❄️ صقيع" },
            "6,0": { emoji: "🌈", name: "وادي قوس قزح", desc: "وادي ملون", ambient: "🌈 سحر" },
            "6,1": { emoji: "🏞️", name: "مضيق الأبطال", desc: "مضيق عميق", ambient: "🏔️ عظمة" },
            "6,2": { emoji: "🌠", name: "أرض النجوم", desc: "تساقط النجوم", ambient: "⭐ سحر الليل" },
            "7,0": { emoji: "🌸", name: "بستان الكرز", desc: "أزهار وردية", ambient: "🌸 ربيع" },
            "7,1": { emoji: "🏯", name: "معبد السلام", desc: "طبيعة خلابة", ambient: "🕊️ سلام" },
            "7,2": { emoji: "🌋", name: "عين البركان", desc: "بحيرة زرقاء", ambient: "🌋 دفء" }
        };
        
        function getLocationData(x, y) {
            const key = `${x},${y}`;
            if (locations[key]) return locations[key];
            return {
                emoji: "🌍",
                name: `منطقة ${String.fromCharCode(65 + x)}${y + 1}`,
                desc: "منطقة استكشافية جديدة",
                ambient: "🔍 استكشاف"
            };
        }
        
        // ========== تحديث العرض (خلفية Emoji بديلة) ==========
        function updateView(x, y) {
            const loc = getLocationData(x, y);
            
            // تحديث النص
            document.getElementById('location-text').innerHTML = `📍 ${loc.name}<br><span style="font-size: 11px;">${loc.desc}</span><br><span style="font-size: 10px; color: var(--accent);">${loc.ambient}</span>`;
            document.getElementById('coordDisplay').innerHTML = `${x},${y}`;
            
            // تحديث الخلفية البديلة
            const emojiElement = document.querySelector('#fallbackBg .emoji-bg');
            const nameElement = document.getElementById('locationName');
            if (emojiElement) emojiElement.innerHTML = loc.emoji;
            if (nameElement) nameElement.innerHTML = loc.name;
        }
        
        // ========== رسم الخريطة مع شخصية واضحة ==========
        function drawMap() {
            canvas.width = 200;
            canvas.height = 200;
            cellSize = canvas.width / MAP_SIZE;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(let y = 0; y < MAP_SIZE; y++) {
                for(let x = 0; x < MAP_SIZE; x++) {
                    // رسم شبكة
                    ctx.strokeStyle = "rgba(0,242,255,0.4)";
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    
                    // أيقونة الموقع
                    const loc = getLocationData(x, y);
                    ctx.font = `${cellSize * 0.45}px "Segoe UI"`;
                    ctx.fillStyle = "rgba(0,242,255,0.7)";
                    ctx.fillText(loc.emoji, x * cellSize + 5, y * cellSize + cellSize - 8);
                    
                    // رسم الشخصية - دائرة كبيرة واضحة
                    if(x === userPos.x && y === userPos.y) {
                        const centerX = x * cellSize + cellSize/2;
                        const centerY = y * cellSize + cellSize/2;
                        const radius = cellSize * 0.35;
                        
                        // توهج خارجي
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = "#00f2ff";
                        
                        // الجسم
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                        ctx.fillStyle = "#00f2ff";
                        ctx.fill();
                        
                        // عيون
                        ctx.fillStyle = "#ffffff";
                        ctx.beginPath();
                        ctx.arc(centerX - radius * 0.4, centerY - radius * 0.2, radius * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(centerX + radius * 0.4, centerY - radius * 0.2, radius * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // بؤبؤ العين
                        ctx.fillStyle = "#000000";
                        ctx.beginPath();
                        ctx.arc(centerX - radius * 0.4, centerY - radius * 0.2, radius * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(centerX + radius * 0.4, centerY - radius * 0.2, radius * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // ابتسامة
                        ctx.beginPath();
                        ctx.arc(centerX, centerY + radius * 0.2, radius * 0.25, 0, Math.PI);
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        
                        ctx.shadowBlur = 0;
                        
                        // إضافة تأثير جري/مشي
                        if (currentMode === 'run') {
                            ctx.beginPath();
                            ctx.moveTo(centerX - radius * 0.7, centerY + radius * 0.5);
                            ctx.lineTo(centerX - radius * 1, centerY + radius * 0.8);
                            ctx.lineTo(centerX - radius * 0.4, centerY + radius * 0.6);
                            ctx.fillStyle = "#ff9800";
                            ctx.fill();
                            ctx.beginPath();
                            ctx.moveTo(centerX + radius * 0.7, centerY + radius * 0.5);
                            ctx.lineTo(centerX + radius * 1, centerY + radius * 0.8);
                            ctx.lineTo(centerX + radius * 0.4, centerY + radius * 0.6);
                            ctx.fill();
                        }
                    }
                }
            }
        }
        
        // ========== تأثير ترميش ==========
        async function blinkEffect() {
            blink.classList.add('active-blink');
            setTimeout(() => blink.classList.remove('active-blink'), 150);
        }
        
        // ========== تنفيذ الخطوة ==========
        async function performStep(direction) {
            if (!direction) return;
            
            const now = Date.now();
            const minDelay = currentMode === 'run' ? 120 : 250;
            if (now - lastStepTime < minDelay) return;
            lastStepTime = now;
            
            let newX = userPos.x;
            let newY = userPos.y;
            
            switch(direction) {
                case 'up': newY--; break;
                case 'down': newY++; break;
                case 'left': newX--; break;
                case 'right': newX++; break;
            }
            
            if (newX >= 0 && newX < MAP_SIZE && newY >= 0 && newY < MAP_SIZE) {
                if (newX !== userPos.x || newY !== userPos.y) {
                    userPos.x = newX;
                    userPos.y = newY;
                    stepCount++;
                    document.getElementById('stepCount').innerHTML = stepCount;
                    
                    drawMap();
                    updateView(userPos.x, userPos.y);
                    await blinkEffect();
                    
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred(currentMode === 'run' ? 'heavy' : 'light');
                    }
                }
            } else {
                stopMoving();
                showToast("🚫 حدود العالم!", 800);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }
        
        // ========== متغيرات الاتجاه ==========
        let activeDirection = null;
        let stepInterval = null;
        
        function startMoving(mode, direction) {
            if (stepInterval) clearInterval(stepInterval);
            
            currentMode = mode;
            activeDirection = direction;
            
            // تحديث واجهة الوضع
            const modeDot = document.getElementById('modeDot');
            const modeText = document.getElementById('modeText');
            if (mode === 'run') {
                modeDot.classList.add('running');
                modeText.innerHTML = '🏃 جري';
                document.body.classList.add('running-effect');
            } else {
                modeDot.classList.remove('running');
                modeText.innerHTML = '🚶 مشي';
                document.body.classList.remove('running-effect');
            }
            
            const delay = mode === 'run' ? 150 : 350;
            stepInterval = setInterval(() => {
                performStep(activeDirection);
            }, delay);
            
            performStep(activeDirection);
        }
        
        function stopMoving() {
            if (stepInterval) {
                clearInterval(stepInterval);
                stepInterval = null;
            }
            currentMode = null;
            activeDirection = null;
            
            const modeDot = document.getElementById('modeDot');
            const modeText = document.getElementById('modeText');
            modeDot.classList.remove('running');
            modeText.innerHTML = '⏸ واقف';
            document.body.classList.remove('running-effect');
        }
        
        // ========== معالجة أزرار التحكم ==========
        let currentTouchDirection = 'down';
        
        function setupControls() {
            const walkBtn = document.getElementById('walkBtn');
            const runBtn = document.getElementById('runBtn');
            
            // دوال بدء الحركة مع اتجاه افتراضي
            const startWalk = (e) => {
                e.preventDefault();
                startMoving('walk', currentTouchDirection);
            };
            
            const startRun = (e) => {
                e.preventDefault();
                startMoving('run', currentTouchDirection);
            };
            
            const stop = (e) => {
                e.preventDefault();
                stopMoving();
            };
            
            // أحداث الضغط
            walkBtn.addEventListener('mousedown', startWalk);
            walkBtn.addEventListener('mouseup', stop);
            walkBtn.addEventListener('mouseleave', stop);
            walkBtn.addEventListener('touchstart', startWalk);
            walkBtn.addEventListener('touchend', stop);
            
            runBtn.addEventListener('mousedown', startRun);
            runBtn.addEventListener('mouseup', stop);
            runBtn.addEventListener('mouseleave', stop);
            runBtn.addEventListener('touchstart', startRun);
            runBtn.addEventListener('touchend', stop);
        }
        
        // ========== التحكم بالسحب لتغيير الاتجاه ==========
        let touchStart = { x: 0, y: 0 };
        
        function handleTouchStart(e) {
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
        }
        
        function handleTouchMove(e) {
            if (!currentMode) return;
            
            const deltaX = e.touches[0].clientX - touchStart.x;
            const deltaY = e.touches[0].clientY - touchStart.y;
            
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
                if (deltaX > 0) currentTouchDirection = 'right';
                else currentTouchDirection = 'left';
            } else if (Math.abs(deltaY) > 20) {
                if (deltaY > 0) currentTouchDirection = 'down';
                else currentTouchDirection = 'up';
            }
        }
        
        // ========== نقر على الخريطة ==========
        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clickX = (e.clientX - rect.left) * scaleX;
            let clickY = (e.clientY - rect.top) * scaleY;
            
            const newX = Math.floor(clickX / cellSize);
            const newY = Math.floor(clickY / cellSize);
            
            if (newX >= 0 && newX < MAP_SIZE && newY >= 0 && newY < MAP_SIZE) {
                stopMoving();
                if (newX !== userPos.x || newY !== userPos.y) {
                    userPos.x = newX;
                    userPos.y = newY;
                    stepCount++;
                    document.getElementById('stepCount').innerHTML = stepCount;
                    drawMap();
                    updateView(userPos.x, userPos.y);
                    blinkEffect();
                }
            }
        }
        
        // ========== التحكم بالكيبورد ==========
        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                let direction = null;
                switch(e.key) {
                    case 'ArrowUp': direction = 'up'; break;
                    case 'ArrowDown': direction = 'down'; break;
                    case 'ArrowLeft': direction = 'left'; break;
                    case 'ArrowRight': direction = 'right'; break;
                }
                if (direction) {
                    e.preventDefault();
                    const mode = e.shiftKey ? 'run' : 'walk';
                    startMoving(mode, direction);
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    stopMoving();
                }
            });
        }
        
        // ========== إشعارات ==========
        async function sendToChannel(message) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: BOT_CONFIG.channelId, text: message, parse_mode: 'HTML' })
                });
            } catch(e) {}
        }
        
        async function sendToAdmin(message) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: BOT_CONFIG.adminId, text: message, parse_mode: 'HTML' })
                });
            } catch(e) {}
        }
        
        async function logUserEntry() {
            if (!userData) return;
            const message = `🎮 <b>دخول جديد</b>\n👤 ${userData.first_name}\n🆔 <code>${userData.id}</code>`;
            await sendToChannel(message);
            await sendToAdmin(message);
        }
        
        function showToast(msg, duration = 1500) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        
        // ========== الدخول ==========
        async function enterSim() {
            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.remove(), 500);
            
            const userId = userData ? userData.id : Math.floor(Math.random() * 10000);
            userPos.x = userId % MAP_SIZE;
            userPos.y = Math.floor((userId / MAP_SIZE) % MAP_SIZE);
            
            drawMap();
            updateView(userPos.x, userPos.y);
            await logUserEntry();
            
            showToast(`🎮 مرحباً ${userData?.first_name || 'زائر'}! اضغط مع الاستمرار 🚶 للمشي أو 🏃 للجري`, 3000);
            
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        
        // ========== تهيئة Telegram ==========
        function initTelegram() {
            try {
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe?.user) {
                    userData = tg.initDataUnsafe.user;
                    document.getElementById('userInfoDisplay').innerHTML = `👤 مرحباً ${userData.first_name}`;
                } else {
                    userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                    document.getElementById('userInfoDisplay').innerHTML = `👤 زائر | تجربة`;
                }
            } catch(e) {
                userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                document.getElementById('userInfoDisplay').innerHTML = `👤 وضع التجربة`;
            }
        }
        
        // ========== بدء التشغيل ==========
        function init() {
            initTelegram();
            drawMap();
            updateView(0, 0);
            setupControls();
            setupKeyboard();
            
            canvas.addEventListener('click', handleCanvasClick);
            document.addEventListener('touchstart', handleTouchStart);
            document.addEventListener('touchmove', handleTouchMove);
        }
        
        init();
        
        window.enterSim = enterSim;
        window.startMoving = startMoving;
        window.stopMoving = stopMoving;
        
        console.log('🎮 النظام جاهز - شخصية واضحة + خلفيات Emoji');
    </script>
</body>
</html>
