        :root { 
            --accent: #00f2ff;
            --accent-glow: 0 0 20px rgba(0,242,255,0.5);
            --accent-glow-strong: 0 0 30px rgba(0,242,255,0.8);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
            color: white; 
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        #viewport { 
            position: absolute; 
            inset: 0; 
            z-index: 1; 
            background: #000;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            top: 0;
            left: 0;
            transition: opacity 0.5s;
        }
        
        /* تأثير ترميش العين */
        #blink { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 200; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.15s; 
        }
        
        .active-blink { opacity: 1 !important; }

        /* واجهة HUD */
        #hud { 
            position: absolute; 
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 100; 
            pointer-events: none; 
            gap: 12px;
        }
        
        #location-box { 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(15px); 
            padding: 12px 20px; 
            border-radius: 20px; 
            border: 1px solid var(--accent); 
            pointer-events: auto;
            box-shadow: var(--accent-glow);
            text-align: center;
            min-width: 200px;
        }
        
        #location-title { 
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }
        
        #location-desc {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 5px;
        }
        
        #location-ambience {
            font-size: 10px;
            color: #888;
        }
        
        #map-box { 
            background: rgba(0,0,0,0.7); 
            backdrop-filter: blur(15px); 
            padding: 12px; 
            border-radius: 20px; 
            border: 1px solid var(--accent); 
            pointer-events: auto;
        }
        
        canvas {
            display: block;
            cursor: pointer;
            border-radius: 12px;
        }

        /* شاشة الدخول */
        #start-screen { 
            position: fixed; 
            inset: 0; 
            background: linear-gradient(135deg, #0a0a2a, #000000); 
            z-index: 1000; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            flex-direction: column;
            gap: 30px;
        }
        
        .start-btn { 
            border: 2px solid var(--accent); 
            color: var(--accent); 
            padding: 15px 40px; 
            background: rgba(0,242,255,0.1); 
            border-radius: 60px; 
            font-size: 20px; 
            cursor: pointer; 
            transition: all 0.3s;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            background: var(--accent);
            color: #000;
            box-shadow: var(--accent-glow-strong);
        }
        
        .user-info {
            color: var(--accent);
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        
        .toast {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 200;
            border: 1px solid var(--accent);
            white-space: nowrap;
            pointer-events: none;
            font-weight: bold;
        }
        
        /* لوحة الفيديوهات التوضيحية */
        .video-demo-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 12px;
            z-index: 150;
            border: 1px solid var(--accent);
            max-width: 280px;
            pointer-events: auto;
            transition: all 0.3s;
        }
        
        .video-demo-panel h4 {
            color: var(--accent);
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .demo-item {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 5px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }
        
        .demo-item:hover {
            transform: scale(1.05);
            background: var(--accent);
        }
        
        .demo-icon {
            font-size: 20px;
        }
        
        .demo-label {
            font-size: 8px;
            margin-top: 3px;
            color: #ccc;
        }

            .video-demo-panel { display: none; }

            #location-desc { font-size: 9px; }
            .start-btn { padding: 12px 30px; font-size: 16px; }
        }

        // الحصول على بيانات الموقع

            if (locations[key]) return locations[key];
            return {
                videoUrl: "https://cdn.pixabay.com/video/2023/01/17/145678-792345678_large.mp4",
                title: `🌍 منطقة ${String.fromCharCode(65 + x)}${y + 1}`,

            };

        // ========== إرسال إشعارات ==========
        async function sendToChannel(message) {
            try {
                const url = `https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_CONFIG.channelId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(error) {}
        }
        
        async function sendToAdmin(message) {
            try {
                const url = `https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_CONFIG.adminId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(error) {}
        }
        
        // ========== تسجيل دخول المستخدم ==========
        async function logUserEntry() {
            if (!userData) return;
            const userName = userData.first_name || userData.username || 'مستخدم';
            const loc = getLocationData(userPos.x, userPos.y);
            const message = `🎮 <b>دخول جديد</b>\n👤 ${userName}\n🆔 <code>${userData.id}</code>\n📍 ${loc.title}`;
            await sendToChannel(message);
            await sendToAdmin(message);
        }
        
        // ========== تحميل فيديو POV ==========
        let currentVideoUrl = "";
        
        async function loadPOV(x, y) {
            if (isLoading) return;
            isLoading = true;
            
            const loc = getLocationData(x, y);
            
            // تحديث واجهة الموقع
            document.getElementById('location-title').innerHTML = `📍 ${loc.title}`;
            document.getElementById('location-desc').innerHTML = loc.description;
            document.getElementById('location-ambience').innerHTML = loc.ambience;
            
            // تأثير ترميش
            blink.classList.add('active-blink');
            
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            
            setTimeout(async () => {
                try {
                    if (currentVideoUrl !== loc.videoUrl) {
                        currentVideoUrl = loc.videoUrl;
                        povVideo.style.opacity = '0';
                        
                        setTimeout(() => {
                            povVideo.src = loc.videoUrl;
                            povVideo.load();
                            povVideo.play().catch(e => console.log('auto-play'));
                            povVideo.style.opacity = '1';
                        }, 100);
                    }
                } catch(e) {}
                
                blink.classList.remove('active-blink');
                isLoading = false;
            }, 200);
        }

            canvas.width = 200;
            canvas.height = 200;
            cellSize = canvas.width / MAP_SIZE;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(let x = 0; x < MAP_SIZE; x++) {
                for(let y = 0; y < MAP_SIZE; y++) {
                    ctx.strokeStyle = "rgba(0,242,255,0.3)";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    
                    if(x === userPos.x && y === userPos.y) {
                        ctx.fillStyle = "#00f2ff";
                        ctx.beginPath();
                        ctx.arc(x * cellSize + cellSize/2, y * cellSize + cellSize/2, cellSize/3.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "#00f2ff";
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    
                    ctx.fillStyle = "rgba(0,242,255,0.4)";
                    ctx.font = `${cellSize * 0.35}px "Segoe UI"`;
                    ctx.fillText("📍", x * cellSize + 3, y * cellSize + cellSize - 5);
                }
            }
        }
        
        // ========== التنقل ==========
        let lastMoveTime = 0;
        
        async function moveTo(x, y) {
            const now = Date.now();
            if (now - lastMoveTime < 300) return;
            lastMoveTime = now;
            
            if (x < 0) x = 0;
            if (x >= MAP_SIZE) x = MAP_SIZE - 1;
            if (y < 0) y = 0;
            if (y >= MAP_SIZE) y = MAP_SIZE - 1;
            
            const moved = (userPos.x !== x || userPos.y !== y);
            
            if (moved) {
                userPos.x = x;
                userPos.y = y;
                drawMap();
                await loadPOV(x, y);
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        }
        
        // ========== عرض فيديو توضيحي ==========
        function showDemoVideo(locationKey) {
            const loc = locations[locationKey];
            if (loc && loc.demoVideo) {
                const tempVideo = document.createElement('video');
                tempVideo.src = loc.demoVideo;
                tempVideo.style.position = 'fixed';
                tempVideo.style.top = '50%';
                tempVideo.style.left = '50%';
                tempVideo.style.transform = 'translate(-50%, -50%)';
                tempVideo.style.width = '80%';
                tempVideo.style.maxWidth = '400px';
                tempVideo.style.zIndex = '1000';
                tempVideo.style.borderRadius = '20px';
                tempVideo.style.border = `2px solid var(--accent)`;
                tempVideo.style.boxShadow = `var(--accent-glow-strong)`;
                tempVideo.controls = true;
                tempVideo.autoplay = true;
                
                document.body.appendChild(tempVideo);
                
                tempVideo.onended = () => tempVideo.remove();
                
                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '✖';
                closeBtn.style.position = 'fixed';
                closeBtn.style.top = 'calc(50% - 220px)';
                closeBtn.style.left = 'calc(50% + 220px)';
                closeBtn.style.background = 'rgba(0,0,0,0.8)';
                closeBtn.style.color = 'white';
                closeBtn.style.border = '1px solid var(--accent)';
                closeBtn.style.borderRadius = '30px';
                closeBtn.style.width = '35px';
                closeBtn.style.height = '35px';
                closeBtn.style.cursor = 'pointer';
                closeBtn.style.zIndex = '1001';
                closeBtn.style.fontSize = '18px';
                closeBtn.onclick = () => tempVideo.remove();
                document.body.appendChild(closeBtn);
                
                setTimeout(() => closeBtn.remove(), 30000);
            }
        }
        
        // ========== إنشاء لوحة الفيديوهات التوضيحية ==========
        function buildDemoPanel() {
            const demoGrid = document.getElementById('demoGrid');
            demoGrid.innerHTML = '';
            
            const demoLocations = [
                { key: "0,0", icon: "🏛️", name: "المركز" },
                { key: "0,1", icon: "🌲", name: "الغابة" },
                { key: "1,0", icon: "🏔️", name: "الجبل" },
                { key: "1,1", icon: "🏯", name: "القلعة" },
                { key: "2,0", icon: "🏖️", name: "الشاطئ" },
                { key: "2,1", icon: "🌋", name: "البركان" },
                { key: "3,0", icon: "🏜️", name: "الصحراء" },
                { key: "4,0", icon: "⛲", name: "الحدائق" },
                { key: "5,0", icon: "🌌", name: "الأبعاد" },
                { key: "5,1", icon: "🎋", name: "الخيزران" },
                { key: "6,0", icon: "🌈", name: "قوس قزح" },
                { key: "7,0", icon: "🌠", name: "النجوم" }
            ];
            
            demoLocations.forEach(loc => {
                const item = document.createElement('div');
                item.className = 'demo-item';
                item.onclick = () => showDemoVideo(loc.key);
                item.innerHTML = `
                    <div class="demo-icon">${loc.icon}</div>
                    <div class="demo-label">${loc.name}</div>
                `;
                demoGrid.appendChild(item);
            });
        }
        
        // ========== معالجة الأحداث ==========
        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clickX = (e.clientX - rect.left) * scaleX;
            let clickY = (e.clientY - rect.top) * scaleY;
            
            const newX = Math.floor(clickX / cellSize);
            const newY = Math.floor(clickY / cellSize);
            
            if (newX >= 0 && newX < MAP_SIZE && newY >= 0 && newY < MAP_SIZE) {
                moveTo(newX, newY);
            }
        }
        
        let touchStartX = 0, touchStartY = 0;
        
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
        
        function handleTouchEnd(e) {
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            
            if (Math.abs(deltaX) < 30 && Math.abs(deltaY) < 30) return;
            
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 0) moveTo(userPos.x + 1, userPos.y);
                else moveTo(userPos.x - 1, userPos.y);
            } else {
                if (deltaY > 0) moveTo(userPos.x, userPos.y + 1);
                else moveTo(userPos.x, userPos.y - 1);
            }
        }
        
        function showToast(message, duration = 2000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        
        // ========== الدخول للمحاكاة ==========
        async function enterSim() {
            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.remove(), 500);
            
            const userId = userData ? userData.id : Math.floor(Math.random() * 10000);
            userPos.x = userId % MAP_SIZE;
            userPos.y = Math.floor((userId / MAP_SIZE) % MAP_SIZE);
            
            drawMap();
            await loadPOV(userPos.x, userPos.y);
            await logUserEntry();
            
            showToast(`🎮 مرحباً ${userData?.first_name || 'زائر'}! استكشف العالم`, 2500);
            
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
        
        // ========== تهيئة Telegram ==========
        function initTelegram() {
            try {
                tg.ready();
                tg.expand();
                tg.enableClosingConfirmation();
                
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userData = tg.initDataUnsafe.user;
                    const userName = userData.first_name || userData.username || 'مستخدم';
                    document.getElementById('userInfoDisplay').innerHTML = `👤 مرحباً ${userName}`;
                } else {
                    userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                    document.getElementById('userInfoDisplay').innerHTML = `👤 زائر | تجربة`;
                }
            } catch(e) {
                userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                document.getElementById('userInfoDisplay').innerHTML = `👤 وضع التجربة`;
            }
        }
        
        // ========== إضافة الأحداث ==========
        function addEvents() {
            canvas.addEventListener('click', handleCanvasClick);
            document.addEventListener('touchstart', handleTouchStart);
            document.addEventListener('touchend', handleTouchEnd);
            
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowUp': moveTo(userPos.x, userPos.y - 1); break;
                    case 'ArrowDown': moveTo(userPos.x, userPos.y + 1); break;
                    case 'ArrowLeft': moveTo(userPos.x - 1, userPos.y); break;
                    case 'ArrowRight': moveTo(userPos.x + 1, userPos.y); break;
                }
                e.preventDefault();
            });
        }
        
        // ========== بدء التشغيل ==========
        function init() {
            initTelegram();
            drawMap();
            addEvents();
            buildDemoPanel();
            
            povVideo.loop = true;
            povVideo.muted = true;
            povVideo.playsInline = true;
        }
        
        init();
        
        window.moveTo = moveTo;
        window.enterSim = enterSim;
        window.showDemoVideo = showDemoVideo;
        
        console.log('🎬 نظام POV الموحد جاهز - 24 موقع مختلف مع فيديوهات توضيحية');
    </script>
</body>
</html>
