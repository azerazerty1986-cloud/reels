<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBG - أرضية المربعات | كل نقطة لها فيديو POV</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0a2a;
            touch-action: none;
        }
        
        /* حاوية اللعبة */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }
        
        /* واجهة المستخدم */
        .ui {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 12px 20px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #ff5722;
            pointer-events: none;
        }
        
        .player-info {
            color: white;
            font-size: 14px;
        }
        
        .health-bar {
            width: 150px;
            height: 8px;
            background: #555;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .health-fill {
            width: 100%;
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
        
        .tile-counter {
            background: #ff5722;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        /* أزرار التحكم */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 55px;
            height: 55px;
            background: rgba(255,87,34,0.3);
            border: 2px solid #ff5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:active {
            background: #ff5722;
            transform: scale(0.95);
        }
        
        /* نافذة POV */
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-content {
            background: rgba(0,0,0,0.9);
            border-radius: 25px;
            padding: 20px;
            max-width: 90%;
            width: 800px;
            text-align: center;
        }
        
        .pov-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ff5722;
        }
        
        .pov-video {
            width: 100%;
            max-height: 400px;
            border-radius: 15px;
            border: 3px solid #ff5722;
        }
        
        .pov-title {
            font-size: 24px;
            color: #ff5722;
            margin: 15px 0 5px;
        }
        
        .pov-desc {
            color: #ccc;
            font-size: 14px;
        }
        
        .close-pov {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #ff5722;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .close-pov:hover {
            background: #ff5722;
        }
        
        /* رسالة منبثقة */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: #ff5722;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 150;
            border: 1px solid #ff5722;
            white-space: nowrap;
            pointer-events: none;
        }
        
        @media (max-width: 600px) {
            .ui { padding: 8px 12px; }
            .player-info { font-size: 10px; }
            .health-bar { width: 100px; }
            .control-btn { width: 45px; height: 45px; font-size: 16px; }
            .pov-title { font-size: 18px; }
        }
    </style>
</head>

            "6,3": { image: "https://picsum.photos/id/129/400/300", video: "https://cdn.pixabay.com/video/2023/02/05/152345-801234567_hd.mp4", title: "🏜️ كثبان الرمال", desc: "كثبان رملية ذهبية" },
            "6,4": { image: "https://picsum.photos/id/131/400/300", video: "https://cdn.pixabay.com/video/2021/08/20/86543-601234567_hd.mp4", title: "🌲 غابة الأقزام", desc: "غابة مليئة بالأشجار الصغيرة" },
            "6,5": { image: "https://picsum.photos/id/133/400/300", video: "https://cdn.pixabay.com/video/2022/11/30/141234-781234567_hd.mp4", title: "🏰 حصن الحجر", desc: "حصن قديم مبني من الحجر" },
            "6,6": { image: "https://picsum.photos/id/135/400/300", video: "https://cdn.pixabay.com/video/2020/12/15/58765-492345678_hd.mp4", title: "⛲ نافورة الشباب", desc: "نافورة أسطورية" },
            "6,7": { image: "https://picsum.photos/id/137/400/300", video: "https://cdn.pixabay.com/video/2023/04/28/163456-826543210_hd.mp4", title: "🌟 حقل النجوم", desc: "حقل يتوهج بالنجوم ليلاً" },
            
            // الصف 7
            "7,0": { image: "https://picsum.photos/id/139/400/300", video: "https://cdn.pixabay.com/video/2022/01/15/106543-678901234_hd.mp4", title: "🏔️ جبل النار", desc: "جبل بركاني نشط" },
            "7,1": { image: "https://picsum.photos/id/141/400/300", video: "https://cdn.pixabay.com/video/2021/06/20/79876-578901234_hd.mp4", title: "🌊 خليج الدلافين", desc: "خليج تعيش فيه الدلافين" },
            "7,2": { image: "https://picsum.photos/id/143/400/300", video: "https://cdn.pixabay.com/video/2023/09/01/179876-861234567_hd.mp4", title: "🏞️ محمية الطيور", desc: "محمية طبيعية للطيور المهاجرة" },
            "7,3": { image: "https://picsum.photos/id/145/400/300", video: "https://cdn.pixabay.com/video/2020/08/22/47654-445678901_hd.mp4", title: "🌾 مزرعة الخزامى", desc: "مزرعة واسعة من الخزامى" },
            "7,4": { image: "https://picsum.photos/id/147/400/300", video: "https://cdn.pixabay.com/video/2022/07/10/123456-712345678_hd.mp4", title: "🏯 قلعة الرمال", desc: "قلعة مبنية من الرمال" },
            "7,5": { image: "https://picsum.photos/id/149/400/300", video: "https://cdn.pixabay.com/video/2021/02/18/65432-512345678_hd.mp4", title: "🌲 غابة الأضواء", desc: "غابة تتوهج بالليل" },
            "7,6": { image: "https://picsum.photos/id/150/400/300", video: "https://cdn.pixabay.com/video/2023/10/01/182345-874567890_hd.mp4", title: "⛰️ قمة الغروب", desc: "أفضل مكان لمشاهدة الغروب" },
            "7,7": { image: "https://picsum.photos/id/151/400/300", video: "https://cdn.pixabay.com/video/2020/11/28/53456-487654321_hd.mp4", title: "🏆 ميدان البطولة", desc: "مكان الاحتفالات والبطولات" }
        };
        
        function getTileData(x, y) {
            const key = `${x},${y}`;
            if (tilesData[key]) return tilesData[key];
            return { image: "https://picsum.photos/id/100/400/300", video: "https://cdn.pixabay.com/video/2023/01/17/145678-792345678_hd.mp4", title: "🌍 منطقة جديدة", desc: "منطقة تنتظر اكتشافك" };
        }
        
        // ========== عرض POV ==========
        function showPOV(tileX, tileY) {
            const data = getTileData(tileX, tileY);
            const modal = document.getElementById('povModal');
            const povImage = document.getElementById('povImage');
            const povVideo = document.getElementById('povVideo');
            const povTitle = document.getElementById('povTitle');
            const povDesc = document.getElementById('povDesc');
            
            // عرض الصورة والفيديو معاً
            povImage.src = data.image;
            povImage.style.display = 'block';
            povVideo.src = data.video;
            povVideo.style.display = 'block';
            povVideo.load();
            povVideo.play().catch(e => console.log('Auto-play'));
            
            povTitle.innerHTML = `${data.title}`;
            povDesc.innerHTML = data.desc;
            
            modal.classList.add('active');
        }
        
        function closePOV() {
            const modal = document.getElementById('povModal');
            const povVideo = document.getElementById('povVideo');
            povVideo.pause();
            modal.classList.remove('active');
        }
        
        // ========== حركة اللاعب ==========
        let moveState = { up: false, down: false, left: false, right: false };
        
        function movePlayer() {
            let newX = player.x;
            let newY = player.y;
            
            if (moveState.up) newY--;
            if (moveState.down) newY++;
            if (moveState.left) newX--;
            if (moveState.right) newX++;
            
            // التحقق من الحدود
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                // تسجيل الزيارة
                if (!visited[newX][newY]) {
                    visited[newX][newY] = true;
                    visitedCount++;
                    document.getElementById('visitedCount').innerHTML = visitedCount;
                    
                    // عرض POV للمربع الجديد
                    showPOV(newX, newY);
                    
                    // زيادة الصحة كمكافأة
                    player.health = Math.min(100, player.health + 5);
                    updateHealthBar();
                    
                    showToast(`✨ اكتشفت ${getTileData(newX, newY).title}! +5 صحة ✨`);
                }
                
                player.x = newX;
                player.y = newY;
                updateCurrentTile();
            }
        }
        
        function updateCurrentTile() {
            const data = getTileData(player.x, player.y);
            document.getElementById('currentTile').innerHTML = data.title.substring(0, 15);
        }
        
        function updateHealthBar() {
            document.getElementById('healthValue').innerHTML = Math.floor(player.health);
            document.getElementById('healthFill').style.width = player.health + "%";
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== رسم اللعبة ==========
        function draw() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const tileW = canvas.width / GRID_SIZE;
            const tileH = canvas.height / GRID_SIZE;
            
            // رسم شبكة المربعات
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = i * tileW;
                    const y = j * tileH;
                    
                    // لون المربع
                    if (visited[i][j]) {
                        ctx.fillStyle = '#2e7d32';
                        ctx.fillRect(x, y, tileW, tileH);
                        ctx.fillStyle = '#4caf50';
                        ctx.font = `${tileW * 0.3}px "Segoe UI"`;
                        ctx.fillText("✓", x + 5, y + tileH - 10);
                    } else {
                        ctx.fillStyle = '#1b5e20';
                        ctx.fillRect(x, y, tileW, tileH);
                    }
                    
                    // حدود المربعات
                    ctx.strokeStyle = '#ff5722';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, tileW, tileH);
                    
                    // إضافة أيقونة للمربعات المميزة
                    if (i === player.x && j === player.y) {
                        // رسم اللاعب
                        ctx.fillStyle = '#ffeb3b';
                        ctx.beginPath();
                        ctx.arc(x + tileW/2, y + tileH/2, tileW * 0.25, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#333';
                        ctx.beginPath();
                        ctx.ellipse(x + tileW/2 + 8, y + tileH/2 - 5, 5, 3, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (!visited[i][j]) {
                        // أيقونة موقع غير مكتشف
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.font = `${tileW * 0.25}px "Segoe UI"`;
                        ctx.fillText("?", x + tileW/2 - 8, y + tileH/2 + 5);
                    }
                }
            }
            
            // رسم تاج للاعب
            const px = player.x * tileW;
            const py = player.y * tileH;
            ctx.fillStyle = '#ff5722';
            ctx.font = `${tileW * 0.3}px "Segoe UI"`;
            ctx.fillText("👑", px + tileW/2 - 12, py + tileH/2 - 15);
        }
        
        // ========== أزرار التحكم ==========
        document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.up = true; });
        document.getElementById('btnUp').addEventListener('touchend', () => moveState.up = false);
        document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.down = true; });
        document.getElementById('btnDown').addEventListener('touchend', () => moveState.down = false);
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.left = true; });
        document.getElementById('btnLeft').addEventListener('touchend', () => moveState.left = false);
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.right = true; });
        document.getElementById('btnRight').addEventListener('touchend', () => moveState.right = false);
        
        // التحكم بلوحة المفاتيح
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') moveState.up = true;
            if (e.key === 'ArrowDown') moveState.down = true;
            if (e.key === 'ArrowLeft') moveState.left = true;
            if (e.key === 'ArrowRight') moveState.right = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') moveState.up = false;
            if (e.key === 'ArrowDown') moveState.down = false;
            if (e.key === 'ArrowLeft') moveState.left = false;
            if (e.key === 'ArrowRight') moveState.right = false;
        });
        
        // تسجيل المربع الأول كتمت زيارته
        visited[player.x][player.y] = true;
        visitedCount = 1;
        document.getElementById('visitedCount').innerHTML = visitedCount;
        document.getElementById('totalTiles').innerHTML = GRID_SIZE * GRID_SIZE;
        updateCurrentTile();
        updateHealthBar();
        
        // حلقة اللعبة
        document.getElementById('totalTiles').innerHTML = GRID_SIZE * GRID_SIZE;
        
        function gameLoop() {
            movePlayer();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        // تحديث حجم الشاشة
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        console.log(`🎮 PUBG - ${GRID_SIZE}x${GRID_SIZE} = ${GRID_SIZE * GRID_SIZE} موقع، كل موقع له صورة وفيديو POV!`);
    </script>
</body>
</html>
