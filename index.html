<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎮 لعبة الأرضية التفاعلية | كل مربع له عالمه الخاص</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --accent: #00f2ff;
            --accent-glow: 0 0 15px rgba(0,242,255,0.5);
            --gold: #ffd700;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a2a, #000000);
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            color: white;
        }
        
        /* الهيدر */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--accent);
        }
        
        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
        }
        
        .game-title span {
            color: var(--gold);
        }
        
        .stats {
            display: flex;
            gap: 20px;
            font-size: 12px;
        }
        
        .stat {
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        /* الحاوية الرئيسية */
        .game-container {
            padding-top: 70px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* شبكة المربعات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            max-width: 95vw;
            margin: 0 auto;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
        }
        
        /* كل مربع */
        .tile {
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 15px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            border: 2px solid rgba(0,242,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .tile:hover {
            transform: scale(1.02);
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }
        
        .tile.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        
        /* صورة مصغرة للمربع */
        .tile-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .tile:hover .tile-preview {
            transform: scale(1.1);
        }
        
        /* أيقونة التشغيل */
        .play-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        
        /* اسم المربع */
        .tile-name {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 8px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        
        /* لوحة العرض الرئيسية */
        .main-view {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .main-view.active {
            opacity: 1;
            visibility: visible;
        }
        
        .main-video {
            width: 90%;
            max-width: 500px;
            border-radius: 25px;
            border: 3px solid var(--accent);
            box-shadow: 0 0 50px rgba(0,242,255,0.3);
        }
        
        .main-info {
            margin-top: 20px;
            text-align: center;
        }
        
        .main-title {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .main-desc {
            color: #ccc;
            max-width: 400px;
            padding: 0 20px;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--accent);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .close-btn:hover {
            background: var(--accent);
            color: black;
            transform: scale(1.1);
        }
        
        /* شاشة الدخول */
        .start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a2a, #000000);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        
        .start-btn {
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 40px;
            background: rgba(0,242,255,0.1);
            border-radius: 60px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 30px rgba(0,242,255,0.5);
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 1100;
            border: 1px solid var(--accent);
            white-space: nowrap;
            pointer-events: none;
        }
        
        @media (max-width: 600px) {
            .grid-container {
                gap: 5px;
                padding: 10px;
            }
            .game-title { font-size: 14px; }
            .stats { gap: 10px; font-size: 10px; }
            .main-title { font-size: 18px; }
        }
        
        /* مؤشر التحميل */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,242,255,0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="start-screen" id="startScreen">
        <div class="game-title" style="font-size: 28px;">🎮 <span>عالم المربعات</span> 🎮</div>
        <div style="text-align: center; color: #aaa; max-width: 280px;">
            🌍 6x6 مربع<br>
            📹 كل مربع له فيديو خاص<br>
            🎬 جولة في العالم من مكانك
        </div>
        <button class="start-btn" onclick="startGame()">🚀 ابدأ الرحلة</button>
    </div>
    
    <!-- الهيدر -->
    <div class="header" style="display: none;" id="header">
        <div class="game-title">🎮 <span>عالم المربعات</span> | 6x6</div>
        <div class="stats">
            <div class="stat">📹 <span id="visitedCount">0</span>/36</div>
            <div class="stat">📍 المربع <span id="currentTile">-</span></div>
        </div>
    </div>
    
    <!-- الحاوية الرئيسية -->
    <div class="game-container" id="gameContainer" style="display: none;">
        <div class="grid-container" id="grid"></div>
    </div>
    
    <!-- نافذة العرض الرئيسية -->
    <div class="main-view" id="mainView">
        <div class="close-btn" onclick="closeMainView()">✖</div>
        <video class="main-video" id="mainVideo" controls autoplay loop muted></video>
        <div class="main-info">
            <div class="main-title" id="mainTitle"></div>
            <div class="main-desc" id="mainDesc"></div>
        </div>
    </div>

            // الصف 4

        };
        
        // الحصول على بيانات المربع
        function getTileData(row, col) {
            const key = `${row},${col}`;
            if (tilesData[key]) return tilesData[key];
            return {
                video: "https://cdn.pixabay.com/video/2023/01/17/145678-792345678_large.mp4",
                title: `🌍 منطقة ${String.fromCharCode(65 + row)}${col + 1}`,
                desc: "منطقة جديدة تنتظر اكتشافك",
                icon: "🌍",
                color: "#666"
            };
        }
        
        // ========== متغيرات اللعبة ==========
        const GRID_SIZE = 6;
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 0;
        let currentTile = null;
        let currentVideoElement = null;
        
        // ========== بناء الشبكة ==========
        function buildGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const data = getTileData(row, col);
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.setAttribute('data-row', row);
                    tile.setAttribute('data-col', col);
                    
                    // صورة مصغرة من الفيديو (لقطة ثابتة)
                    const img = document.createElement('img');
                    img.className = 'tile-preview';
                    // استخدام إطار ثابت من الفيديو
                    img.src = `https://img.youtube.com/vi/default/mqdefault.jpg`;
                    img.onerror = () => {
                        // إذا فشل تحميل الصورة، نستخدم أيقونة
                        img.style.display = 'none';
                    };
                    
                    const playIcon = document.createElement('div');
                    playIcon.className = 'play-icon';
                    playIcon.innerHTML = '▶️';
                    
                    const tileName = document.createElement('div');
                    tileName.className = 'tile-name';
                    tileName.innerHTML = `${data.icon} ${data.title.substring(0, 10)}`;
                    
                    tile.appendChild(img);
                    tile.appendChild(playIcon);
                    tile.appendChild(tileName);
                    
                    // تأثير زيارة
                    if (visited[row][col]) {
                        tile.style.borderColor = 'var(--gold)';
                        tile.style.boxShadow = '0 0 15px rgba(255,215,0,0.3)';
                    }
                    
                    tile.onclick = () => openTile(row, col);
                    grid.appendChild(tile);
                }
            }
        }
        
        // ========== فتح المربع وعرض الفيديو ==========
        function openTile(row, col) {
            const data = getTileData(row, col);
            currentTile = { row, col, data };
            
            // تحديث واجهة العرض
            const mainView = document.getElementById('mainView');
            const mainVideo = document.getElementById('mainVideo');
            const mainTitle = document.getElementById('mainTitle');
            const mainDesc = document.getElementById('mainDesc');
            
            mainTitle.innerHTML = `${data.icon} ${data.title}`;
            mainDesc.innerHTML = data.desc;
            
            // تحميل الفيديو
            mainVideo.src = data.video;
            mainVideo.load();
            mainVideo.play().catch(e => console.log('Auto-play prevented'));
            
            // عرض النافذة
            mainView.classList.add('active');
            
            // تسجيل الزيارة إذا كانت أول مرة
            if (!visited[row][col]) {
                visited[row][col] = true;
                visitedCount++;
                document.getElementById('visitedCount').innerHTML = visitedCount;
                
                // تحديث المربع في الشبكة
                const tiles = document.querySelectorAll('.tile');
                const index = row * GRID_SIZE + col;
                if (tiles[index]) {
                    tiles[index].style.borderColor = 'var(--gold)';
                    tiles[index].style.boxShadow = '0 0 15px rgba(255,215,0,0.3)';
                }
                
                showToast(`✨ اكتشفت ${data.title}! ✨`);
                
                // إرسال إشعار لتليجرام
                sendDiscoveryMessage(row, col, data.title);
            }
            
            // تحديث المربع الحالي في الهيدر
            document.getElementById('currentTile').innerHTML = `${row+1},${col+1}`;
        }
        
        function closeMainView() {
            const mainView = document.getElementById('mainView');
            const mainVideo = document.getElementById('mainVideo');
            mainVideo.pause();
            mainView.classList.remove('active');
        }
        
        // ========== إرسال إشعار لتليجرام ==========
        const BOT_CONFIG = {
            botToken: '8576673096:AAEFKd-YSJcW_0d_wAHZBt-5nPg_VOjDX_0',
            channelId: '-1003822964890'
        };
        
        async function sendDiscoveryMessage(row, col, title) {
            if (!userData) return;
            try {
                const userName = userData.first_name || userData.username || 'مستخدم';
                const message = `🎮 <b>اكتشاف جديد!</b>\n👤 ${userName}\n📍 ${title}\n🗺️ الموقع: (${row+1},${col+1})\n📊 التقدم: ${visitedCount+1}/36`;
                const url = `https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_CONFIG.channelId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }
        
        // ========== عرض رسالة منبثقة ==========
        function showToast(message, duration = 2000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        
        // ========== بدء اللعبة ==========
        function startGame() {
            // إخفاء شاشة البداية
            const startScreen = document.getElementById('startScreen');
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.remove(), 500);
            
            // إظهار الهيدر والحاوية
            document.getElementById('header').style.display = 'flex';
            document.getElementById('gameContainer').style.display = 'flex';
            
            // بناء الشبكة
            buildGrid();
            
            // تهيئة تليجرام
            initTelegram();
            
            showToast('🎮 مرحباً بك في عالم المربعات! اضغط على أي مربع لاستكشافه');
        }
        
        // ========== تهيئة تليجرام ==========
        function initTelegram() {
            try {
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userData = tg.initDataUnsafe.user;
                } else {
                    userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                }
            } catch(e) {
                userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
            }
        }
        
        // ========== إغلاق النافذة بالضغط على ESC ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMainView();
            }
        });
        
        console.log('🎮 لعبة الأرضية التفاعلية جاهزة - 36 مربع، كل مربع له فيديو خاص!');
    </script>
</body>
</html>
