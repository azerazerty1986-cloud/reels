<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>عالم النقاط | شخصية متحركة + صور POV</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0a2a;
            touch-action: none;
        }
        
        /* حاوية اللعبة */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }
        
        /* واجهة المستخدم */
        .ui {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 10px 15px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #00f2ff;
            pointer-events: none;
        }
        
        .player-info {
            color: white;
            font-size: 12px;
        }
        
        .tile-counter {
            background: #00f2ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: #000;
            font-size: 12px;
        }
        
        /* أزرار التحكم */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 50;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 60px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 65px;
            height: 65px;
            background: rgba(0,242,255,0.2);
            border: 2px solid #00f2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:active {
            background: #00f2ff;
            transform: scale(0.95);
            color: #000;
        }
        
        /* نافذة الصورة POV (تملأ الشاشة) */
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-image {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,242,255,0.5);
            border: 3px solid #00f2ff;
        }
        
        .pov-info {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            margin: 0 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .pov-title {
            font-size: 24px;
            color: #00f2ff;
            margin-bottom: 8px;
        }
        
        .close-pov {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #00f2ff;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 201;
        }
        
        .close-pov:hover {
            background: #00f2ff;
            color: #000;
        }
        
        /* رسالة منبثقة */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: #00f2ff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 150;
            border: 1px solid #00f2ff;
            pointer-events: none;
        }
        
        @media (max-width: 600px) {
            .controls { gap: 12px; padding: 8px 18px; }
            .control-btn { width: 55px; height: 55px; font-size: 22px; }
            .pov-title { font-size: 18px; }
            .ui { padding: 6px 12px; }
            .player-info { font-size: 10px; }
        }
    </style>
</head>

        function getPointData(x, y) {
            const key = `${x},${y}`;
            if (pointsData[key]) return pointsData[key];
            return { image: "https://picsum.photos/id/100/1200/800", title: "🌍 منطقة جديدة", desc: "منطقة تنتظر اكتشافك" };
        }
        
        // ========== عرض الصورة POV (تملأ الشاشة) ==========
        function showPOV(x, y) {
            const data = getPointData(x, y);
            const modal = document.getElementById('povModal');
            const povImage = document.getElementById('povImage');
            const povTitle = document.getElementById('povTitle');
            const povDesc = document.getElementById('povDesc');
            
            povImage.src = data.image;
            povTitle.innerHTML = data.title;
            povDesc.innerHTML = data.desc;
            
            modal.classList.add('active');
            
            // اهتزاز
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
        
        function closePOV() {
            const modal = document.getElementById('povModal');
            modal.classList.remove('active');
        }
        
        // ========== حركة الشخصية ==========
        let moveState = { up: false, down: false, left: false, right: false };
        
        function movePlayer() {
            let newX = player.x;
            let newY = player.y;
            
            if (moveState.up) newY--;
            if (moveState.down) newY++;
            if (moveState.left) newX--;
            if (moveState.right) newX++;
            
            // التحقق من الحدود
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                const moved = (newX !== player.x || newY !== player.y);
                
                if (moved) {
                    player.x = newX;
                    player.y = newY;
                    
                    // تحديث موقع اللاعب في الواجهة
                    document.getElementById('playerPos').innerHTML = `(${player.x},${player.y})`;
                    
                    // تسجيل الزيارة إذا كانت أول مرة
                    if (!visited[player.x][player.y]) {
                        visited[player.x][player.y] = true;
                        visitedCount++;
                        document.getElementById('visitedCount').innerHTML = visitedCount;
                        
                        // عرض الصورة POV
                        showPOV(player.x, player.y);
                        
                        // تحديث اسم الموقع الحالي
                        const data = getPointData(player.x, player.y);
                        document.getElementById('currentTile').innerHTML = data.title.substring(0, 15);
                        
                        // رسالة منبثقة
                        showToast(`✨ اكتشفت ${data.title}! ✨`);
                        
                        // إرسال إشعار لتليجرام (اختياري)
                        sendToTelegram(`اكتشف ${data.title}`);
                    } else {
                        // تحديث اسم الموقع حتى لو مكتشف سابقاً
                        const data = getPointData(player.x, player.y);
                        document.getElementById('currentTile').innerHTML = data.title.substring(0, 15);
                    }
                }
            }
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== إرسال إلى تليجرام ==========
        const BOT_CONFIG = {
            botToken: '8576673096:AAEFKd-YSJcW_0d_wAHZBt-5nPg_VOjDX_0',
            channelId: '-1003822964890'
        };
        
        async function sendToTelegram(message) {
            try {
                const url = `https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_CONFIG.channelId,
                        text: `🎮 ${message}\n📍 الموقع: (${player.x},${player.y})`,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }
        
        // ========== رسم اللعبة ==========
        function draw() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // مسافة بين النقاط
            const spacing = Math.min(canvas.width, canvas.height) / (GRID_SIZE + 2);
            const startX = centerX - (GRID_SIZE - 1) * spacing / 2;
            const startY = centerY - (GRID_SIZE - 1) * spacing / 2;
            
            // رسم خلفية متدرجة
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#0a0a2a');
            grad.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // رسم الخطوط الواصلة بين النقاط (شبكة)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0,242,255,0.2)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = startX + j * spacing;
                    const y = startY + i * spacing;
                    
                    // خطوط أفقية
                    if (j < GRID_SIZE - 1) {
                        const x2 = startX + (j + 1) * spacing;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x2, y);
                        ctx.stroke();
                    }
                    
                    // خطوط عمودية
                    if (i < GRID_SIZE - 1) {
                        const y2 = startY + (i + 1) * spacing;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x, y2);
                        ctx.stroke();
                    }
                }
            }
            
            // رسم النقاط
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = startX + j * spacing;
                    const y = startY + i * spacing;
                    const isVisited = visited[j][i];
                    const isPlayer = (player.x === j && player.y === i);
                    
                    // ظل للنقطة
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = isPlayer ? '#00f2ff' : 'rgba(0,0,0,0.5)';
                    
                    // لون النقطة
                    if (isPlayer) {
                        ctx.fillStyle = '#00f2ff';
                        ctx.beginPath();
                        ctx.arc(x, y, POINT_RADIUS + 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(x, y, POINT_RADIUS, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#00f2ff';
                        ctx.font = `${POINT_RADIUS + 4}px "Segoe UI"`;
                        ctx.fillText("👤", x - 8, y + 6);
                    } else if (isVisited) {
                        ctx.fillStyle = '#4caf50';
                        ctx.beginPath();
                        ctx.arc(x, y, POINT_RADIUS, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `${POINT_RADIUS}px "Segoe UI"`;
                        ctx.fillText("✓", x - 6, y + 5);
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.beginPath();
                        ctx.arc(x, y, POINT_RADIUS, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.font = `${POINT_RADIUS}px "Segoe UI"`;
                        ctx.fillText("●", x - 4, y + 5);
                    }
                }
            }
            
            ctx.shadowBlur = 0;
            
            // رسم إطار حول اللاعب
            const px = startX + player.x * spacing;
            const py = startY + player.y * spacing;
            ctx.beginPath();
            ctx.arc(px, py, POINT_RADIUS + 8, 0, Math.PI * 2);
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        // ========== أزرار التحكم ==========
        document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.up = true; });
        document.getElementById('btnUp').addEventListener('touchend', () => moveState.up = false);
        document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.down = true; });
        document.getElementById('btnDown').addEventListener('touchend', () => moveState.down = false);
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.left = true; });
        document.getElementById('btnLeft').addEventListener('touchend', () => moveState.left = false);
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.right = true; });
        document.getElementById('btnRight').addEventListener('touchend', () => moveState.right = false);
        
        // التحكم بلوحة المفاتيح
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') moveState.up = true;
            if (e.key === 'ArrowDown') moveState.down = true;
            if (e.key === 'ArrowLeft') moveState.left = true;
            if (e.key === 'ArrowRight') moveState.right = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') moveState.up = false;
            if (e.key === 'ArrowDown') moveState.down = false;
            if (e.key === 'ArrowLeft') moveState.left = false;
            if (e.key === 'ArrowRight') moveState.right = false;
        });
        
        // تسجيل النقطة الحالية كمكتشفة
        visited[player.x][player.y] = true;
        visitedCount = 1;
        document.getElementById('visitedCount').innerHTML = visitedCount;
        document.getElementById('totalTiles').innerHTML = GRID_SIZE * GRID_SIZE;
        const startData = getPointData(player.x, player.y);
        document.getElementById('currentTile').innerHTML = startData.title.substring(0, 15);
        document.getElementById('playerPos').innerHTML = `(${player.x},${player.y})`;
        
        // عرض رسالة ترحيب
        setTimeout(() => {
            showToast(`🎮 مرحباً! استخدم الأسهم للتحرك بين النقاط`);
        }, 500);
        
        // حلقة اللعبة
        function gameLoop() {
            movePlayer();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        // تحديث حجم الشاشة
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // إغلاق الصورة بالضغط على ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePOV();
            }
        });
        
        console.log(`🎮 لعبة النقاط - ${GRID_SIZE}x${GRID_SIZE} = ${GRID_SIZE * GRID_SIZE} نقطة | كل نقطة لها صورة POV`);
    </script>
</body>
</html>
