<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBG Style | شخصية 3D + نقاط + صور POV</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #000;
        }
        
        /* حاوية Three.js */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* واجهة المستخدم */
        .ui {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 10px 15px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #ff5722;
            pointer-events: none;
        }
        
        .player-info {
            color: white;
            font-size: 12px;
        }
        
        .tile-counter {
            background: #ff5722;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 12px;
        }
        
        /* أزرار التحكم للهواتف */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 50;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 60px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 65px;
            height: 65px;
            background: rgba(255,87,34,0.3);
            border: 2px solid #ff5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:active {
            background: #ff5722;
            transform: scale(0.95);
        }
        
        /* نافذة الصورة POV */
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-image {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 20px;
            border: 3px solid #ff5722;
            box-shadow: 0 0 50px rgba(255,87,34,0.5);
        }
        
        .pov-info {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            margin: 0 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .pov-title {
            font-size: 24px;
            color: #ff5722;
        }
        
        .close-pov {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #ff5722;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #ff5722;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 150;
            border: 1px solid #ff5722;
        }
        
        @media (max-width: 600px) {
            .controls { gap: 12px; padding: 8px 18px; }
            .control-btn { width: 55px; height: 55px; font-size: 22px; }
            .pov-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="ui">
        <div class="player-info">
            🎮 <span id="playerPos">(0,0)</span>
        </div>
        <div class="tile-counter">
            🏆 <span id="visitedCount">0</span>/<span id="totalTiles">64</span>
        </div>
        <div class="player-info">
            📍 <span id="currentTile">البداية</span>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="btnUp">▲</div>
        <div class="control-btn" id="btnLeft">◀</div>
        <div class="control-btn" id="btnDown">▼</div>
        <div class="control-btn" id="btnRight">▶</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="pov-modal" id="povModal">
        <div class="close-pov" onclick="closePOV()">✖</div>
        <img class="pov-image" id="povImage">
        <div class="pov-info">
            <div class="pov-title" id="povTitle"></div>
            <div id="povDesc"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ========== تكامل تليجرام ==========
        const tg = window.Telegram.WebApp;
        
        // ========== إعدادات العالم ==========
        const GRID_SIZE = 8;
        const POINT_SPACING = 4.5;
        
        // مواقع النقاط في العالم 3D
        const points = [];
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 0;
        
        // موقع اللاعب
        let playerPos = { x: Math.floor(GRID_SIZE/2), y: Math.floor(GRID_SIZE/2) };
        let playerMesh;
        let scene, camera, renderer, controls;
        
        // ========== صور POV لكل نقطة ==========
        const pointsData = {};
        
        // إنشاء 64 صورة مختلفة
        const imagesList = [
            "https://picsum.photos/id/104/1200/800", "https://picsum.photos/id/15/1200/800",
            "https://picsum.photos/id/96/1200/800", "https://picsum.photos/id/29/1200/800",
            "https://picsum.photos/id/91/1200/800", "https://picsum.photos/id/43/1200/800",
            "https://picsum.photos/id/116/1200/800", "https://picsum.photos/id/112/1200/800",
            "https://picsum.photos/id/48/1200/800", "https://picsum.photos/id/126/1200/800",
            "https://picsum.photos/id/17/1200/800", "https://picsum.photos/id/13/1200/800",
            "https://picsum.photos/id/30/1200/800", "https://picsum.photos/id/59/1200/800",
            "https://picsum.photos/id/107/1200/800", "https://picsum.photos/id/118/1200/800",
            "https://picsum.photos/id/20/1200/800", "https://picsum.photos/id/23/1200/800",
            "https://picsum.photos/id/44/1200/800", "https://picsum.photos/id/76/1200/800",
            "https://picsum.photos/id/38/1200/800", "https://picsum.photos/id/67/1200/800",
            "https://picsum.photos/id/53/1200/800", "https://picsum.photos/id/93/1200/800",
            "https://picsum.photos/id/12/1200/800", "https://picsum.photos/id/22/1200/800",
            "https://picsum.photos/id/34/1200/800", "https://picsum.photos/id/42/1200/800",
            "https://picsum.photos/id/45/1200/800", "https://picsum.photos/id/55/1200/800",
            "https://picsum.photos/id/60/1200/800", "https://picsum.photos/id/68/1200/800",
            "https://picsum.photos/id/73/1200/800", "https://picsum.photos/id/77/1200/800",
            "https://picsum.photos/id/80/1200/800", "https://picsum.photos/id/85/1200/800",
            "https://picsum.photos/id/88/1200/800", "https://picsum.photos/id/92/1200/800",
            "https://picsum.photos/id/95/1200/800", "https://picsum.photos/id/98/1200/800",
            "https://picsum.photos/id/100/1200/800", "https://picsum.photos/id/103/1200/800",
            "https://picsum.photos/id/108/1200/800", "https://picsum.photos/id/110/1200/800",
            "https://picsum.photos/id/113/1200/800", "https://picsum.photos/id/115/1200/800",
            "https://picsum.photos/id/119/1200/800", "https://picsum.photos/id/120/1200/800",
            "https://picsum.photos/id/122/1200/800", "https://picsum.photos/id/124/1200/800",
            "https://picsum.photos/id/127/1200/800", "https://picsum.photos/id/129/1200/800",
            "https://picsum.photos/id/131/1200/800", "https://picsum.photos/id/133/1200/800",
            "https://picsum.photos/id/135/1200/800", "https://picsum.photos/id/137/1200/800",
            "https://picsum.photos/id/139/1200/800", "https://picsum.photos/id/141/1200/800",
            "https://picsum.photos/id/143/1200/800", "https://picsum.photos/id/145/1200/800",
            "https://picsum.photos/id/147/1200/800", "https://picsum.photos/id/149/1200/800",
            "https://picsum.photos/id/150/1200/800", "https://picsum.photos/id/151/1200/800"
        ];
        
        const titles = [
            "🏛️ الساحة المركزية", "🌲 غابة الصنوبر", "🏞️ وادي الجداول", "🏔️ قمة الجبل",
            "🏯 القلعة القديمة", "🌊 شلالات الجبل", "🏖️ شاطئ الجنة", "🌋 فوهة البركان",
            "🏝️ جزيرة النخيل", "🏜️ صحراء الذهب", "🏘️ القرية التراثية", "🌾 حقول القمح",
            "⛲ حدائق الزهور", "🎪 ساحة المهرجانات", "🏰 قصر الملوك", "🌌 سماء الليل",
            "🎋 غابة الخيزران", "❄️ الأنهار الجليدية", "🌈 وادي قوس قزح", "🌋 بحيرة البركان",
            "🏞️ مضيق الجبال", "🌠 زخة شهب", "🌸 بستان الكرز", "🏯 معبد السلام",
            "🎨 وادي الفنانين", "🦋 وادي الفراشات", "🍇 كروم العنب", "⛰️ قمة السحاب",
            "🏕️ مخيم النجوم", "🛶 بحيرة الهدوء", "🏰 قلعة الضباب", "🌿 غابة السرخس",
            "🌙 وادي القمر", "🎭 مسرح الطبيعة", "🔮 كهف البلور", "🌟 ميدان النجوم",
            "🏞️ بحيرة المرايا", "🌳 غابة العمالقة", "⛲ نافورة الأحلام", "🏔️ جبل الأمل",
            "🏜️ واحة النخيل", "🌋 سهل الحمم", "🏝️ شاطئ المرجان", "🌲 غابة الضباب",
            "🏯 معبد الشمس", "🌾 سهول القمح", "⛰️ وادي الصخور", "🌸 حدائق الساكورا",
            "🏔️ قمة الجليد", "🌿 مرج الزهور", "🏞️ شلالات القمر", "🏜️ كثبان الرمال",
            "🌲 غابة الأقزام", "🏰 حصن الحجر", "⛲ نافورة الشباب", "🌟 حقل النجوم",
            "🏔️ جبل النار", "🌊 خليج الدلافين", "🏞️ محمية الطيور", "🌾 مزرعة الخزامى",
            "🏯 قلعة الرمال", "🌲 غابة الأضواء", "⛰️ قمة الغروب", "🏆 ميدان البطولة"
        ];
        
        // تعبئة البيانات
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const idx = i * GRID_SIZE + j;
                pointsData[`${i},${j}`] = {
                    image: imagesList[idx % imagesList.length],
                    title: titles[idx % titles.length],
                    desc: "منظر طبيعي خلاب يستحق الاستكشاف"
                };
            }
        }
        
        function getPointData(x, y) {
            return pointsData[`${x},${y}`] || { image: imagesList[0], title: "🌍 منطقة جديدة", desc: "اكتشف هذا المكان" };
        }
        
        // ========== عرض POV ==========
        function showPOV(x, y) {
            const data = getPointData(x, y);
            document.getElementById('povImage').src = data.image;
            document.getElementById('povTitle').innerHTML = data.title;
            document.getElementById('povDesc').innerHTML = data.desc;
            document.getElementById('povModal').classList.add('active');
            
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        window.closePOV = () => {
            document.getElementById('povModal').classList.remove('active');
        };
        
        // ========== تحديث موقع اللاعب ==========
        function updatePlayerPosition(dx, dy) {
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;
            
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                playerPos.x = newX;
                playerPos.y = newY;
                
                // تحديث موقع الشخصية 3D
                const targetX = (playerPos.x - GRID_SIZE/2) * POINT_SPACING;
                const targetZ = (playerPos.y - GRID_SIZE/2) * POINT_SPACING;
                
                // حركة سلسة للشخصية
                if (playerMesh) {
                    playerMesh.position.lerp(new THREE.Vector3(targetX, 0.5, targetZ), 0.3);
                    // تدوير الكاميرا مع الشخصية
                    controls.target.lerp(new THREE.Vector3(targetX, 0.5, targetZ), 0.1);
                }
                
                // تحديث واجهة المستخدم
                document.getElementById('playerPos').innerHTML = `(${playerPos.x},${playerPos.y})`;
                const data = getPointData(playerPos.x, playerPos.y);
                document.getElementById('currentTile').innerHTML = data.title.substring(0, 12);
                
                // تسجيل الزيارة
                if (!visited[playerPos.x][playerPos.y]) {
                    visited[playerPos.x][playerPos.y] = true;
                    visitedCount++;
                    document.getElementById('visitedCount').innerHTML = visitedCount;
                    showPOV(playerPos.x, playerPos.y);
                    showToast(`✨ اكتشفت ${data.title}! ✨`);
                }
            }
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== إنشاء العالم 3D ==========
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1030);
            scene.fog = new THREE.FogExp2(0x0a1030, 0.008);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 8, 12);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // إضاءة
            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
            sunLight.position.set(10, 20, 5);
            sunLight.castShadow = true;
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0x404060, 0.6));
            
            // أرضية
            const groundGeo = new THREE.PlaneGeometry(45, 45);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a6b3a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // شبكة مساعدة
            const gridHelper = new THREE.GridHelper(44, 20, 0x88aa88, 0x446644);
            gridHelper.position.y = 0.05;
            scene.add(gridHelper);
            
            // إنشاء النقاط (أعمدة ضوئية)
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = (i - GRID_SIZE/2) * POINT_SPACING;
                    const z = (j - GRID_SIZE/2) * POINT_SPACING;
                    
                    // قاعدة النقطة
                    const baseMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200 });
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.2, 8), baseMat);
                    base.position.set(x, 0.1, z);
                    base.castShadow = true;
                    scene.add(base);
                    
                    // عمود ضوئي
                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224466 });
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.8, 6), pillarMat);
                    pillar.position.set(x, 0.5, z);
                    pillar.castShadow = true;
                    scene.add(pillar);
                    
                    // كرة ضوئية في الأعلى
                    const orbMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.5 });
                    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), orbMat);
                    orb.position.set(x, 0.95, z);
                    scene.add(orb);
                    
                    points.push({ x, z, visited: false });
                }
            }
            
            // إنشاء شخصية بوبجي (شخصية ثلاثية الأبعاد)
            const group = new THREE.Group();
            
            // الجسم
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a6ea5, roughness: 0.3 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.9, 8), bodyMat);
            body.castShadow = true;
            body.position.y = 0.45;
            group.add(body);
            
            // الرأس
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.2 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), headMat);
            head.castShadow = true;
            head.position.y = 0.95;
            group.add(head);
            
            // خوذة (لأسلوب بوبجي)
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, metalness: 0.7, roughness: 0.2 });
            const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.35, 8), helmetMat);
            helmet.position.y = 1.12;
            helmet.castShadow = true;
            group.add(helmet);
            
            // السلاح (بندقية)
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 0.12), gunMat);
            gunBody.position.set(0.45, 0.55, 0.2);
            gunBody.castShadow = true;
            group.add(gunBody);
            
            const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 6), gunMat);
            gunBarrel.rotation.z = Math.PI / 2;
            gunBarrel.position.set(0.75, 0.55, 0.2);
            gunBarrel.castShadow = true;
            group.add(gunBarrel);
            
            // حقيبة ظهر
            const bagMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a });
            const bag = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), bagMat);
            bag.position.set(-0.35, 0.5, -0.25);
            bag.castShadow = true;
            group.add(bag);
            
            group.position.set(0, 0, 0);
            group.castShadow = true;
            scene.add(group);
            playerMesh = group;
            
            // تحكم الكاميرا (تتبع الشخصية)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 1.0;
            controls.zoomSpeed = 1.0;
            controls.target.set(0, 0.8, 0);
            
            // تشغيل الحركة
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
        
        // ========== أزرار التحكم ==========
        let moveState = { up: false, down: false, left: false, right: false };
        
        function handleMovement() {
            let dx = 0, dy = 0;
            if (moveState.up) dy = -1;
            if (moveState.down) dy = 1;
            if (moveState.left) dx = -1;
            if (moveState.right) dx = 1;
            
            if (dx !== 0 || dy !== 0) {
                updatePlayerPosition(dx, dy);
            }
        }
        
        document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.up = true; });
        document.getElementById('btnUp').addEventListener('touchend', () => moveState.up = false);
        document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.down = true; });
        document.getElementById('btnDown').addEventListener('touchend', () => moveState.down = false);
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.left = true; });
        document.getElementById('btnLeft').addEventListener('touchend', () => moveState.left = false);
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.right = true; });
        document.getElementById('btnRight').addEventListener('touchend', () => moveState.right = false);
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') moveState.up = true;
            if (e.key === 'ArrowDown') moveState.down = true;
            if (e.key === 'ArrowLeft') moveState.left = true;
            if (e.key === 'ArrowRight') moveState.right = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') moveState.up = false;
            if (e.key === 'ArrowDown') moveState.down = false;
            if (e.key === 'ArrowLeft') moveState.left = false;
            if (e.key === 'ArrowRight') moveState.right = false;
        });
        
        // تسجيل النقطة الحالية
        visited[playerPos.x][playerPos.y] = true;
        visitedCount = 1;
        document.getElementById('visitedCount').innerHTML = visitedCount;
        document.getElementById('totalTiles').innerHTML = GRID_SIZE * GRID_SIZE;
        document.getElementById('playerPos').innerHTML = `(${playerPos.x},${playerPos.y})`;
        
        // بدء اللعبة
        init3D();
        
        // حلقة الحركة
        setInterval(handleMovement, 100);
        
        // تهيئة تليجرام
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        console.log('🎮 شخصية بوبجي 3D + 64 نقطة + صور POV - جاهزة!');
    </script>
</body>
</html>
