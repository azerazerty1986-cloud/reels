<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎮 البيئة الاحترافية | POV | لعبة المربعات</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --accent: #00f2ff;
            --accent-glow: 0 0 20px rgba(0,242,255,0.5);
            --gold: #ffd700;
            --gold-glow: 0 0 15px rgba(255,215,0,0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }
        
        /* حاوية Three.js للبيئة 3D */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* حاوية POV للفيديو */
        #pov-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: #000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        
        #pov-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .pov-active #pov-container {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-active #canvas-container {
            opacity: 0.3;
        }
        
        /* واجهة المستخدم */
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            pointer-events: none;
        }
        
        /* الهيدر */
        .header {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--accent);
            pointer-events: auto;
            z-index: 101;
        }
        
        .game-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
        }
        
        .game-title span {
            color: var(--gold);
        }
        
        .stats {
            display: flex;
            gap: 15px;
            font-size: 11px;
        }
        
        .stat {
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        /* أزرار التحكم */
        .controls-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 101;
            pointer-events: auto;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.05);
        }
        
        /* لوحة المربعات */
        .tiles-panel {
            position: absolute;
            bottom: 100px;
            right: 15px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid var(--accent);
            pointer-events: auto;
            z-index: 101;
            max-width: 280px;
            transition: all 0.3s;
        }
        
        .tiles-panel.minimized {
            max-width: 50px;
            padding: 10px;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .panel-title {
            font-size: 12px;
            color: var(--accent);
        }
        
        .minimize-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        
        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        
        .mini-tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
            border: 1px solid rgba(0,242,255,0.3);
        }
        
        .mini-tile:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }
        
        .mini-tile.visited {
            border-color: var(--gold);
            box-shadow: var(--gold-glow);
        }
        
        .mini-tile.active {
            background: var(--accent);
            color: #000;
        }
        
        /* معلومات الموقع */
        .location-info {
            position: fixed;
            bottom: 100px;
            left: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            border-radius: 20px;
            border-left: 3px solid var(--accent);
            pointer-events: none;
            z-index: 101;
            max-width: 250px;
        }
        
        .location-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
        }
        
        .location-desc {
            font-size: 10px;
            color: #ccc;
            margin-top: 4px;
        }
        
        /* نافذة POV الموسعة */
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-video-large {
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            border: 3px solid var(--accent);
            box-shadow: var(--accent-glow);
        }
        
        .pov-info {
            margin-top: 20px;
            text-align: center;
            color: white;
        }
        
        .close-pov {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--accent);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* شاشة البداية */
        .start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a2a, #000000);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }
        
        .start-btn {
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 40px;
            background: rgba(0,242,255,0.1);
            border-radius: 60px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            background: var(--accent);
            color: #000;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 300;
            border: 1px solid var(--accent);
            white-space: nowrap;
        }
        
        @media (max-width: 600px) {
            .header { padding: 8px 12px; }
            .game-title { font-size: 10px; }
            .stats { gap: 8px; font-size: 9px; }
            .control-btn { padding: 8px 15px; font-size: 11px; }
            .tiles-panel { max-width: 200px; }
            .mini-tile { font-size: 10px; }
            .location-info { max-width: 180px; padding: 8px 12px; }
            .location-title { font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="start-screen" id="startScreen">
        <div class="game-title" style="font-size: 28px;">🎮 <span>عالم المربعات</span> 🎮</div>
        <div style="text-align: center; color: #aaa; max-width: 300px;">
            🏔️ بيئة 3D احترافية<br>
            📹 36 مربع - كل مربع له فيديو POV خاص<br>
            🎬 جولة في العالم من منظور الشخص الأول
        </div>
        <button class="start-btn" onclick="startGame()">🚀 ابدأ الرحلة</button>
    </div>

    <!-- حاوية البيئة 3D -->
    <div id="canvas-container"></div>
    
    <!-- حاوية POV -->
    <div id="pov-container">
        <video id="pov-video" loop muted playsinline autoplay></video>
    </div>
    
    <!-- واجهة المستخدم -->
    <div class="game-ui" id="gameUI" style="display: none;">
        <div class="header">
            <div class="game-title">🎮 <span>عالم المربعات</span> | POV Mode</div>
            <div class="stats">
                <div class="stat">📹 <span id="visitedCount">0</span>/36</div>
                <div class="stat">🏔️ <span id="terrainInfo">256x256</span></div>
            </div>
        </div>
        
        <div class="location-info" id="locationInfo">
            <div class="location-title" id="locTitle">📍 استكشف العالم</div>
            <div class="location-desc" id="locDesc">اضغط على أي مربع لرؤية المنظر</div>
        </div>
        
        <div class="tiles-panel" id="tilesPanel">
            <div class="panel-header" onclick="togglePanel()">
                <span class="panel-title">🗺️ المربعات (6x6)</span>
                <button class="minimize-btn" id="minimizeBtn">−</button>
            </div>
            <div class="grid-tiles" id="gridTiles"></div>
        </div>
        
        <div class="controls-bar">
            <button class="control-btn" onclick="togglePOVMode()">
                🎬 وضع POV
            </button>
            <button class="control-btn" onclick="resetCamera()">
                🎥 إعادة الكاميرا
            </button>
        </div>
    </div>
    
    <!-- نافذة POV الموسعة -->
    <div class="pov-modal" id="povModal">
        <div class="close-pov" onclick="closePOVModal()">✖</div>
        <video class="pov-video-large" id="povModalVideo" controls autoplay></video>
        <div class="pov-info" id="povModalInfo"></div>
    </div>

        }
    </script>

        function getTileData(row, col) {
            const key = `${row},${col}`;
            if (tilesData[key]) return tilesData[key];
            return { video: "https://cdn.pixabay.com/video/2023/01/17/145678-792345678_large.mp4", title: "🌍 منطقة جديدة", desc: "منطقة تنتظر اكتشافك", icon: "🌍" };

        // ========== متغيرات اللعبة ==========
        const GRID_SIZE = 6;
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 0;
        let currentTile = null;
        let povModeActive = false;
        let scene, camera, renderer, controls, terrain;
        
        // ========== بناء شبكة المربعات ==========
        function buildTilesGrid() {
            const grid = document.getElementById('gridTiles');
            grid.innerHTML = '';
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const data = getTileData(row, col);
                    const tile = document.createElement('div');
                    tile.className = 'mini-tile';
                    if (visited[row][col]) tile.classList.add('visited');
                    tile.innerHTML = data.icon;
                    tile.onclick = () => openTile(row, col);
                    grid.appendChild(tile);
                }
            }
        }
        
        // ========== فتح المربع وعرض POV ==========
        function openTile(row, col) {
            const data = getTileData(row, col);
            currentTile = { row, col, data };
            
            // تحديث معلومات الموقع
            document.getElementById('locTitle').innerHTML = `📍 ${data.title}`;
            document.getElementById('locDesc').innerHTML = data.desc;
            
            // عرض فيديو POV
            showPOV(data.video, data.title, data.desc);
            
            // تسجيل الزيارة
            if (!visited[row][col]) {
                visited[row][col] = true;
                visitedCount++;
                document.getElementById('visitedCount').innerHTML = visitedCount;
                buildTilesGrid();
                showToast(`✨ اكتشفت ${data.title}! ✨`);
                sendToTelegram(`🎮 اكتشاف جديد: ${data.title}`);
            }
        }
        
        // ========== عرض POV ==========
        let currentVideo = null;
        
        function showPOV(videoUrl, title, desc) {
            const povVideo = document.getElementById('pov-video');
            const povModal = document.getElementById('povModal');
            const povModalVideo = document.getElementById('povModalVideo');
            const povModalInfo = document.getElementById('povModalInfo');
            
            povVideo.src = videoUrl;
            povVideo.load();
            povVideo.play().catch(e => console.log('Auto-play'));
            
            povModalInfo.innerHTML = `<div style="font-size: 20px; color: var(--accent);">${title}</div><div style="font-size: 14px;">${desc}</div>`;
            povModalVideo.src = videoUrl;
            povModalVideo.load();
            
            povModal.classList.add('active');
            
            // تأثير اهتزاز
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        function closePOVModal() {
            const povModal = document.getElementById('povModal');
            const povModalVideo = document.getElementById('povModalVideo');
            povModalVideo.pause();
            povModal.classList.remove('active');
        }
        
        // ========== تبديل وضع POV ==========
        function togglePOVMode() {
            povModeActive = !povModeActive;
            if (povModeActive) {
                document.body.classList.add('pov-active');
                showToast('🎬 وضع POV نشط - استمتع بالمنظور الشخصي');
            } else {
                document.body.classList.remove('pov-active');
                showToast('🎮 العودة إلى البيئة 3D');
            }
        }
        
        // ========== إعادة الكاميرا ==========
        function resetCamera() {
            if (controls) {
                camera.position.set(25, 18, 35);
                controls.target.set(0, 5, 0);
                controls.update();
                showToast('🎥 تم إعادة ضبط الكاميرا');
            }
        }
        
        // ========== تبديل اللوحة ==========
        let panelMinimized = false;
        function togglePanel() {
            const panel = document.getElementById('tilesPanel');
            const minimizeBtn = document.getElementById('minimizeBtn');
            panelMinimized = !panelMinimized;
            if (panelMinimized) {
                panel.classList.add('minimized');
                minimizeBtn.innerHTML = '+';
                document.querySelector('.grid-tiles').style.display = 'none';
            } else {
                panel.classList.remove('minimized');
                minimizeBtn.innerHTML = '−';
                document.querySelector('.grid-tiles').style.display = 'grid';
            }
        }
        
        // ========== إرسال إلى تليجرام ==========
        const BOT_CONFIG = {
            botToken: '8576673096:AAEFKd-YSJcW_0d_wAHZBt-5nPg_VOjDX_0',
            channelId: '-1003822964890'
        };
        
        async function sendToTelegram(message) {
            if (!userData) return;
            try {
                const userName = userData.first_name || userData.username || 'مستخدم';
                const fullMessage = `👤 ${userName}\n${message}\n📊 التقدم: ${visitedCount}/36`;
                const url = `https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_CONFIG.channelId,
                        text: fullMessage,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }
        
        // ========== عرض رسالة ==========
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== إنشاء البيئة 3D الاحترافية ==========
        async function init3DEnvironment() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1030);
            scene.fog = new THREE.FogExp2(0x0a1030, 0.003);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // الإضاءة
            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.4);
            sunLight.position.set(35, 45, 25);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0x404060, 0.55);
            scene.add(ambientLight);
            
            // التضاريس
            const terrainSize = 180;
            const segments = 128;
            const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
            geometry.rotateX(-Math.PI / 2);
            
            const positions = geometry.attributes.position.array;
            for (let i = 0; i <= segments; i++) {
                for (let j = 0; j <= segments; j++) {
                    const x = (j / segments - 0.5) * terrainSize;
                    const z = (i / segments - 0.5) * terrainSize;
                    const nx = x / terrainSize;
                    const nz = z / terrainSize;
                    let y = Math.sin(nx * Math.PI * 2.2) * Math.cos(nz * Math.PI * 2.0) * 1.6;
                    y += Math.sin(nx * Math.PI * 5.5) * Math.cos(nz * Math.PI * 5.0) * 0.9;
                    y += Math.sin(nx * Math.PI * 14) * 0.35;
                    const idx = (i * (segments + 1) + j) * 3;
                    positions[idx + 1] = Math.max(-1, Math.min(3.5, y));
                }
            }
            geometry.computeVertexNormals();
            
            const terrainMat = new THREE.MeshStandardMaterial({ color: 0x5a8e5a, roughness: 0.7, metalness: 0.1 });
            terrain = new THREE.Mesh(geometry, terrainMat);
            terrain.receiveShadow = true;
            terrain.castShadow = true;
            scene.add(terrain);
            
            // أشجار
            function createTree(x, z) {
                const y = positions[Math.floor(Math.random() * positions.length)] || 0;
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1, 6), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                trunk.castShadow = true;
                trunk.position.y = 0.5;
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.2, 6), new THREE.MeshStandardMaterial({ color: 0x4cae4c }));
                leaves.castShadow = true;
                leaves.position.y = 1.1;
                group.add(trunk, leaves);
                group.position.set(x, 0, z);
                scene.add(group);
            }
            
            for (let i = 0; i < 200; i++) {
                const x = (Math.random() - 0.5) * 160;
                const z = (Math.random() - 0.5) * 160;
                if (Math.abs(x) < 85 && Math.abs(z) < 85) createTree(x, z);
            }
            
            // تحكم الكاميرا
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.target.set(0, 5, 0);
            camera.position.set(25, 18, 35);
            controls.update();
            
            // حلقة التحريك
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            document.getElementById('terrainInfo').innerHTML = `${segments}x${segments}`;
        }
        
        // ========== بدء اللعبة ==========
        async function startGame() {
            const startScreen = document.getElementById('startScreen');
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.remove(), 500);
            
            document.getElementById('gameUI').style.display = 'block';
            
            // تهيئة تليجرام
            try {
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userData = tg.initDataUnsafe.user;
                } else {
                    userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                }
            } catch(e) {
                userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
            }
            
            await init3DEnvironment();
            buildTilesGrid();
            
            showToast('🎮 مرحباً بك! اضغط على أي مربع لاستكشاف العالم عبر POV');
            
            sendToTelegram('🚀 بدأ رحلة الاستكشاف في عالم المربعات!');
        }
        
        // ========== تكيف مع حجم الشاشة ==========
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        window.startGame = startGame;
        window.togglePOVMode = togglePOVMode;
        window.resetCamera = resetCamera;
        window.togglePanel = togglePanel;
        window.closePOVModal = closePOVModal;
        
        console.log('🎮 البيئة الاحترافية + POV + لعبة المربعات - جاهزة!');
        console.log('📹 36 مربع - كل مربع له فيديو POV خاص');
    </script>
</body>
