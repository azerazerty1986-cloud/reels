<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>POV Mode | عالم المربعات - تجربة واقعية</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --accent: #00f2ff;
            --accent-glow: 0 0 20px rgba(0,242,255,0.5);
            --gold: #ffd700;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #000;
        }
        
        /* حاوية البيئة 3D */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* حاوية POV للفيديو */
        .pov-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .pov-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-video-container {
            width: 95%;
            max-width: 900px;
            border-radius: 25px;
            overflow: hidden;
            border: 3px solid var(--accent);
            box-shadow: var(--accent-glow);
            background: #000;
        }
        
        .pov-video {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
        }
        
        .pov-info {
            margin-top: 20px;
            text-align: center;
            color: white;
        }
        
        .pov-title {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 8px;
        }
        
        .pov-desc {
            font-size: 14px;
            color: #ccc;
            max-width: 500px;
        }
        
        .close-pov {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--accent);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 201;
        }
        
        .close-pov:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.1);
        }
        
        /* واجهة المستخدم */
        .header {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--accent);
            z-index: 100;
        }
        
        .game-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
        }
        
        .game-title span {
            color: var(--gold);
        }
        
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
        }
        
        .stat {
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        /* لوحة المربعات */
        .tiles-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid var(--accent);
            z-index: 100;
            max-width: 300px;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }
        
        .panel-title {
            font-size: 12px;
            color: var(--accent);
        }
        
        .minimize-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }
        
        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        
        .mini-tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            border: 1px solid rgba(0,242,255,0.3);
        }
        
        .mini-tile:hover {
            transform: scale(1.1);
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }
        
        .mini-tile.visited {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        /* معلومات الموقع */
        .location-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            border-radius: 20px;
            border-right: 3px solid var(--accent);
            z-index: 100;
            max-width: 280px;
        }
        
        .location-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
        }
        
        .location-desc {
            font-size: 11px;
            color: #ccc;
            margin-top: 5px;
        }
        
        /* أزرار التحكم */
        .controls-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: var(--accent);
            color: #000;
        }
        
        /* شاشة البداية */
        .start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a2a, #000000);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        
        .start-btn {
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 40px;
            background: rgba(0,242,255,0.1);
            border-radius: 60px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            background: var(--accent);
            color: #000;
        }
        
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 300;
            border: 1px solid var(--accent);
        }
        
        @media (max-width: 600px) {
            .header { padding: 8px 12px; }
            .game-title { font-size: 11px; }
            .stats { font-size: 9px; gap: 8px; }
            .tiles-panel { max-width: 220px; padding: 8px; }
            .mini-tile { font-size: 12px; }
            .location-info { max-width: 200px; padding: 8px 12px; }
            .location-title { font-size: 11px; }
            .control-btn { padding: 6px 12px; font-size: 10px; }
            .pov-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="start-screen" id="startScreen">
        <div class="game-title" style="font-size: 28px;">🎬 <span>POV Mode</span> 🎬</div>
        <div style="text-align: center; color: #aaa; max-width: 280px;">
            🎥 عالم المربعات<br>
            📍 36 موقع - كل موقع بمنظور شخصي<br>
            🌍 جولة واقعية حول العالم
        </div>
        <button class="start-btn" onclick="startGame()">🚀 ابدأ الرحلة</button>
    </div>

    <!-- حاوية البيئة 3D -->
    <div id="canvas-container"></div>
    
    <!-- نافذة POV -->
    <div class="pov-overlay" id="povOverlay">
        <div class="close-pov" onclick="closePOV()">✖</div>
        <div class="pov-video-container">
            <video class="pov-video" id="povVideo" controls autoplay></video>
        </div>
        <div class="pov-info">
            <div class="pov-title" id="povTitle"></div>
            <div class="pov-desc" id="povDesc"></div>
        </div>
    </div>
    
    <!-- واجهة المستخدم -->
    <div class="header" id="header" style="display: none;">
        <div class="game-title">🎬 <span>POV Mode</span> | عالم المربعات</div>
        <div class="stats">
            <div class="stat">📹 <span id="visitedCount">0</span>/36</div>
            <div class="stat">🌍 <span id="worldStatus">مستكشف</span></div>
        </div>
    </div>
    
    <div class="location-info" id="locationInfo" style="display: none;">
        <div class="location-title" id="locTitle">📍 استكشف العالم</div>
        <div class="location-desc" id="locDesc">اضغط على أي مربع لرؤية المنظر</div>
    </div>
    
    <div class="tiles-panel" id="tilesPanel" style="display: none;">
        <div class="panel-header" onclick="togglePanel()">
            <span class="panel-title">🗺️ المربعات (6x6)</span>
            <button class="minimize-btn" id="minimizeBtn">−</button>
        </div>
        <div class="grid-tiles" id="gridTiles"></div>
    </div>
    
    <div class="controls-bar" id="controlsBar" style="display: none;">
        <button class="control-btn" onclick="resetCamera()">🎥 إعادة الكاميرا</button>
        <button class="control-btn" onclick="showRandomTile()">🎲 مربع عشوائي</button>
    </div>

            }
        }
    </script>

        // ========== متغيرات اللعبة ==========
        const GRID_SIZE = 6;
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 0;
        let scene, camera, renderer, controls;
        let panelMinimized = false;
        
        // ========== بناء شبكة المربعات ==========
        function buildTilesGrid() {
            const grid = document.getElementById('gridTiles');
            grid.innerHTML = '';
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const data = getTileData(row, col);
                    const tile = document.createElement('div');
                    tile.className = 'mini-tile';
                    if (visited[row][col]) tile.classList.add('visited');
                    tile.innerHTML = data.icon;
                    tile.onclick = () => openTile(row, col);
                    grid.appendChild(tile);
                }
            }
        }
        
        // ========== فتح المربع وعرض POV ==========
        function openTile(row, col) {
            const data = getTileData(row, col);
            
            // تحديث معلومات الموقع في الواجهة
            document.getElementById('locTitle').innerHTML = `📍 ${data.title}`;
            document.getElementById('locDesc').innerHTML = data.desc;
            
            // عرض الفيديو في نافذة POV
            const povOverlay = document.getElementById('povOverlay');
            const povVideo = document.getElementById('povVideo');
            const povTitle = document.getElementById('povTitle');
            const povDesc = document.getElementById('povDesc');
            
            povTitle.innerHTML = `${data.icon} ${data.title}`;
            povDesc.innerHTML = data.desc;
            povVideo.src = data.video;
            povVideo.load();
            povVideo.play().catch(e => console.log('Auto-play prevented'));
            
            povOverlay.classList.add('active');
            
            // تسجيل الزيارة
            if (!visited[row][col]) {
                visited[row][col] = true;
                visitedCount++;
                document.getElementById('visitedCount').innerHTML = visitedCount;
                buildTilesGrid();
                showToast(`✨ اكتشفت ${data.title}! ✨ (${visitedCount}/36)`);
                sendToTelegram(`🎬 اكتشاف جديد: ${data.title}`);
            }
            
            // تأثير اهتزاز
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        function closePOV() {
            const povOverlay = document.getElementById('povOverlay');
            const povVideo = document.getElementById('povVideo');
            povVideo.pause();
            povOverlay.classList.remove('active');
        }
        
        // ========== مربع عشوائي ==========
        function showRandomTile() {
            const unvisited = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (!visited[i][j]) unvisited.push([i, j]);
                }
            }
            if (unvisited.length > 0) {
                const random = unvisited[Math.floor(Math.random() * unvisited.length)];
                openTile(random[0], random[1]);
            } else {
                showToast('🎉 مبروك! لقد اكتشفت كل المربعات الـ36!');
            }
        }
        
        // ========== إعادة الكاميرا ==========
        function resetCamera() {
            if (controls) {
                camera.position.set(25, 18, 35);
                controls.target.set(0, 5, 0);
                controls.update();
                showToast('🎥 تم إعادة ضبط الكاميرا');
            }
        }
        
        // ========== تبديل اللوحة ==========
        function togglePanel() {
            const panel = document.getElementById('tilesPanel');
            const minimizeBtn = document.getElementById('minimizeBtn');
            const grid = document.querySelector('.grid-tiles');
            panelMinimized = !panelMinimized;
            if (panelMinimized) {
                grid.style.display = 'none';
                minimizeBtn.innerHTML = '+';
            } else {
                grid.style.display = 'grid';
                minimizeBtn.innerHTML = '−';
            }
        }
        
        // ========== إرسال إلى تليجرام ==========
        const BOT_CONFIG = {
            botToken: '8576673096:AAEFKd-YSJcW_0d_wAHZBt-5nPg_VOjDX_0',
            channelId: '-1003822964890'
        };
        
        async function sendToTelegram(message) {
            if (!userData) return;
            try {
                const userName = userData.first_name || userData.username || 'مستخدم';
                const fullMessage = `👤 ${userName}\n${message}\n📊 التقدم: ${visitedCount}/36`;
                const url = `https://api.telegram.org/bot${BOT_CONFIG.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_CONFIG.channelId,
                        text: fullMessage,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }
        
        // ========== عرض رسالة ==========
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        
        // ========== إنشاء البيئة 3D ==========
        async function init3DEnvironment() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1030);
            scene.fog = new THREE.FogExp2(0x0a1030, 0.003);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // إضاءة
            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
            sunLight.position.set(30, 40, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);
            
            // أرضية
            const groundGeo = new THREE.PlaneGeometry(150, 150);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a784a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // شبكة مساعدة
            const gridHelper = new THREE.GridHelper(140, 20, 0x88aa88, 0x446644);
            gridHelper.position.y = 0.05;
            scene.add(gridHelper);
            
            // أشجار بسيطة
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x4cae4c });
            
            for (let i = 0; i < 180; i++) {
                const x = (Math.random() - 0.5) * 130;
                const z = (Math.random() - 0.5) * 130;
                if (Math.abs(x) < 65 && Math.abs(z) < 65) {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1), trunkMat);
                    trunk.castShadow = true;
                    trunk.position.y = 0.5;
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.2, 6), leavesMat);
                    leaves.castShadow = true;
                    leaves.position.y = 1.1;
                    tree.add(trunk, leaves);
                    tree.position.set(x, 0, z);
                    scene.add(tree);
                }
            }
            
            // تحكم
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.2;
            controls.target.set(0, 3, 0);
            camera.position.set(25, 18, 35);
            controls.update();
            
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
        
        // ========== بدء اللعبة ==========
        async function startGame() {
            const startScreen = document.getElementById('startScreen');
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.remove(), 500);
            
            document.getElementById('header').style.display = 'flex';
            document.getElementById('locationInfo').style.display = 'block';
            document.getElementById('tilesPanel').style.display = 'block';
            document.getElementById('controlsBar').style.display = 'flex';
            
            // تهيئة تليجرام
            try {
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userData = tg.initDataUnsafe.user;
                } else {
                    userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
                }
            } catch(e) {
                userData = { id: Math.floor(Math.random() * 10000), first_name: 'زائر' };
            }
            
            await init3DEnvironment();
            buildTilesGrid();
            
            showToast('🎬 مرحباً بك! اضغط على أي مربع لرؤية المناظر الواقعية');
            sendToTelegram('🚀 بدأ رحلة استكشاف عالم المربعات!');
        }
        
        // ========== تكيف مع حجم الشاشة ==========
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        window.startGame = startGame;
        window.resetCamera = resetCamera;
        window.togglePanel = togglePanel;
        window.closePOV = closePOV;
        window.showRandomTile = showRandomTile;
        
        console.log('🎬 POV Mode | عالم المربعات - 36 فيديو واقعي جاهز!');
        console.log('📹 كل مربع له فيديو منظور شخصي فريد');
    </script>
</body>
</html>
