<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBG Mobile | أرضية 3D + شخصية + نقاط + صور POV</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #000;
            touch-action: none;
        }
        
        /* حاوية Three.js */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* واجهة المستخدم */
        .ui {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 8px 12px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            border: 1px solid #ff5722;
            pointer-events: none;
        }
        
        .player-info {
            color: white;
            font-size: 10px;
        }
        
        .tile-counter {
            background: #ff5722;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 11px;
        }
        
        /* أزرار التحكم للهواتف */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 50;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 60px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 55px;
            height: 55px;
            background: rgba(255,87,34,0.4);
            border: 2px solid #ff5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: #ff5722;
            transform: scale(0.92);
        }
        
        /* نافذة الصورة POV */
        .pov-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .pov-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .pov-image {
            max-width: 95%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 15px;
            border: 3px solid #ff5722;
            box-shadow: 0 0 40px rgba(255,87,34,0.5);
        }
        
        .pov-info {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 12px;
            margin: 0 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .pov-title {
            font-size: 18px;
            color: #ff5722;
            font-weight: bold;
        }
        
        .pov-desc {
            font-size: 11px;
            color: #ccc;
            margin-top: 5px;
        }
        
        .close-pov {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #ff5722;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 201;
        }
        
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #ff5722;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            z-index: 150;
            border: 1px solid #ff5722;
            white-space: nowrap;
        }
        
        @media (max-width: 600px) {
            .control-btn { width: 50px; height: 50px; font-size: 20px; }
            .ui { padding: 6px 10px; }
            .player-info { font-size: 9px; }
        }
    </style>
</head>
<body>

    <div class="ui">
        <div class="player-info">
            🎮 <span id="playerPos">(4,4)</span>
        </div>
        <div class="tile-counter">
            🏆 <span id="visitedCount">1</span>/<span id="totalTiles">64</span>
        </div>
        <div class="player-info">
            📍 <span id="currentTile">البداية</span>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="btnUp">▲</div>
        <div class="control-btn" id="btnLeft">◀</div>
        <div class="control-btn" id="btnDown">▼</div>
        <div class="control-btn" id="btnRight">▶</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="pov-modal" id="povModal">
        <div class="close-pov" onclick="closePOV()">✖</div>
        <img class="pov-image" id="povImage">
        <div class="pov-info">
            <div class="pov-title" id="povTitle"></div>
            <div class="pov-desc" id="povDesc"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ========== تكامل تليجرام ==========
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        // ========== إعدادات العالم ==========
        const GRID_SIZE = 8;  // 8x8 = 64 نقطة
        const SPACING = 3.5;   // المسافة بين النقاط
        
        // موقع اللاعب
        let playerGridX = Math.floor(GRID_SIZE / 2);
        let playerGridY = Math.floor(GRID_SIZE / 2);
        
        // النقاط التي تمت زيارتها
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let visitedCount = 1;
        
        // عناصر Three.js
        let scene, camera, renderer, controls;
        let playerMesh;
        let pointsMeshes = [];
        
        // ========== صور POV لكل نقطة (64 صورة مختلفة) ==========
        const imageUrls = [
            "https://picsum.photos/id/104/1000/700", "https://picsum.photos/id/15/1000/700",
            "https://picsum.photos/id/96/1000/700", "https://picsum.photos/id/29/1000/700",
            "https://picsum.photos/id/91/1000/700", "https://picsum.photos/id/43/1000/700",
            "https://picsum.photos/id/116/1000/700", "https://picsum.photos/id/112/1000/700",
            "https://picsum.photos/id/48/1000/700", "https://picsum.photos/id/126/1000/700",
            "https://picsum.photos/id/17/1000/700", "https://picsum.photos/id/13/1000/700",
            "https://picsum.photos/id/30/1000/700", "https://picsum.photos/id/59/1000/700",
            "https://picsum.photos/id/107/1000/700", "https://picsum.photos/id/118/1000/700",
            "https://picsum.photos/id/20/1000/700", "https://picsum.photos/id/23/1000/700",
            "https://picsum.photos/id/44/1000/700", "https://picsum.photos/id/76/1000/700",
            "https://picsum.photos/id/38/1000/700", "https://picsum.photos/id/67/1000/700",
            "https://picsum.photos/id/53/1000/700", "https://picsum.photos/id/93/1000/700",
            "https://picsum.photos/id/12/1000/700", "https://picsum.photos/id/22/1000/700",
            "https://picsum.photos/id/34/1000/700", "https://picsum.photos/id/42/1000/700",
            "https://picsum.photos/id/45/1000/700", "https://picsum.photos/id/55/1000/700",
            "https://picsum.photos/id/60/1000/700", "https://picsum.photos/id/68/1000/700",
            "https://picsum.photos/id/73/1000/700", "https://picsum.photos/id/77/1000/700",
            "https://picsum.photos/id/80/1000/700", "https://picsum.photos/id/85/1000/700",
            "https://picsum.photos/id/88/1000/700", "https://picsum.photos/id/92/1000/700",
            "https://picsum.photos/id/95/1000/700", "https://picsum.photos/id/98/1000/700",
            "https://picsum.photos/id/100/1000/700", "https://picsum.photos/id/103/1000/700",
            "https://picsum.photos/id/108/1000/700", "https://picsum.photos/id/110/1000/700",
            "https://picsum.photos/id/113/1000/700", "https://picsum.photos/id/115/1000/700",
            "https://picsum.photos/id/119/1000/700", "https://picsum.photos/id/120/1000/700",
            "https://picsum.photos/id/122/1000/700", "https://picsum.photos/id/124/1000/700",
            "https://picsum.photos/id/127/1000/700", "https://picsum.photos/id/129/1000/700",
            "https://picsum.photos/id/131/1000/700", "https://picsum.photos/id/133/1000/700",
            "https://picsum.photos/id/135/1000/700", "https://picsum.photos/id/137/1000/700",
            "https://picsum.photos/id/139/1000/700", "https://picsum.photos/id/141/1000/700",
            "https://picsum.photos/id/143/1000/700", "https://picsum.photos/id/145/1000/700",
            "https://picsum.photos/id/147/1000/700", "https://picsum.photos/id/149/1000/700",
            "https://picsum.photos/id/150/1000/700", "https://picsum.photos/id/151/1000/700"
        ];
        
        const titles = [
            "🏛️ الساحة المركزية", "🌲 غابة الصنوبر", "🏞️ وادي الجداول", "🏔️ قمة الجبل",
            "🏯 القلعة القديمة", "🌊 شلالات الجبل", "🏖️ شاطئ الجنة", "🌋 فوهة البركان",
            "🏝️ جزيرة النخيل", "🏜️ صحراء الذهب", "🏘️ القرية التراثية", "🌾 حقول القمح",
            "⛲ حدائق الزهور", "🎪 ساحة المهرجانات", "🏰 قصر الملوك", "🌌 سماء الليل",
            "🎋 غابة الخيزران", "❄️ الأنهار الجليدية", "🌈 وادي قوس قزح", "🌋 بحيرة البركان",
            "🏞️ مضيق الجبال", "🌠 زخة شهب", "🌸 بستان الكرز", "🏯 معبد السلام",
            "🎨 وادي الفنانين", "🦋 وادي الفراشات", "🍇 كروم العنب", "⛰️ قمة السحاب",
            "🏕️ مخيم النجوم", "🛶 بحيرة الهدوء", "🏰 قلعة الضباب", "🌿 غابة السرخس",
            "🌙 وادي القمر", "🎭 مسرح الطبيعة", "🔮 كهف البلور", "🌟 ميدان النجوم",
            "🏞️ بحيرة المرايا", "🌳 غابة العمالقة", "⛲ نافورة الأحلام", "🏔️ جبل الأمل",
            "🏜️ واحة النخيل", "🌋 سهل الحمم", "🏝️ شاطئ المرجان", "🌲 غابة الضباب",
            "🏯 معبد الشمس", "🌾 سهول القمح", "⛰️ وادي الصخور", "🌸 حدائق الساكورا",
            "🏔️ قمة الجليد", "🌿 مرج الزهور", "🏞️ شلالات القمر", "🏜️ كثبان الرمال",
            "🌲 غابة الأقزام", "🏰 حصن الحجر", "⛲ نافورة الشباب", "🌟 حقل النجوم",
            "🏔️ جبل النار", "🌊 خليج الدلافين", "🏞️ محمية الطيور", "🌾 مزرعة الخزامى",
            "🏯 قلعة الرمال", "🌲 غابة الأضواء", "⛰️ قمة الغروب", "🏆 ميدان البطولة"
        ];
        
        function getPointData(x, y) {
            const idx = (x * GRID_SIZE + y) % imageUrls.length;
            return {
                image: imageUrls[idx],
                title: titles[idx],
                desc: "منظر طبيعي خلاب يستحق الاستكشاف"
            };
        }
        
        // ========== عرض صورة POV ==========
        function showPOV(x, y) {
            const data = getPointData(x, y);
            document.getElementById('povImage').src = data.image;
            document.getElementById('povTitle').innerHTML = data.title;
            document.getElementById('povDesc').innerHTML = data.desc;
            document.getElementById('povModal').classList.add('active');
            
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        window.closePOV = () => {
            document.getElementById('povModal').classList.remove('active');
        };
        
        // ========== تحديث موقع اللاعب ==========
        function movePlayer(dx, dy) {
            const newX = playerGridX + dx;
            const newY = playerGridY + dy;
            
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                playerGridX = newX;
                playerGridY = newY;
                
                // تحديث موقع الشخصية 3D
                const targetX = (playerGridX - GRID_SIZE/2) * SPACING;
                const targetZ = (playerGridY - GRID_SIZE/2) * SPACING;
                
                if (playerMesh) {
                    playerMesh.position.lerp(new THREE.Vector3(targetX, 0.4, targetZ), 0.3);
                    controls.target.lerp(new THREE.Vector3(targetX, 0.5, targetZ), 0.2);
                }
                
                // تحديث واجهة المستخدم
                document.getElementById('playerPos').innerHTML = `(${playerGridX},${playerGridY})`;
                const data = getPointData(playerGridX, playerGridY);
                document.getElementById('currentTile').innerHTML = data.title.substring(0, 12);
                
                // تسجيل الزيارة
                if (!visited[playerGridX][playerGridY]) {
                    visited[playerGridX][playerGridY] = true;
                    visitedCount++;
                    document.getElementById('visitedCount').innerHTML = visitedCount;
                    showPOV(playerGridX, playerGridY);
                    
                    // تأثير على النقطة
                    const idx = playerGridX * GRID_SIZE + playerGridY;
                    if (pointsMeshes[idx]) {
                        pointsMeshes[idx].material.color.setHex(0x4caf50);
                        pointsMeshes[idx].material.emissiveIntensity = 0.3;
                    }
                    
                    showToast(`✨ اكتشفت ${data.title}! ✨`);
                }
            }
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== إنشاء العالم 3D ==========
        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1030);
            scene.fog = new THREE.FogExp2(0x0a1030, 0.01);
            
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 8, 12);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // الإضاءة
            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
            sunLight.position.set(10, 20, 5);
            sunLight.castShadow = true;
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);
            
            const fillLight = new THREE.PointLight(0x6688aa, 0.3);
            fillLight.position.set(-5, 8, -5);
            scene.add(fillLight);
            
            // الأرضية
            const groundGeo = new THREE.PlaneGeometry(32, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a6b3a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // شبكة مساعدة
            const gridHelper = new THREE.GridHelper(30, 20, 0x88aa88, 0x446644);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
            
            // إنشاء النقاط (أعمدة ضوئية)
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = (i - GRID_SIZE/2) * SPACING;
                    const z = (j - GRID_SIZE/2) * SPACING;
                    
                    // قاعدة
                    const baseMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, roughness: 0.5 });
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.2, 8), baseMat);
                    base.position.set(x, 0.05, z);
                    base.castShadow = true;
                    scene.add(base);
                    
                    // العمود
                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224466, emissiveIntensity: 0.3 });
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.8, 6), pillarMat);
                    pillar.position.set(x, 0.5, z);
                    pillar.castShadow = true;
                    scene.add(pillar);
                    
                    // الكرة الضوئية
                    const orbMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.5 });
                    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), orbMat);
                    orb.position.set(x, 0.95, z);
                    scene.add(orb);
                    
                    pointsMeshes.push(orb);
                }
            }
            
            // ========== إنشاء شخصية بوبجي (واضحة وجميلة) ==========
            const characterGroup = new THREE.Group();
            
            // الجسم (سترة عسكرية)
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a7a5a, roughness: 0.3, metalness: 0.1 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.9, 8), bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            body.position.y = 0.45;
            characterGroup.add(body);
            
            // الرأس (بشرة)
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf5c4a0, roughness: 0.2 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), headMat);
            head.castShadow = true;
            head.position.y = 0.95;
            characterGroup.add(head);
            
            // خوذة عسكرية
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x5a6b3a, metalness: 0.6, roughness: 0.3 });
            const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.4, 8), helmetMat);
            helmet.position.y = 1.12;
            helmet.castShadow = true;
            characterGroup.add(helmet);
            
            // قناع/نظارات
            const visorMat = new THREE.MeshStandardMaterial({ color: 0x336699, metalness: 0.8 });
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), visorMat);
            visor.position.set(0, 1.0, 0.38);
            visor.castShadow = true;
            characterGroup.add(visor);
            
            // سلاح (بندقية)
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.7 });
            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 0.12), gunMat);
            gunBody.position.set(0.55, 0.55, 0.25);
            gunBody.castShadow = true;
            characterGroup.add(gunBody);
            
            const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 6), gunMat);
            gunBarrel.rotation.z = Math.PI / 2;
            gunBarrel.position.set(0.9, 0.55, 0.25);
            gunBarrel.castShadow = true;
            characterGroup.add(gunBarrel);
            
            const scope = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.1, 0.1), gunMat);
            scope.position.set(0.65, 0.62, 0.3);
            scope.castShadow = true;
            characterGroup.add(scope);
            
            // حقيبة ظهر
            const bagMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a });
            const bag = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.35), bagMat);
            bag.position.set(-0.4, 0.5, -0.3);
            bag.castShadow = true;
            characterGroup.add(bag);
            
            // ذراعان
            const armMat = new THREE.MeshStandardMaterial({ color: 0x4a7a5a });
            const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.55, 6), armMat);
            leftArm.position.set(-0.5, 0.75, 0);
            leftArm.castShadow = true;
            characterGroup.add(leftArm);
            
            const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.55, 6), armMat);
            rightArm.position.set(0.5, 0.75, 0);
            rightArm.castShadow = true;
            characterGroup.add(rightArm);
            
            characterGroup.position.set(0, 0, 0);
            characterGroup.castShadow = true;
            scene.add(characterGroup);
            playerMesh = characterGroup;
            
            // التحكم بالكاميرا
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.rotateSpeed = 1.0;
            controls.zoomSpeed = 0.8;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.target.set(0, 0.8, 0);
            
            // بدء التحريك
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            // تحديث موقع البداية
            const startX = (playerGridX - GRID_SIZE/2) * SPACING;
            const startZ = (playerGridY - GRID_SIZE/2) * SPACING;
            characterGroup.position.set(startX, 0, startZ);
            controls.target.set(startX, 0.8, startZ);
            camera.position.set(startX + 8, 6, startZ + 8);
        }
        
        // ========== أزرار التحكم ==========
        let moveState = { up: false, down: false, left: false, right: false };
        
        function handleMovement() {
            let dx = 0, dy = 0;
            if (moveState.up) dy = -1;
            if (moveState.down) dy = 1;
            if (moveState.left) dx = -1;
            if (moveState.right) dx = 1;
            if (dx !== 0 || dy !== 0) movePlayer(dx, dy);
        }
        
        // أزرار اللمس
        document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.up = true; });
        document.getElementById('btnUp').addEventListener('touchend', () => moveState.up = false);
        document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.down = true; });
        document.getElementById('btnDown').addEventListener('touchend', () => moveState.down = false);
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.left = true; });
        document.getElementById('btnLeft').addEventListener('touchend', () => moveState.left = false);
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); moveState.right = true; });
        document.getElementById('btnRight').addEventListener('touchend', () => moveState.right = false);
        
        // لوحة المفاتيح
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') moveState.up = true;
            if (e.key === 'ArrowDown') moveState.down = true;
            if (e.key === 'ArrowLeft') moveState.left = true;
            if (e.key === 'ArrowRight') moveState.right = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') moveState.up = false;
            if (e.key === 'ArrowDown') moveState.down = false;
            if (e.key === 'ArrowLeft') moveState.left = false;
            if (e.key === 'ArrowRight') moveState.right = false;
        });
        
        // تسجيل النقطة الحالية
        visited[playerGridX][playerGridY] = true;
        document.getElementById('visitedCount').innerHTML = visitedCount;
        document.getElementById('totalTiles').innerHTML = GRID_SIZE * GRID_SIZE;
        document.getElementById('playerPos').innerHTML = `(${playerGridX},${playerGridY})`;
        
        // بدء اللعبة
        init3D();
        setInterval(handleMovement, 120);
        
        // إغلاق POV بالضغط على ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePOV();
        });
        
        console.log('🎮 PUBG Mobile جاهزة! شخصية 3D + 64 نقطة + صور POV');
    </script>
</body>
</html>
